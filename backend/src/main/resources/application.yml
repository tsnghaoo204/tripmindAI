server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: tripmind-backend

  # Bí mật (khoá API, JWT_SECRET, mật khẩu DB) đặt trong file .env, KHÔNG đặt ở đây.
  # Chạy từ thư mục backend/ hay thư mục gốc đều đọc được .env ở gốc repo.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Enable Java 21 Virtual Threads
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tripmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    # Tắt: mọi DTO dựng xong trong giao dịch của service. Bật thì một lượt chat SSE 60 giây
    # giữ một kết nối CSDL suốt thời gian đó.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  # Lược đồ do Flyway quản lý: db/migration/V<n>__*.sql.
  # CSDL đã có bảng từ trước (chạy tay schemas.sql) thì được nhận làm mốc V1.
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# OpenAPI Swagger documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# JWT Authentication configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

# External Services configuration
tripmind:
  ai:
    # De trong thi tro ly tra 503 AI_NOT_CONFIGURED, phan con lai van chay.
    api-key: ${GEMINI_API_KEY:}
    # Gemini qua lop tuong thich OpenAI; doi nha cung cap = doi 3 dong nay.
    base-url: ${LLM_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    completions-path: ${LLM_COMPLETIONS_PATH:/chat/completions}
    model: ${LLM_MODEL:gemini-3.8-flash}
    temperature: 0.3
    # BR-502: tran moi luot hoi
    max-rounds: 8
    turn-timeout: 60s
    history-messages: 20
    tool-result-max-chars: 4000
    # BR-504
    max-search-results: 5
    # BR-601
    rate-limit-per-hour: 20
    # FR-707, FR-1201
    proposal-ttl: 30m
    undo-window: 10m
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:}
      # Places API (New) v1 - searchText / place details
      base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1}
      # Time Zone API: Places khong tra ve mui gio IANA, phai hoi rieng theo toa do
      timezone-url: ${GOOGLE_TIMEZONE_URL:https://maps.googleapis.com/maps/api/timezone/json}
      language: ${GOOGLE_PLACES_LANGUAGE:vi}
      max-results: ${GOOGLE_PLACES_MAX_RESULTS:10}
      # false = goi Google that. Bat len chi khi chay offline: client tra ve rong,
      # he thong chi con catalog trong CSDL.
      use-mock: ${USE_MOCK_PLACES:false}
  open-meteo:
    base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1}
    # API luu tru o ten mien khac: trung binh khi hau va ngay qua xa trong qua khu
    archive-base-url: ${OPEN_METEO_ARCHIVE_URL:https://archive-api.open-meteo.com/v1}
    forecast-days: 16
    past-days: 90
    climate-years: 3
    timeout: 5s
    cache-ttl: 3h
  trip:
    # BR-201: do dai toi da cua mot chuyen
    max-days: 30
    # BR-207: ngay co it nhat bay nhieu hoat dong thi tinh la "da len lich"
    planned-day-min-activities: 2
  # Goi y chi phi uoc tinh theo price_level cua Google (0-4), tinh theo nguoi.
  # Chi so trong danh sach = price_level. Tien te khong co bang thi khong goi y.
  cost-estimate:
    currencies:
      VND:
        rounding: 1000
        food:
          - { min: 0, max: 0 }
          - { min: 30000, max: 100000 }
          - { min: 100000, max: 300000 }
          - { min: 300000, max: 700000 }
          - { min: 700000, max: 2000000 }
        other:
          - { min: 0, max: 0 }
          - { min: 0, max: 100000 }
          - { min: 100000, max: 300000 }
          - { min: 300000, max: 800000 }
          - { min: 800000, max: 3000000 }
      USD:
        rounding: 1
        food:
          - { min: 0, max: 0 }
          - { min: 5, max: 15 }
          - { min: 15, max: 40 }
          - { min: 40, max: 90 }
          - { min: 90, max: 250 }
        other:
          - { min: 0, max: 0 }
          - { min: 0, max: 15 }
          - { min: 15, max: 40 }
          - { min: 40, max: 100 }
          - { min: 100, max: 300 }
  budget:
    # BR-403: vuot ti le nay thi canh bao NEAR_LIMIT, vuot 100% thi OVER
    near-limit-ratio: 0.9
    # Lam tron xuong han muc chi tieu moi ngay
    daily-rounding:
      VND: 1000
