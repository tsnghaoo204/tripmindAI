server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: tripmind-backend

  # Enable Java 21 Virtual Threads
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tripmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

# OpenAPI Swagger documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# JWT Authentication configuration
jwt:
  secret: ${JWT_SECRET:TripMindAISecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours in milliseconds

# External Services configuration
tripmind:
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:AIzaSyDaoHpQdz57DVOtpkZqQRr85afryUb-moE}
      model: ${GEMINI_MODEL:gemini-1.5-flash}
  google:
    places:
      api-key: ${GOOGLE_PLACES_API_KEY:AIzaSyChwrqvafQ_qRFgfcwA_ijJGx2qlVPJ5aM}
      # Places API (New) v1 - searchText / place details
      base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1}
      # Time Zone API: Places khong tra ve mui gio IANA, phai hoi rieng theo toa do
      timezone-url: ${GOOGLE_TIMEZONE_URL:https://maps.googleapis.com/maps/api/timezone/json}
      language: ${GOOGLE_PLACES_LANGUAGE:vi}
      max-results: ${GOOGLE_PLACES_MAX_RESULTS:10}
      # false = goi Google that. Bat len chi khi chay offline: client tra ve rong,
      # he thong chi con catalog trong CSDL.
      use-mock: ${USE_MOCK_PLACES:false}
  open-meteo:
    base-url: https://api.open-meteo.com/v1
  exchange-rate:
    base-url: https://open.er-api.com/v6
