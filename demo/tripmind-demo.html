<script>
"use strict";
/* =============================================================================
   7. Bảng điều khiển + Tạo chuyến 6 bước
   ========================================================================== */
function tripCard(t) {
  const b = budgetOf(t.id);
  const w = weatherOf(t.id);
  const before = t.phase === "BEFORE";
  const pct = Math.round((before ? t.planningProgress : t.progress.pct) * 100);
  const meterLabel = before ? "% đã lên lịch" : "% đã đi qua";
  const meterHint = before ? "Số ngày đã có ít nhất 2 hoạt động, chia tổng số ngày"
    : "Số hoạt động đã xong hoặc đã bỏ, chia tổng số hoạt động";
  /* Chỉ cảnh báo thời tiết với ngày có source = FORECAST — ADS-40 §D.4 */
  const rain = w.days.filter(x => x.source === "FORECAST" && x.precipitationProbability >= 0.6);
  const warn = [];
  if (b.warningLevel === "NEAR_LIMIT") warn.push('<span class="chip w">Sắp chạm ngân sách</span>');
  if (b.warningLevel === "OVER") warn.push('<span class="chip c">Vượt ngân sách</span>');
  if (rain.length) warn.push('<span class="chip w">Dự báo mưa ngày ' + fmtD(rain[0].date) + "</span>");
  return '<a class="card pad stack" href="#/app/trips/' + t.id + '" style="gap:11px;text-decoration:none;color:inherit">'
    + '<div class="spread" style="align-items:flex-start"><div>'
    + '<div class="dp" style="font-size:21px">' + esc(t.destination.name) + "</div>"
    + '<div class="sub">' + esc(t.name) + "</div></div>"
    + '<span class="chip' + (t.isPast ? "" : " t") + '">' + (t.isPast ? "Đã qua" : "Sắp tới") + "</span></div>"
    + '<div class="row wr" style="gap:6px;font-size:13.5px;color:var(--ink-2)">'
    + "<span>" + fmtD(t.startDate) + " — " + fmtD(t.endDate) + '</span><span class="dot">·</span>'
    + "<span>" + t.daysCount + ' ngày</span><span class="dot">·</span><span>' + t.travelers + " người</span>"
    + '<span style="white-space:nowrap"><span class="dot">·</span> ' + (t.budget ? '<span class="num">' + money(t.budget, t.currency) + "</span>" : '<span class="hedge">Chưa đặt ngân sách</span>') + "</span>"
    + "</div>"
    + '<div class="stack s" style="gap:5px"><div class="meter"><i class="' + (before ? "a" : "b") + '" style="width:' + pct + '%"></i></div>'
    + '<div class="spread"><span class="tiny" title="' + meterHint + '">' + pct + meterLabel + "</span>"
    + '<span class="tiny">' + tripActs(t.id).length + " hoạt động</span></div></div>"
    + (warn.length ? '<div class="row wr" style="gap:5px">' + warn.join("") + "</div>" : "")
    + (t.phase === "AFTER" ? '<span class="tiny" style="color:var(--teal);font-weight:600">Xem lại chuyến này →</span>' : "")
    + "</a>";
}

async function vDashboard() {
  const u = S.db.users.find(x => x.id === S.session.userId);
  const hour = new Date().getHours();
  const greet = hour < 11 ? "Chào buổi sáng" : hour < 14 ? "Chào buổi trưa" : hour < 18 ? "Chào buổi chiều" : "Chào buổi tối";
  shell('<div class="wrap stack" style="gap:26px">'
    + '<div class="spread wr"><div><h1 class="dp" style="font-size:30px">' + greet + ", " + esc(u.name.split(" ").slice(-1)[0]) + "!</h1>"
    + '<p class="sub">Hôm nay là ' + fmtDLong(TODAY) + " năm " + d(TODAY).getUTCFullYear() + ' <span class="hedge" title="Bản demo cố định ngày hôm nay để kịch bản thời tiết chạy đúng">(ngày cố định của bản demo)</span></p></div>'
    + '<a class="btn p" href="#/app/trips/new">＋ Tạo chuyến đi</a></div>'
    + '<section class="stack" style="gap:12px"><h2 class="eyebrow">Chuyến sắp tới</h2><div id="up">' + skeletonBlock(2) + "</div></section>"
    + '<section class="stack" style="gap:12px"><h2 class="eyebrow">Chuyến đã qua</h2><div id="past">' + skeletonBlock(1) + "</div></section>"
    + "</div>");
  const grid = list => '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(290px,1fr))">' + list.map(tripCard).join("") + "</div>";
  try {
    const [up, past] = await Promise.all([api.trips("upcoming"), api.trips("past")]);
    $("#up").innerHTML = up.length ? grid(up)
      : '<div class="empty"><p><strong>Chưa có chuyến đi nào sắp tới.</strong> Tạo chuyến đầu tiên rồi để trợ lý dựng lịch trình giúp bạn.</p><a class="btn p s" href="#/app/trips/new">Tạo chuyến đi</a></div>';
    $("#past").innerHTML = past.length ? grid(past)
      : '<div class="empty"><p>Chưa có chuyến nào đã kết thúc. Mục này sẽ có nội dung sau chuyến đi đầu tiên của bạn.</p></div>';
  } catch (e) { handle(e); }
}

/* ── Tạo chuyến — 6 bước, giữ trạng thái ở máy khách, MỘT lời gọi ở bước cuối ── */
const PREF_KEYS = ["FOOD", "BEACH", "NATURE", "HISTORY", "PHOTOGRAPHY", "NIGHTLIFE", "SHOPPING", "ADVENTURE", "CULTURE", "RELAX"];
let WZ = null;
function vWizard() {
  const me = api.me();
  if (!WZ) WZ = {
    step: 1, destId: null, name: "", startDate: "", endDate: "", travelers: 2, budget: "", currency: "VND",
    preferences: (me.preferences.preferences || []).slice(),
    travelStyle: me.preferences.travelStyle || "BALANCED", budgetPreference: me.preferences.budgetPreference || "MODERATE",
    err: ""
  };
  shell('<div class="wrap narrow stack" style="gap:20px">'
    + '<div class="spread wr"><div><h1 class="dp" style="font-size:27px">Tạo chuyến đi</h1>'
    + '<p class="sub">Sáu bước. Chưa gọi trợ lý ở đây — chuyến được tạo trước, sinh lịch trình là việc riêng sau đó.</p></div>'
    + '<a class="btn g s" href="#/app">Huỷ</a></div>'
    + '<div class="steps" id="wz-steps"></div>'
    + '<div class="card pad" id="wz-body"></div></div>');
  drawWizard();
}
const WZ_TITLES = ["Điểm đến", "Ngày đi và về", "Số người và tên chuyến", "Ngân sách", "Sở thích", "Phong cách đi"];
function drawWizard() {
  $("#wz-steps").innerHTML = WZ_TITLES.map((t, i) =>
    '<span class="stp' + (WZ.step === i + 1 ? " on" : WZ.step > i + 1 ? " ok" : "") + '"><span class="mo">' + (i + 1) + "</span>" + t + "</span>").join("");
  const b = $("#wz-body");
  let inner = "";
  if (WZ.step === 1) {
    inner = '<div class="stack"><div class="field"><label for="wz-q">Bạn muốn đi đâu?</label>'
      + '<input class="inp" id="wz-q" placeholder="Gõ để lọc: Đà Nẵng, Đà Lạt, Hội An…" autocomplete="off"></div>'
      + '<div id="wz-dests" class="opts" style="max-height:320px;overflow:auto"></div>'
      + '<p class="tiny">Phải chọn một mục trong danh sách — chuyến đi cần điểm đến có toạ độ thật để tra thời tiết và tính khoảng cách.</p></div>';
  } else if (WZ.step === 2) {
    inner = '<div class="stack"><div class="row wr" style="gap:14px;align-items:flex-end">'
      + '<div class="field" style="flex:1;min-width:150px"><label for="wz-s">Ngày đi</label><input class="inp" type="date" id="wz-s" value="' + WZ.startDate + '"></div>'
      + '<div class="field" style="flex:1;min-width:150px"><label for="wz-e">Ngày về</label><input class="inp" type="date" id="wz-e" value="' + WZ.endDate + '"></div></div>'
      + '<div id="wz-datenote" class="tiny"></div>'
      + '<p class="tiny">Ngày về không được trước ngày đi. Tối đa 30 ngày một chuyến. Kiểm ngay tại bước này, không để tới bước cuối mới báo.</p></div>';
  } else if (WZ.step === 3) {
    inner = '<div class="stack"><div class="field"><label for="wz-t">Số người</label>'
      + '<input class="inp" type="number" id="wz-t" min="1" max="20" value="' + WZ.travelers + '" style="max-width:120px"></div>'
      + '<div class="field"><label for="wz-n">Tên chuyến đi</label><input class="inp" id="wz-n" value="' + esc(WZ.name) + '" placeholder="ví dụ: Đà Lạt cuối tuần"></div>'
      + '<p class="tiny">Số người dùng để nhân chi phí vé khi trợ lý ước tính. Tên chuyến chỉ để bạn dễ nhận ra trong danh sách.</p></div>';
  } else if (WZ.step === 4) {
    inner = '<div class="stack"><div class="row wr" style="gap:14px;align-items:flex-end">'
      + '<div class="field" style="flex:1;min-width:180px"><label for="wz-b">Ngân sách dự kiến</label>'
      + '<input class="inp num" type="number" id="wz-b" min="0" step="100000" value="' + WZ.budget + '" placeholder="Bỏ trống nếu chưa quyết"></div>'
      + '<div class="field" style="width:120px"><label for="wz-c">Tiền tệ</label><select class="inp" id="wz-c"><option value="VND"' + (WZ.currency === "VND" ? " selected" : "") + '>VND</option><option value="USD"' + (WZ.currency === "USD" ? " selected" : "") + ">USD</option></select></div></div>"
      + '<div id="wz-bprev" class="tiny"></div>'
      + '<div class="field"><label>Mức chi</label><div class="opts">' + ["BUDGET", "MODERATE", "LUXURY"].map(k =>
        '<button type="button" class="opt' + (WZ.budgetPreference === k ? " on" : "") + '" data-act="wz-bp" data-k="' + k + '"><div><div class="h">' + BUDGET_LABEL[k] + '</div><div class="d">'
        + { BUDGET: "Ưu tiên chỗ rẻ, ăn quán bình dân", MODERATE: "Cân đối giữa giá và trải nghiệm", LUXURY: "Ưu tiên tiện nghi, không ngại chi" }[k] + "</div></div></button>").join("") + "</div></div>"
      + '<p class="tiny">Bỏ trống ngân sách cũng được. Khi đó màn Ngân sách sẽ ghi “Chưa đặt ngân sách” chứ không hiện 0 ₫.</p></div>';
  } else if (WZ.step === 5) {
    inner = '<div class="stack"><div class="field"><label>Bạn thích gì khi đi chơi?</label>'
      + '<div class="row wr" style="gap:7px">' + PREF_KEYS.map(k => '<button type="button" class="tagbtn' + (WZ.preferences.includes(k) ? " on" : "") + '" data-act="wz-pref" data-k="' + k + '">' + PREF_LABEL[k] + "</button>").join("") + "</div></div>"
      + '<p class="tiny">Điền sẵn từ sở thích mặc định trong hồ sơ của bạn. Chọn nhiều được, bỏ trống cũng được.</p></div>';
  } else {
    const dest = S.db.destinations.find(x => x.id === WZ.destId);
    const nd = WZ.startDate && WZ.endDate ? diffDays(WZ.startDate, WZ.endDate) + 1 : 0;
    inner = '<div class="stack"><div class="field"><label>Nhịp đi</label><div class="opts">' + ["RELAXED", "BALANCED", "FAST_PACED"].map(k =>
      '<button type="button" class="opt' + (WZ.travelStyle === k ? " on" : "") + '" data-act="wz-style" data-k="' + k + '"><div><div class="h">' + STYLE_LABEL[k] + '</div><div class="d">'
      + { RELAXED: "2–3 hoạt động mỗi ngày, nhiều thời gian trống", BALANCED: "4–5 hoạt động, vừa đi vừa nghỉ", FAST_PACED: "6 hoạt động trở lên, đi kín ngày" }[k] + "</div></div></button>").join("") + "</div></div>"
      + '<hr class="rule"><div class="stack s"><div class="eyebrow">Xem lại</div>'
      + '<table class="tbl" style="border:1px solid var(--line);border-radius:8px;overflow:hidden">'
      + [["Điểm đến", dest ? dest.name + " · " + dest.region : "—"],
      ["Thời gian", WZ.startDate ? fmtD(WZ.startDate) + " — " + fmtD(WZ.endDate) + " (" + nd + " ngày)" : "—"],
      ["Số người", WZ.travelers + " người"],
      ["Tên chuyến", WZ.name || (dest ? dest.name : "")],
      ["Ngân sách", WZ.budget === "" ? '<span class="hedge">Chưa đặt</span>' : money(Number(WZ.budget) * (MINOR[WZ.currency] || 1), WZ.currency)],
      ["Sở thích", WZ.preferences.length ? WZ.preferences.map(k => PREF_LABEL[k]).join(", ") : '<span class="hedge">Chưa chọn</span>'],
      ["Nhịp đi", STYLE_LABEL[WZ.travelStyle]]]
        .map(r => "<tr><td style='color:var(--muted);width:120px'>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("") + "</table></div>"
      + '<p class="tiny">Bấm “Tạo chuyến đi” là gửi <b>một lời gọi duy nhất</b> gồm cả sáu bước. Hệ thống sinh sẵn đủ số ngày trống trong cùng giao dịch. Chưa gọi AI ở bước này.</p></div>';
  }
  b.innerHTML = inner
    + (WZ.err ? '<div class="err-txt" style="margin-top:12px"><span>⚠</span><span>' + esc(WZ.err) + "</span></div>" : "")
    + '<div class="spread" style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">'
    + '<button class="btn" data-act="wz-back"' + (WZ.step === 1 ? " disabled" : "") + ">← Quay lại</button>"
    + '<button class="btn p" data-act="wz-next" id="wz-next">' + (WZ.step === 6 ? "Tạo chuyến đi" : "Tiếp tục →") + "</button></div>";
  if (WZ.step === 1) { drawDests(""); $("#wz-q").addEventListener("input", e => drawDests(e.target.value)); }
  if (WZ.step === 2) { ["wz-s", "wz-e"].forEach(id => $("#" + id).addEventListener("change", syncDates)); syncDates(); }
  if (WZ.step === 4) { $("#wz-b").addEventListener("input", syncBudgetPreview); syncBudgetPreview(); }
}
function drawDests(q) {
  const n = norm(q);
  const list = S.db.destinations.filter(x => !n || norm(x.name).includes(n) || norm(x.region).includes(n));
  $("#wz-dests").innerHTML = list.length ? list.map(x =>
    '<button type="button" class="opt' + (WZ.destId === x.id ? " on" : "") + '" data-act="wz-dest" data-k="' + x.id + '">'
    + '<div><div class="h">' + esc(x.name) + ' <span class="chip" style="margin-left:4px">' + esc(x.region) + '</span></div><div class="d">' + esc(x.desc) + "</div></div></button>").join("")
    : '<div class="empty"><p>Không có điểm đến nào khớp “' + esc(q) + '”. Bản demo có sẵn 15 điểm đến trong nước.</p></div>';
}
function syncDates() {
  WZ.startDate = $("#wz-s").value; WZ.endDate = $("#wz-e").value;
  const box = $("#wz-datenote"); if (!box) return;
  if (!WZ.startDate || !WZ.endDate) { box.innerHTML = ""; return; }
  if (WZ.endDate < WZ.startDate) { box.innerHTML = '<span class="err-txt">⚠ Ngày về đang trước ngày đi.</span>'; return; }
  const n = diffDays(WZ.startDate, WZ.endDate) + 1;
  box.innerHTML = n > 30 ? '<span class="err-txt">⚠ ' + n + " ngày — vượt giới hạn 30 ngày một chuyến.</span>"
    : "<b>" + n + " ngày</b> · " + fmtDLong(WZ.startDate) + " → " + fmtDLong(WZ.endDate);
}
function syncBudgetPreview() {
  const v = $("#wz-b").value; WZ.budget = v;
  $("#wz-bprev").innerHTML = v === "" ? '<span class="hedge">Bỏ trống — sẽ hiện “Chưa đặt ngân sách”, không phải 0 ₫.</span>'
    : "Hiển thị trong ứng dụng: <b class='num'>" + money(Number(v) * (MINOR[$("#wz-c").value] || 1), $("#wz-c").value) + "</b>";
}
Object.assign(actions, {
  "wz-dest"(el) { WZ.destId = Number(el.dataset.k); WZ.err = ""; if (!WZ.name) WZ.name = S.db.destinations.find(x => x.id === WZ.destId).name; drawWizard(); },
  "wz-pref"(el) { const k = el.dataset.k; const i = WZ.preferences.indexOf(k); i < 0 ? WZ.preferences.push(k) : WZ.preferences.splice(i, 1); drawWizard(); },
  "wz-style"(el) { WZ.travelStyle = el.dataset.k; drawWizard(); },
  "wz-bp"(el) { WZ.budgetPreference = el.dataset.k; drawWizard(); },
  "wz-back"() { if (WZ.step > 1) { WZ.step--; WZ.err = ""; drawWizard(); } },
  async "wz-next"() {
    WZ.err = "";
    if (WZ.step === 1 && !WZ.destId) { WZ.err = "Chọn một điểm đến trong danh sách."; return drawWizard(); }
    if (WZ.step === 2) {
      WZ.startDate = $("#wz-s").value; WZ.endDate = $("#wz-e").value;
      if (!WZ.startDate || !WZ.endDate) { WZ.err = "Nhập cả ngày đi và ngày về."; return drawWizard(); }
      if (WZ.endDate < WZ.startDate) { WZ.err = "Ngày về không được trước ngày đi."; return drawWizard(); }
      if (diffDays(WZ.startDate, WZ.endDate) + 1 > 30) { WZ.err = "Chuyến đi tối đa 30 ngày."; return drawWizard(); }
    }
    if (WZ.step === 3) {
      WZ.travelers = Number($("#wz-t").value); WZ.name = $("#wz-n").value.trim();
      if (!(WZ.travelers >= 1)) { WZ.err = "Số người phải từ 1 trở lên."; return drawWizard(); }
      if (!WZ.name) WZ.name = S.db.destinations.find(x => x.id === WZ.destId).name;
    }
    if (WZ.step === 4) {
      WZ.budget = $("#wz-b").value; WZ.currency = $("#wz-c").value;
      if (WZ.budget !== "" && Number(WZ.budget) < 0) { WZ.err = "Ngân sách không được âm."; return drawWizard(); }
    }
    if (WZ.step < 6) { WZ.step++; return drawWizard(); }
    const btn = $("#wz-next"); btn.disabled = true; btn.textContent = "Đang tạo…";
    try {
      const t = await api.createTrip({
        destId: WZ.destId, name: WZ.name, startDate: WZ.startDate, endDate: WZ.endDate, travelers: WZ.travelers,
        budget: WZ.budget === "" ? null : Number(WZ.budget) * (MINOR[WZ.currency] || 1), currency: WZ.currency,
        travelStyle: WZ.travelStyle, budgetPreference: WZ.budgetPreference, preferences: WZ.preferences
      });
      WZ = null;
      toast("Đã tạo chuyến đi, sinh sẵn " + t.daysCount + " ngày trống");
      nav("#/app/trips/" + t.id);
    } catch (e) { WZ.err = e.message; btn.disabled = false; btn.textContent = "Tạo chuyến đi"; drawWizard(); }
  }
});
</script>

<script>
"use strict";
/* =============================================================================
   8. Không gian chuyến đi — vỏ + Tổng quan
   ========================================================================== */
const TABS = [["overview", "Tổng quan", ""], ["itinerary", "Lịch trình", "/itinerary"], ["map", "Bản đồ", "/map"],
["budget", "Ngân sách", "/budget"], ["places", "Địa điểm", "/places"], ["assistant", "Trợ lý", "/assistant"],
["review", "Nhìn lại", "/review", t => t.phase === "AFTER"]];
let CUR = null;   // chuyến đang mở

const PHASE_LABEL = { BEFORE: "Chưa đi", DURING: "Đang đi", AFTER: "Đã xong" };
async function vTrip(id, tab) {
  let t;
  try { t = await api.trip(id); } catch (e) { handle(e); nav("#/app"); return; }
  CUR = t;
  const sub = '<div class="tripbar"><div class="in">'
    + '<div class="spread wr" style="gap:12px"><div class="row wr" style="gap:10px">'
    + '<a class="btn g s" href="#/app" aria-label="Về danh sách chuyến">←</a>'
    + '<div><div class="dp" style="font-size:22px">' + esc(t.destination.name) + " · " + fmtD(t.startDate) + " — " + fmtD(t.endDate) + "</div>"
    + '<div class="sub">' + esc(t.name) + " · " + t.daysCount + " ngày · " + t.travelers + " người"
    + ' · <span class="chip' + (t.phase === "DURING" ? " t" : "") + '">' + PHASE_LABEL[t.phase] + "</span>"
    /* Bật tay thì phải nói ra. Một chip ghi "Đang đi" trong khi hôm nay chưa tới ngày
       khởi hành mà không chú thích gì là giao diện nói sai. */
    + (t.phaseIsManual ? ' <span class="chip w" title="Giai đoạn này do bạn tự đặt, không suy từ ngày">bạn tự đặt</span>' : "")
    + "</div></div></div>"
    + '<div class="row wr" style="gap:6px"><button class="btn s" data-act="phase-menu">Đổi giai đoạn</button>'
    + '<button class="btn p" data-act="drawer-open">Hỏi trợ lý</button></div></div>'
    + '<nav class="tabs">' + TABS.filter(x => !x[3] || x[3](t)).map(x => '<a class="tab' + (tab === x[0] ? " on" : "") + '" href="#/app/trips/' + t.id + x[2] + '">' + x[1] + "</a>").join("") + "</nav>"
    + "</div></div>";
  shell('<div class="wrap wide" id="tabview">' + skeletonBlock(4) + "</div>", sub);
  if (tab === "review" && t.phase !== "AFTER") {
    toast("Chuyến này chưa kết thúc nên chưa có gì để nhìn lại", "warn");
    nav("#/app/trips/" + t.id); return;
  }
  const fn = { overview: tabOverview, itinerary: tabItinerary, map: tabMap, budget: tabBudget, places: tabPlaces, assistant: tabAssistant, review: tabReview }[tab];
  try { await fn(t); } catch (e) { handle(e); }
}

function weatherRow(x) {
  const fc = x.source === "FORECAST";
  const pct = Math.round(x.precipitationProbability * 100);
  return '<div class="row" style="gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline">'
    + '<span class="mo" style="font-size:12.5px;width:46px;color:var(--muted)">' + fmtD(x.date) + "</span>"
    + '<span class="num" style="font-weight:600;width:52px' + (fc ? "" : ";color:var(--muted)") + '">' + x.tempMax + "°C</span>"
    + '<span style="flex:1;font-size:13.5px' + (fc ? "" : ";color:var(--muted)") + '">'
    + (fc ? (WCODE[x.weatherCode] || "—") + " · mưa " + pct + "%" : "hay mưa " + pct + "% số ngày trong tháng " + (d(x.date).getUTCMonth() + 1))
    + "</span>"
    + (fc ? '<span class="src fc">◉ Dự báo</span>' : '<span class="src cn">◌ Trung bình khí hậu</span>')
    + "</div>";
}
function weatherBlock(w) {
  if (w.reason === "PROVIDER_UNAVAILABLE")
    return '<div class="empty"><p><strong>Không tra được thời tiết lúc này.</strong> Dịch vụ dự báo không trả lời. Đây khác với “trời đẹp” — hệ thống đơn giản là không có số liệu nào cho bạn xem.</p><button class="btn s" data-act="reload">Thử lại</button></div>';
  if (w.reason === "PAST_TRIP")
    return '<div class="empty"><p>Chuyến này đã kết thúc nên không hiển thị thời tiết. Dự báo cho quá khứ không có ý nghĩa gì.</p></div>';
  if (!w.days.length) return '<div class="empty"><p>Chưa có dữ liệu thời tiết cho chuyến này.</p></div>';
  const anyCN = w.days.some(x => x.source === "CLIMATE_NORMAL");
  return w.days.map(weatherRow).join("")
    + (anyCN ? '<p class="tiny" style="margin-top:10px">Dòng ghi <b>Dự báo</b> là số liệu dự báo thật cho đúng ngày đó. Dòng ghi <b>Trung bình khí hậu</b> là thống kê nhiều năm cho tháng đó — nhà cung cấp chỉ dự báo tới ' + fmtD(FORECAST_LIMIT) + ". Hai loại số liệu này không gộp làm một được.</p>" : "");
}

async function tabOverview(t) {
  const [b, w, it] = await Promise.all([api.budget(t.id), api.weather(t.id), api.itinerary(t.id)]);
  const nAct = it.days.reduce((s, x) => s + x.activities.length, 0);
  const empty = nAct === 0;
  const box = $("#tabview");
  const bwarn = b.warningLevel === "OVER" ? '<span class="chip c">Vượt ngân sách</span>' : b.warningLevel === "NEAR_LIMIT" ? '<span class="chip w">Đã dùng hơn 90%</span>' : "";
  box.innerHTML = '<div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start">'
    + '<div class="stack">'
    + (empty ? '<div class="card pad stack" style="gap:12px;border-color:var(--teal-line);background:var(--teal-soft)">'
      + '<div><div class="eyebrow" style="color:var(--teal)">Chuyến này còn trống</div>'
      + '<h3 class="dp" style="font-size:21px;margin-top:4px">Sinh lịch trình bằng AI</h3>'
      + '<p style="font-size:13.5px;color:var(--ink-2);max-width:56ch;margin-top:6px">Trợ lý sẽ tra địa điểm quanh ' + esc(t.destination.name)
      + ', dựng bản nháp cho cả ' + t.daysCount + ' ngày, rồi <b>đối chiếu từng tên địa điểm với kết quả tìm kiếm thật</b> — chỗ nào không đối chiếu được sẽ bị loại, không đưa vào lịch. Mất khoảng một phút, chạy nền, bạn xem tab khác được.</p></div>'
      + '<div class="row"><button class="btn p" data-act="ai-generate">Sinh lịch trình</button>'
      + '<button class="btn" data-act="add-activity" data-day="1">Tự thêm hoạt động</button></div>'
      + '<div id="gen-progress"></div></div>' : "")
    + '<div class="card pad stack" style="gap:14px"><div class="spread"><h3 style="font-size:16px">Ngân sách</h3>' + bwarn
    + '<a class="btn g s" href="#/app/trips/' + t.id + '/budget">Chi tiết →</a></div>'
    + (t.budget == null
      ? '<div class="empty"><p><strong>Chưa đặt ngân sách cho chuyến này.</strong> Đặt một con số thì hệ thống cảnh báo được khi bạn sắp vượt. Không đặt thì vẫn dùng bình thường, chỉ là không có mốc để so.</p><button class="btn s p" data-act="set-budget">Đặt ngân sách</button></div>'
      : '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px">'
      + statTile("Ngân sách", money(b.budget, b.currency), "")
      + statTile("Ước tính", money(b.estimatedTotal, b.currency), "từ chi phí bạn nhập cho từng hoạt động")
      + statTile("Đã chi thực tế", b.hasExpenses ? money(b.actualTotal, b.currency) : null, b.hasExpenses ? "tổng các khoản bạn đã ghi" : "Chưa ghi chi tiêu nào")
      + statTile("Còn lại", money(b.remaining, b.currency), "ngân sách trừ đi số lớn hơn giữa ước tính và thực tế")
      + "</div>")
    + "</div>"
    + '<div class="card pad stack" style="gap:10px"><div class="spread"><h3 style="font-size:16px">Lịch trình</h3>'
    + '<a class="btn g s" href="#/app/trips/' + t.id + '/itinerary">Mở lịch trình →</a></div>'
    + (empty ? '<div class="empty"><p><strong>Chưa có hoạt động nào.</strong> Cả ' + t.daysCount + " ngày đều trống. Sinh bằng AI hoặc tự thêm từng hoạt động đều được.</p></div>"
      : '<div class="stack s">' + it.days.map(day =>
        '<div class="row" style="gap:10px;padding:7px 0;border-bottom:1px solid var(--line)">'
        + '<span class="mo" style="font-size:12px;color:var(--muted);width:80px">Ngày ' + day.dayNumber + "</span>"
        + '<span class="sub" style="width:52px">' + fmtD(day.date) + "</span>"
        + '<span style="flex:1;font-size:13.5px">' + (day.activities.length
          ? esc(day.activities.slice(0, 3).map(a => a.title).join(" · ")) + (day.activities.length > 3 ? " …" : "")
          : '<span class="hedge">Ngày này chưa có hoạt động</span>') + "</span>"
        + '<span class="chip">' + day.activities.length + "</span></div>").join("") + "</div>")
    + "</div></div>"

    + '<div class="stack">'
    + '<div class="card pad stack" style="gap:6px"><h3 style="font-size:16px;margin-bottom:4px">Thời tiết</h3>' + weatherBlock(w) + "</div>"
    + '<div class="card pad stack" style="gap:10px"><h3 style="font-size:16px">Thiết lập chuyến</h3>'
    + '<table class="tbl" style="border:1px solid var(--line);border-radius:8px;overflow:hidden">'
    + [["Nhịp đi", STYLE_LABEL[t.travelStyle] || "—"], ["Mức chi", BUDGET_LABEL[t.budgetPreference] || "—"],
    ["Sở thích", (t.preferences || []).length ? t.preferences.map(k => PREF_LABEL[k] || k).join(", ") : '<span class="hedge">Chưa chọn</span>'],
    (t.phase === "BEFORE"
      ? ["Đã lên lịch", Math.round(t.planningProgress * 100) + "% <span class='tiny'>(" + it.days.filter(x => x.activities.length >= 2).length + "/" + it.days.length + " ngày có từ 2 hoạt động)</span>"]
      : ["Đã đi qua", Math.round(t.progress.pct * 100) + "% <span class='tiny'>(" + t.progress.done + " xong"
        + (t.progress.skipped ? ", " + t.progress.skipped + " bỏ" : "") + " trên " + t.progress.total + " hoạt động)</span>"])]
      .map(r => "<tr><td style='color:var(--muted);width:104px'>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("") + "</table>"
    + '<div class="card pad stack" style="gap:10px"><div class="spread"><h3 style="font-size:16px">Ràng buộc cứng</h3>'
    + '<button class="btn s" data-act="constraints-edit">Sửa</button></div>'
    + (function () {
      const list = t.constraints || [];
      if (!list.length) return '<div class="empty"><p><strong>Chưa đặt ràng buộc nào.</strong> Đặt kiểu “ngày cuối phải xong trước 18:00” hay “mỗi ngày đi không quá 40 km” thì trợ lý phải tôn trọng khi dựng phương án — và phải nói rõ nếu không tôn trọng được.</p></div>';
      const chk = checkConstraints(t.id, []);
      return '<div class="stack s">' + chk.map(c => '<div style="display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:13px">'
        + '<span style="color:var(--' + (c.ok ? "teal" : "brick") + ')">' + (c.ok ? "✓" : "✕") + "</span>"
        + "<div><div>" + esc(c.label) + '</div><div class="tiny">' + esc(c.detail) + "</div></div></div>").join("") + "</div>"
        + (chk.some(c => !c.ok) ? '<p class="tiny">Lịch trình hiện tại đang phạm ràng buộc. Hệ thống <b>không tự sửa</b> — hỏi trợ lý để nó dựng phương án, rồi bạn duyệt.</p>' : "");
    })()
    + "</div>"
    + '<div class="row wr"><button class="btn s" data-act="drawer-open">Hỏi trợ lý</button>'
    + '<button class="btn s d" data-act="delete-trip" data-id="' + t.id + '">Xoá chuyến</button></div></div>'
    + "</div></div>"
    + '<style>@media(max-width:900px){#tabview>.grid{grid-template-columns:1fr !important}}</style>';
}
function statTile(label, value, hint) {
  return '<div class="stack" style="gap:2px"><div class="eyebrow">' + label + "</div>"
    + (value == null
      ? '<div class="hedge" style="font-size:14px;padding:4px 0">' + hint + "</div>"
      : '<div class="num dp" style="font-size:22px">' + value + "</div>"
      + (hint ? '<div><span class="tiny est" title="' + esc(hint) + '">' + hint + "</span></div>" : ""))
    + "</div>";
}

Object.assign(actions, {
  reload() { render(); },
  async "delete-trip"(el) {
    if (!confirm("Xoá chuyến đi này? Lịch trình và chi tiêu đi kèm cũng mất.")) return;
    try { await api.deleteTrip(el.dataset.id); toast("Đã xoá chuyến đi"); nav("#/app"); } catch (e) { handle(e); }
  },
  "constraints-edit"() {
    const cur = (S.db.trips.find(x => x.id === CUR.id).constraints) || [];
    const val = k => { const c = cur.find(x => x.kind === k); return c ? c.value : ""; };
    openModal({
      title: "Ràng buộc cứng cho chuyến này",
      body: '<p class="tiny">Trợ lý phải tôn trọng những điều kiện này khi dựng phương án. Bỏ trống là không đặt.</p>'
        + '<div class="stack" style="gap:12px">'
        + Object.keys(CONSTRAINTS).map(k => {
          const c = CONSTRAINTS[k];
          return '<div class="field"><label for="cs-' + k + '">' + c.label + "</label>"
            + '<div class="row" style="gap:8px"><input class="inp" id="cs-' + k + '" type="' + c.input + '" value="' + val(k) + '" placeholder="' + c.def + '" style="max-width:170px">'
            + '<span class="tiny" style="align-self:center">' + c.unit + "</span></div></div>";
        }).join("") + "</div>"
        + '<p class="tiny">Khi một phương án không giữ được ràng buộc, thẻ của nó sẽ ghi rõ phạm cái gì và lệch bao nhiêu — chứ hệ thống không lặng lẽ bỏ qua để phương án trông đẹp hơn.</p>',
      footer: '<button class="btn" data-act="modal-close">Huỷ</button><button class="btn p" data-act="constraints-save">Lưu</button>'
    });
  },
  async "constraints-save"() {
    const list = Object.keys(CONSTRAINTS).map(k => ({ kind: k, value: $("#cs-" + k).value })).filter(c => c.value !== "");
    try { await api.setConstraints(CUR.id, list); closeModal(); toast(list.length ? "Đã lưu " + list.length + " ràng buộc" : "Đã bỏ hết ràng buộc"); Tour.mark("constraints"); render(); }
    catch (e) { handle(e); }
  },
  "set-budget"() {
    openModal({
      title: "Đặt ngân sách",
      body: '<form id="bgf" class="stack" style="gap:12px"><div class="row" style="gap:10px;align-items:flex-end">'
        + '<div class="field" style="flex:1"><label for="bg-a">Số tiền</label><input class="inp num" id="bg-a" type="number" min="0" step="100000" placeholder="8000000"></div>'
        + '<div class="field" style="width:110px"><label for="bg-c">Tiền tệ</label><select class="inp" id="bg-c"><option>VND</option><option>USD</option></select></div></div>'
        + '<p class="tiny">Vượt ngân sách sẽ <b>không bị chặn</b>. Hệ thống chỉ cảnh báo, bạn vẫn thêm chi tiêu bình thường.</p></form>',
      footer: '<button class="btn" data-act="modal-close">Huỷ</button><button class="btn p" data-act="save-budget">Lưu</button>'
    });
  },
  async "save-budget"() {
    const v = $("#bg-a").value, c = $("#bg-c").value;
    if (v === "" || Number(v) < 0) { toast("Nhập một số tiền không âm", "warn"); return; }
    const t = S.db.trips.find(x => x.id === CUR.id);
    t.budget = Number(v) * (MINOR[c] || 1); t.currency = c; save();
    closeModal(); toast("Đã đặt ngân sách " + money(t.budget, c)); render();
  },
  async "ai-generate"(el) {
    el.disabled = true;
    const box = $("#gen-progress");
    const jobId = AI.generate(CUR.id);
    box.innerHTML = '<div class="plain pad stack" style="gap:8px;background:var(--surface)">'
      + '<div class="spread"><span class="eyebrow">Đang chạy nền</span><span class="mo tiny" id="gp-pct">5%</span></div>'
      + '<div class="meter"><i class="a" id="gp-bar" style="width:5%"></i></div>'
      + '<div class="tiny" id="gp-step">Đang khởi động…</div></div>';
    const poll = setInterval(() => {
      const j = AI.job(jobId); if (!j) return;
      $("#gp-pct").textContent = Math.round(j.progress * 100) + "%";
      $("#gp-bar").style.width = Math.round(j.progress * 100) + "%";
      $("#gp-step").textContent = j.step;
      if (j.state === "SUCCEEDED") {
        clearInterval(poll);
        const r = j.result;
        box.innerHTML = '<div class="plain pad stack" style="gap:9px;background:var(--surface)">'
          + '<div class="row"><span class="chip t">✓ Xong</span><span class="tiny">Đã thêm ' + r.added + " hoạt động vào " + r.days + " ngày</span></div>"
          + '<div class="tiny"><b>' + r.rejected.length + " địa điểm bị loại</b> vì mô hình nhắc tới nhưng không đối chiếu được với kết quả tìm kiếm thật: "
          + r.rejected.map(x => "<i>" + esc(x.name) + "</i>").join(", ") + ". Không có bước này thì lịch trình của bạn sẽ có nhà hàng không tồn tại.</div>"
          + '<a class="btn p s" href="#/app/trips/' + CUR.id + '/itinerary">Xem lịch trình →</a></div>';
        toast("Đã sinh lịch trình — " + r.added + " hoạt động");
        Tour.mark("generate");
      }
    }, 220);
  }
});
</script>

<script>
"use strict";
/* =============================================================================
   9. Lịch trình
   ========================================================================== */
/* Nhật ký: một dòng cảm nhận + vài tấm ảnh. Vẽ bằng ảnh thu nhỏ base64 nên vẫn
   đồng bộ như phần còn lại của trang; ảnh đầy đủ chỉ nạp khi bấm phóng to. */
function journalRow(tripId, dayId, activityId, label) {
  const j = journalOf(tripId, dayId, activityId);
  const ref = 'data-d="' + (tripDays(tripId).find(x => x.id === dayId) || {}).dayNumber + '" data-a="' + (activityId || "") + '"';
  if (!j) return '<button class="jadd" data-act="j-edit" ' + ref + ">✎ " + (label || "Ghi cảm nhận") + "</button>";
  const thumbs = (j.photoIds || []).map(pid => {
    const m = photoMeta(pid);
    return m ? '<img src="' + m.thumb + '" alt="Ảnh chuyến đi" data-act="photo-open" data-p="' + pid + '">' : "";
  }).join("");
  return '<div class="jrow">'
    + (j.mood ? '<div class="tiny"><b>' + MOOD_ICON[j.mood] + " " + MOOD[j.mood] + "</b></div>" : "")
    + (j.note ? '<div class="note">“' + esc(j.note) + "”</div>" : "")
    + (thumbs ? '<div class="thumbs">' + thumbs + "</div>" : "")
    + '<div class="row" style="gap:6px"><button class="jadd" data-act="j-edit" ' + ref + ">✎ Sửa</button>"
    + '<button class="jadd" data-act="j-del" data-id="' + j.id + '">Xoá mục này</button></div></div>';
}

function actRow(a, dayNo) {
  const p = a.place;
  const bits = [ACT_LABEL[a.type] || "Khác"];
  /* Hoạt động không có địa điểm: hiển thị bình thường, chỉ ghi loại — DI-4.
     Không hiện chỗ trống hay dấu hỏi. */
  if (p) bits.push(p.rating + "★");
  if (a.cost != null) bits.push('<span class="est num" title="Ước tính do bạn nhập, không phải giá thị trường">' + money(a.cost, CUR.currency) + "</span>");
  else if (!p) bits.push('<span class="hedge">chưa ước tính chi phí</span>');
  const st = actStatus(a);
  const live = CUR.phase !== "BEFORE";
  /* Giờ thực tế hiện CẠNH giờ dự kiến chứ không thay thế nó — muốn thấy mình lệch
     bao nhiêu thì phải còn cả hai con số. */
  const slip = st === "DONE" && a.start && a.actualStart ? deltaMinutes(a.start, a.actualStart) : null;
  let run = "";
  if (live) {
    run = '<div class="runctrls">'
      + (st === "PLANNED" ? '<button class="runbtn go" data-act="act-start" data-id="' + a.id + '">▸ Bắt đầu</button>'
        + '<button class="runbtn" data-act="act-done" data-id="' + a.id + '">✓ Xong</button>'
        + '<button class="runbtn" data-act="act-skip" data-id="' + a.id + '">Bỏ qua</button>'
        : st === "DOING" ? '<button class="runbtn go" data-act="act-done" data-id="' + a.id + '">✓ Xong rồi</button>'
          + '<button class="runbtn" data-act="act-skip" data-id="' + a.id + '">Bỏ qua</button>'
          : '<button class="runbtn" data-act="act-reset" data-id="' + a.id + '">↺ Đánh dấu lại</button>')
      + "</div>";
  }
  return '<li class="act ' + st.toLowerCase() + '" draggable="' + (isFrozen(a) ? "false" : "true") + '" data-id="' + a.id + '" data-day="' + dayNo + '" tabindex="0">'
    + '<span class="tm">' + (a.start || '<span class="hedge">chưa đặt giờ</span>') + (a.end ? "<br>" + a.end : "")
    + (a.actualStart ? '<br><span class="act-real" title="Giờ thực tế">▸' + a.actualStart + (a.actualEnd ? "–" + a.actualEnd : "") + "</span>" : "")
    + "</span>"
    + "<div><div class='ti'><span class='mo' style='color:var(--faint);font-size:12px' aria-hidden='true'>" + (ACT_ICON[a.type] || "•") + "</span>" + esc(a.title)
    + (a.createdBy === "AI" ? ' <button class="chip ai" data-act="why-place" data-id="' + a.id + '" style="cursor:pointer" title="Xem trợ lý đã dựa vào đâu để chọn chỗ này">✧ AI tạo · vì sao?</button>' : "")
    + (st === "DOING" ? ' <span class="chip t">● Đang làm</span>' : "")
    + (st === "DONE" ? ' <span class="chip t">✓ Đã xong' + (slip ? " · trễ " + slip + " phút" : "") + "</span>" : "")
    + (st === "SKIPPED" ? ' <span class="chip w">Đã bỏ · ' + (SKIP_REASON[a.skipReason] || "lý do khác") + "</span>" : "")
    + "</div><div class='mt'>" + bits.join(' <span class="dot">·</span> ')
    + (p ? '<br><span style="color:var(--faint)">' + esc(p.address) + "</span>" : "")
    + (a.notes ? '<br><span style="color:var(--faint)">' + esc(a.notes) + "</span>" : "")
    + "</div>" + run
    + (live ? journalRow(CUR.id, a.dayId, a.id) : "") + "</div>"
    + '<div class="ctrls"><span class="grip" title="Kéo để đổi thứ tự" aria-hidden="true">⣿</span>'
    + '<button class="icb" data-act="act-move" data-id="' + a.id + '" data-dir="-1" title="Lên">↑</button>'
    + '<button class="icb" data-act="act-move" data-id="' + a.id + '" data-dir="1" title="Xuống">↓</button>'
    + '<button class="icb" data-act="act-edit" data-id="' + a.id + '" title="Sửa">✎</button>'
    + '<button class="icb" data-act="act-del" data-id="' + a.id + '" title="Xoá">✕</button></div>'
    + "</li>";
}
function hopRow(a, b) {
  /* Khoảng cách chỉ hiện khi CẢ HAI điểm có toạ độ */
  if (!a.place || !b.place) return "";
  const km = haversine(a.place, b.place);
  if (km < 0.15) return "";
  return '<div class="hop">↓ ' + km.toFixed(1).replace(".", ",") + " km · khoảng " + travelMinutes(km) + " phút</div>";
}
function dayBlock(day) {
  const acts = day.activities;
  let rows = "";
  acts.forEach((a, i) => { rows += actRow(a, day.dayNumber); if (i < acts.length - 1) rows += hopRow(a, acts[i + 1]); });
  const est = acts.reduce((s, a) => s + (a.cost || 0), 0);
  return '<section class="day" data-day-id="' + day.id + '">'
    + "<header><div><b>Ngày " + day.dayNumber + "</b> <span class='sub'>— " + fmtDLong(day.date) + "</span></div>"
    + '<div class="row" style="gap:8px">' + (acts.length ? '<span class="tiny num">Ước tính ' + money(est, CUR.currency) + "</span>" : "")
    + '<button class="btn s" data-act="add-activity" data-day="' + day.dayNumber + '">＋ Thêm hoạt động</button></div></header>'
    + (CUR.phase !== "BEFORE" ? '<div style="padding:10px 16px;border-bottom:1px solid var(--line)">'
      + journalRow(CUR.id, day.id, null, "Ghi cảm nhận cho cả ngày") + "</div>" : "")
    + (acts.length
      ? '<ul class="acts">' + rows + "</ul>"
      : '<div style="padding:16px"><div class="empty"><p><strong>Ngày này chưa có hoạt động.</strong> Đây là ngày trống, không phải ngày rảnh có kế hoạch — hai thứ khác nhau. Thêm địa điểm vào đây?</p>'
      + '<div class="row"><button class="btn s p" data-act="add-activity" data-day="' + day.dayNumber + '">Thêm hoạt động</button>'
      + '<a class="btn s" href="#/app/trips/' + CUR.id + '/places">Tìm địa điểm</a></div></div></div>')
    + "</section>";
}
async function tabItinerary(t) {
  const it = await api.itinerary(t.id);
  const n = it.days.reduce((s, x) => s + x.activities.length, 0);
  const nAI = it.days.reduce((s, x) => s + x.activities.filter(a => a.createdBy === "AI").length, 0);
  $("#tabview").innerHTML = '<div class="stack" style="gap:16px">'
    + '<div class="spread wr"><div><h2 class="dp" style="font-size:23px">Lịch trình</h2>'
    + '<p class="sub">' + n + " hoạt động trong " + it.days.length + " ngày" + (nAI ? " · " + nAI + " do trợ lý tạo và bạn đã duyệt" : "") + "</p></div>"
    + '<span class="tiny" style="max-width:40ch;text-align:right">Kéo một hoạt động để đổi thứ tự. Thả xong hệ thống gửi <b>cả danh sách</b> của ngày đó lên, không gửi từng phần tử.</span></div>'
    + todayStrip(t)
    + it.days.map(dayBlock).join("") + "</div>";
  wireDnD();
}

/* Dải "Hôm nay" — chỉ hiện khi chuyến đang diễn ra. Nói rõ đang ở đâu, kế tiếp là
   gì, và có đang trễ không. Không hiện gì nếu hôm nay nằm ngoài khoảng ngày. */
function todayStrip(t) {
  if (t.phase !== "DURING") return "";
  const dayNo = t.currentDay;
  const sim = t.dayIsSimulated;
  if (!dayNo) return '<div class="today"><div class="hd"><b>Chế độ đang đi</b>'
    + (t.phaseIsManual ? ' <span class="chip w">bạn tự bật</span>' : "") + "</div>"
    + '<p class="tiny">Hôm nay (' + fmtD(TODAY) + ") không nằm trong khoảng " + fmtD(t.startDate) + " – " + fmtD(t.endDate)
    + ". Không có ngày nào để hiện, nhưng bạn vẫn đánh dấu được từng hoạt động ở bên dưới.</p></div>";

  const day = tripDays(t.id).find(x => x.dayNumber === dayNo);
  const acts = dayActs(day.id);
  const doing = acts.find(a => actStatus(a) === "DOING");
  const next = acts.find(a => actStatus(a) === "PLANNED");
  const dr = scheduleDrift(t.id, dayNo);
  const now = nowHM();
  const prog = acts.filter(isFrozen).length;

  let card = "";
  if (doing) {
    const over = doing.end ? deltaMinutes(doing.end, now) : null;
    card = '<div class="nextup"><span class="chip t">● Đang làm</span>'
      + "<div><b>" + esc(doing.title) + "</b><div class='tiny'>Bắt đầu " + (doing.actualStart || "—")
      + (doing.end ? " · dự kiến xong " + doing.end : "")
      + (over != null && over > 0 ? ' · <b style="color:var(--sand)">quá ' + over + " phút</b>" : "") + "</div></div>"
      + '<button class="runbtn go" data-act="act-done" data-id="' + doing.id + '">✓ Xong rồi</button></div>';
  } else if (next) {
    const wait = next.start ? deltaMinutes(now, next.start) : null;
    card = '<div class="nextup"><span class="chip">Kế tiếp</span>'
      + "<div><b>" + esc(next.title) + "</b><div class='tiny'>" + (next.start ? next.start : "chưa đặt giờ")
      + (wait != null ? (wait > 0 ? " · còn " + wait + " phút nữa" : " · lẽ ra đã bắt đầu " + Math.abs(wait) + " phút trước") : "")
      + (next.place ? " · " + esc(next.place.name) : "") + "</div></div>"
      + '<button class="runbtn go" data-act="act-start" data-id="' + next.id + '">▸ Bắt đầu</button></div>';
  } else {
    card = '<div class="nextup"><span class="chip t">✓</span><div><b>Xong hết ngày ' + dayNo + " rồi.</b>"
      + "<div class='tiny'>Không còn hoạt động nào chờ. Nghỉ ngơi thôi.</div></div><span></span></div>";
  }

  let drift = "";
  if (dr && dr.anchorActivityId && dr.driftMinutes > 5) {
    drift = '<div class="driftbar"><span>⚠</span><span>'
      + (dr.source === "NOW" ? "<b>Đang trễ " + dr.driftMinutes + " phút</b> tính tới lúc này"
        : "<b>Đã trễ " + dr.driftMinutes + " phút</b> so với dự kiến")
      + " — mốc là “" + esc(dr.anchorTitle) + "”."
      + (dr.affected.length ? " Còn " + dr.affected.length + " hoạt động phía sau." : "")
      + "</span>"
      + (dr.affected.length ? '<button class="btn s" data-act="ask-drift" style="margin-left:auto">Nhờ trợ lý dời lịch</button>' : "")
      + "</div>";
  }
  const dayPick = sim ? '<span class="row" style="gap:4px;margin-left:auto">'
    + tripDays(t.id).map(x => '<button class="runbtn' + (x.dayNumber === dayNo ? " go" : "") + '" data-act="sim-day" data-n="' + x.dayNumber + '">' + x.dayNumber + "</button>").join("")
    + "</span>" : "";
  return '<div class="today"><div class="hd"><b>' + (sim ? "Ngày " + dayNo + " (mô phỏng)" : "Hôm nay · Ngày " + dayNo) + "</b>"
    + '<span class="sub">' + fmtDLong(day.date) + "</span>"
    + '<span class="nowk">bây giờ ' + now + (S.flags.mockClock ? " (giả lập)" : "") + "</span>"
    + dayPick
    + "</div>"
    + (sim ? '<p class="tiny" style="margin:-4px 0 0">Hôm nay thật là ' + fmtD(TODAY) + ", chưa tới ngày khởi hành. Bạn đã tự bật chế độ đang đi nên hệ thống hiện ngày "
      + dayNo + " để xem thử — <b>đây không phải hôm nay</b>.</p>" : "")
    + card + drift
    + '<div class="tiny">Đã xong hoặc đã bỏ ' + prog + "/" + acts.length + " hoạt động của ngày này."
    + " Giờ thực tế bạn bấm được dùng để tính lệch lịch — không bấm thì hệ thống không đoán hộ.</div></div>";
}

function wireDnD() {
  let src = null;
  $$(".act").forEach(li => {
    li.addEventListener("dragstart", e => { src = li; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", li.dataset.id); } catch (x) { } });
    li.addEventListener("dragend", () => { li.classList.remove("dragging"); $$(".act").forEach(x => x.classList.remove("drag-over")); src = null; });
    li.addEventListener("dragover", e => {
      if (!src || src === li) return;
      if (src.closest(".day") !== li.closest(".day")) return;   // demo: chỉ đổi thứ tự trong cùng ngày
      e.preventDefault(); li.classList.add("drag-over");
    });
    li.addEventListener("dragleave", () => li.classList.remove("drag-over"));
    li.addEventListener("drop", async e => {
      e.preventDefault(); li.classList.remove("drag-over");
      if (!src || src === li) return;
      const ul = li.parentElement;
      const before = Array.from(ul.children).filter(x => x.classList.contains("act")).map(x => Number(x.dataset.id));
      const kids = Array.from(ul.children).filter(x => x.classList.contains("act"));
      const si = kids.indexOf(src), ti = kids.indexOf(li);
      ti > si ? li.after(src) : li.before(src);
      const after = Array.from(ul.children).filter(x => x.classList.contains("act")).map(x => Number(x.dataset.id));
      await commitReorder(li.closest(".day").dataset.dayId, after, before);
    });
  });
}
async function commitReorder(dayId, ids, prevIds) {
  try {
    await api.reorder(Number(dayId), ids);
    toast("Đã đổi thứ tự");
    Tour.mark("reorder");
    await tabItinerary(CUR);
  } catch (e) {
    /* Hỏng thì trả về thứ tự cũ và báo — ADS-40 §D.7 */
    handle(e);
    toast("Không lưu được thứ tự mới, đã trả về như cũ", "bad");
    await tabItinerary(CUR);
  }
}

const SPEECH = window.SpeechRecognition || window.webkitSpeechRecognition || null;
/* Không có thì ẩn nút và nói rõ, chứ không để một cái nút bấm vào không làm gì. */
function wireMic(btn, target, noteEl) {
  if (!btn || !target) return;
  if (!SPEECH) {
    btn.remove();
    if (noteEl) noteEl.textContent = "Trình duyệt này không hỗ trợ nhập bằng giọng nói. Gõ tay vậy.";
    return;
  }
  let rec = null;
  btn.addEventListener("click", () => {
    if (rec) { rec.stop(); return; }
    rec = new SPEECH();
    rec.lang = "vi-VN"; rec.interimResults = true; rec.continuous = false;
    const before = target.value ? target.value.trim() + " " : "";
    rec.onstart = () => { btn.classList.add("rec"); if (noteEl) noteEl.textContent = "Đang nghe… nói xong thì dừng lại một chút."; };
    rec.onresult = e => {
      let txt = "";
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      target.value = before + txt;
    };
    rec.onerror = e => { if (noteEl) noteEl.textContent = e.error === "not-allowed" ? "Bạn chưa cho phép dùng micro." : "Không nghe được: " + e.error; };
    rec.onend = () => { btn.classList.remove("rec"); rec = null; if (noteEl && !/Không nghe|chưa cho phép/.test(noteEl.textContent)) noteEl.textContent = "Xong. Sửa lại chữ nếu nghe nhầm."; };
    try { rec.start(); } catch (e) { rec = null; }
  });
}

async function markAct(id, status, opts) {
  try {
    const r = await api.setActivityStatus(id, status, opts);
    const msg = { DOING: "Bắt đầu: ", DONE: "Đã xong: ", SKIPPED: "Đã bỏ: ", PLANNED: "Đã bỏ đánh dấu: " }[status];
    toast(msg + r.activity.title + (r.autoClosed ? " · đã tự đóng “" + r.autoClosed.title + "”" : ""));
    Tour.mark("markAct");
    if (r.drift && r.drift.driftMinutes > 15 && r.drift.affected.length) {
      toast("Bạn đang trễ " + r.drift.driftMinutes + " phút — hỏi trợ lý để dời phần còn lại của ngày", "warn");
    }
    render();
  } catch (e) { handle(e); }
}

/* Gợi ý dựa trên thói quen ước lượng của chính người dùng qua các chuyến đã xong.
   Chỉ là một dòng chữ cạnh ô nhập — KHÔNG cộng vào `budgetOf.estimatedTotal`, vì ở
   đó nhãn ghi rõ "tổng chi phí bạn nhập cho từng hoạt động". */
/* Cách nói cho một tỉ số thực-tế/ước-tính. */
function ratioWords(r) {
  if (r == null) return "chưa đủ dữ liệu";
  if (Math.abs(r - 1) < 0.05) return "ước khá sát";
  if (r >= 2) return "chi gấp " + r.toFixed(1).replace(".", ",") + " lần ước tính";
  if (r <= 0.5) return "chi chưa tới nửa ước tính";
  return r > 1 ? "ước thiếu " + Math.round((r - 1) * 100) + "%" : "ước dư " + Math.round((1 - r) * 100) + "%";
}

function biasHint(a) {
  const b = userBias(S.session.userId), k = TYPE2CAT[(a && a.type) || "OTHER"] || "OTHER";
  const c = b.byCategory[k];
  if (!c || !c.enough) return "";
  return " Qua " + c.trips + " chuyến trước, mục " + EXP_LABEL[k].toLowerCase() + " của bạn <b>" + ratioWords(c.ratio) + "</b>.";
}

<script>

   10. Bản đồ — dùng lại dữ liệu lịch trình, KHÔNG gọi thêm
   ========================================================================== */
let MAP_DAY = 1;
async function tabMap(t) {
  const it = await api.itinerary(t.id);
  window.__it = it;
  MAP_DAY = Math.min(MAP_DAY, it.days.length) || 1;
  $("#tabview").innerHTML = '<div class="stack" style="gap:14px">'
    + '<div class="spread wr"><div><h2 class="dp" style="font-size:23px">Bản đồ</h2>'
    + '<p class="sub">Điểm đánh số theo thứ tự trong ngày, đường nối theo đúng thứ tự đó.</p></div>'
    + '<div class="row wr" style="gap:4px" id="map-days">' + it.days.map(d2 =>
      '<button class="btn s' + (d2.dayNumber === MAP_DAY ? " p" : "") + '" data-act="map-day" data-n="' + d2.dayNumber + '">Ngày ' + d2.dayNumber + "</button>").join("") + "</div></div>"
    + '<div id="map-body"></div></div>';
  drawMap();
}
function drawMap() {
  const it = window.__it;
  const day = it.days.find(x => x.dayNumber === MAP_DAY);
  const withGeo = day.activities.filter(a => a.place);
  const without = day.activities.length - withGeo.length;
  const box = $("#map-body");
  if (!day.activities.length) {
    box.innerHTML = '<div class="empty"><p><strong>Ngày ' + MAP_DAY + ' chưa có hoạt động nào</strong> nên bản đồ không có gì để vẽ.</p>'
      + '<button class="btn s p" data-act="add-activity" data-day="' + MAP_DAY + '">Thêm hoạt động</button></div>';
    return;
  }
  if (!withGeo.length) {
    box.innerHTML = '<div class="empty"><p><strong>Ngày ' + MAP_DAY + " có " + day.activities.length + " hoạt động nhưng không hoạt động nào gắn địa điểm có toạ độ.</strong> "
      + "Những hoạt động như “nhận phòng” hay “ăn trưa” không gắn địa điểm thì không vẽ lên bản đồ được — đó không phải lỗi.</p></div>";
    return;
  }
  const lats = withGeo.map(a => a.place.lat), lngs = withGeo.map(a => a.place.lng);
  let minLa = Math.min.apply(null, lats), maxLa = Math.max.apply(null, lats);
  let minLo = Math.min.apply(null, lngs), maxLo = Math.max.apply(null, lngs);
  const padLa = Math.max((maxLa - minLa) * 0.25, 0.006), padLo = Math.max((maxLo - minLo) * 0.25, 0.006);
  minLa -= padLa; maxLa += padLa; minLo -= padLo; maxLo += padLo;
  const W = 800, H = 480;
  const X = lo => ((lo - minLo) / (maxLo - minLo)) * W;
  const Y = la => H - ((la - minLa) / (maxLa - minLa)) * H;
  const pts = withGeo.map(a => ({ x: X(a.place.lng), y: Y(a.place.lat), a }));
  const km = pts.slice(1).reduce((s, p, i) => s + haversine(withGeo[i].place, p.a.place), 0);
  let grid = "";
  for (let i = 1; i < 6; i++) { grid += '<line x1="' + (W / 6 * i) + '" y1="0" x2="' + (W / 6 * i) + '" y2="' + H + '" stroke="var(--grid)" stroke-width="1"/>'; }
  for (let i = 1; i < 4; i++) { grid += '<line x1="0" y1="' + (H / 4 * i) + '" x2="' + W + '" y2="' + (H / 4 * i) + '" stroke="var(--grid)" stroke-width="1"/>'; }
  const poly = pts.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  box.innerHTML = '<div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start">'
    + '<div class="mapbox"><svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Sơ đồ các điểm trong ngày ' + MAP_DAY + '">'
    + '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--surface-2)"/>' + grid
    + '<polyline points="' + poly + '" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-dasharray="7 5" stroke-linejoin="round"/>'
    + pts.map((p, i) => '<g class="pin" data-act="map-pin" data-i="' + i + '">'
      + '<circle class="h" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="13" fill="var(--teal)" stroke="var(--surface)" stroke-width="2"/>'
      + '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + 4.5).toFixed(1) + '" text-anchor="middle" font-size="13" font-weight="700" fill="var(--surface)" font-family="var(--f-mo)">' + (i + 1) + "</text></g>").join("")
    + "</svg>"
    + '<div class="tiny" style="padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)">'
    + "Bản demo không tải ảnh nền bản đồ — nền để xám. <b>Điểm và đường vẫn vẽ đúng theo toạ độ thật</b>, khoảng cách bên dưới tính bằng Haversine."
    + "</div></div>"
    + '<div class="stack" style="gap:10px"><div class="plain"><ul class="maplist" id="maplist">'
    + pts.map((p, i) => '<li data-act="map-pin" data-i="' + i + '"><span class="n">' + (i + 1) + "</span>"
      + "<div><div style='font-weight:600'>" + esc(p.a.title) + "</div><div class='tiny'>" + esc(p.a.place.name) + "</div></div>"
      + "<span class='mo tiny'>" + (p.a.start || "") + "</span></li>").join("") + "</ul></div>"
    + '<div class="plain pad stack s"><div class="spread"><span class="tiny">Tổng quãng đường</span><b class="num">' + km.toFixed(1).replace(".", ",") + " km</b></div>"
    + '<div class="spread"><span class="tiny">Thời gian di chuyển ước tính</span><b class="num">' + travelMinutes(km) + " phút</b></div></div>"
    + (without ? '<div class="empty"><p>' + without + " hoạt động không hiện trên bản đồ vì không gắn địa điểm có toạ độ. Đây không phải lỗi — bản đồ chỉ bỏ qua chúng.</p></div>" : "")
    + "</div></div>"
    + '<style>@media(max-width:900px){#map-body>.grid{grid-template-columns:1fr !important}}</style>';
}
Object.assign(actions, {
  "map-day"(el) { MAP_DAY = Number(el.dataset.n); tabMap(CUR); },
  "map-pin"(el) {
    const i = el.dataset.i;
    $$("#maplist li").forEach(x => x.classList.toggle("on", x.dataset.i === i));
    $$(".pin").forEach(x => x.classList.toggle("on", x.dataset.i === i));
    const li = $('#maplist li[data-i="' + i + '"]'); if (li) li.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
});

          : '<div class="empty"><p>Nhóm này đã cân bằng, không ai phải trả ai đồng nào.</p></div>')
        + "</div>").join(""))
    + '<p class="tiny">Chia theo <b>từng loại tiền tệ một</b>, không quy đổi — hệ thống không biết tỉ giá ngày bạn chi. Phần dư khi chia lẻ được rải cho vài người đầu để tổng khớp tuyệt đối, không làm tròn cho mất mấy đồng.</p></div>';
}

Object.assign(actions, {
  "quick-exp"(form) {
    const inp = $("#qe-text"), text = inp.value.trim();
    if (!text) return;
    const ex = parseExpenseText(text, CUR);
    if (!ex) { toast("Không thấy số tiền nào trong câu đó. Viết kèm số giúp tôi.", "warn"); return; }
    inp.value = "";
    openExpenseReview(ex);
  },
  "edit-parts"() {
    const parts = tripParts(CUR.id);
    openModal({
      title: "Ai đi chuyến này?",
      body: '<div class="stack s">' + parts.map(x => '<div class="row" style="gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:8px">'
        + "<b>" + esc(x.name) + "</b>" + (x.isMe ? '<span class="chip t">bạn</span>' : "")
        + (x.isMe ? "" : '<button class="icb" style="margin-left:auto" data-act="pt-del" data-id="' + x.id + '" title="Bỏ khỏi chuyến">✕</button>') + "</div>").join("") + "</div>"
        + '<div class="row" style="gap:8px"><input class="inp" id="pt-name" placeholder="Tên người mới" style="flex:1">'
        + '<button class="btn p" data-act="pt-add">Thêm</button></div>'
        + '<p class="tiny">Người đi chuyến không cần có tài khoản TripMind — chỉ cần một cái tên để chia tiền. Muốn bỏ một người thì các khoản họ đứng tên phải sửa trước.</p>'
    });
  },
  async "pt-add"() {
    const n = $("#pt-name").value.trim();
    if (!n) { toast("Nhập tên đã", "warn"); return; }
    try { await api.addParticipant(CUR.id, n); closeModal(); toast("Đã thêm " + n + " vào chuyến"); render(); } catch (e) { handle(e); }
  },
  async "pt-del"(el) {
    try { await api.removeParticipant(el.dataset.id); closeModal(); toast("Đã bỏ khỏi chuyến"); render(); } catch (e) { handle(e); }
  },
  "add-expense"() { openExpenseReview(null); },
  "exp-edit-prop"(el) {
    const pr = S.db.proposals.find(x => x.id === Number(el.dataset.id));
    if (pr) openExpenseReview(pr.expense, pr.id);
  },
  async "exp-save"() {
    const v = $("#ex-a").value;
    if (v === "" || Number(v) < 0) { toast("Nhập số tiền không âm", "warn"); return; }
    const share = $$("#ex-share input:checked").map(x => Number(x.value));
    if (!share.length) { toast("Chọn ít nhất một người cùng chịu khoản này", "warn"); return; }
    const propId = $("#ex-prop").value;
    try {
      if (propId) { const pr = S.db.proposals.find(x => x.id === Number(propId)); if (pr && pr.status === "PENDING") { pr.status = "APPLIED"; pr.appliedAt = nowISO(); } }
      await api.addExpense(CUR.id, {
        amount: Number(v), currency: $("#ex-c").value, category: $("#ex-k").value,
        description: $("#ex-d").value.trim(), date: $("#ex-t").value,
        paidBy: Number($("#ex-p").value), shareWith: share,
        placeId: $("#ex-pl").value ? Number($("#ex-pl").value) : null,
        source: $("#ex-src").value
      });
      closeModal();
      const b = budgetOf(CUR.id);
      toast("Đã ghi vào sổ chi tiêu" + (b.warningLevel === "OVER" ? " — chuyến này đã vượt ngân sách" : b.warningLevel === "NEAR_LIMIT" ? " — đã dùng hơn 90% ngân sách" : ""),
        b.warningLevel === "OVER" ? "bad" : b.warningLevel === "NEAR_LIMIT" ? "warn" : "");
      Tour.mark("expense"); render();
    } catch (e) { handle(e); }
  },
  async "exp-del"(el) { try { await api.deleteExpense(el.dataset.id); toast("Đã xoá khoản chi"); render(); } catch (e) { handle(e); } }
});
</script>

<script>
"use strict";
/* =============================================================================
   12. Địa điểm · Đã lưu · Hồ sơ
   ========================================================================== */
/* =============================================================================
   Nhìn lại — chỉ mở được khi chuyến đã kết thúc
   ========================================================================== */
async function tabReview(t) {
  const [acc, bias, settle, it, parts] = await Promise.all([
    api.accuracy(t.id), api.bias(), api.settlement(t.id), api.itinerary(t.id), api.participants(t.id)]);
  const pr = t.progress;
  const jr = tripJournal(t.id);
  const acts = tripActs(t.id);
  const skipped = acts.filter(a => actStatus(a) === "SKIPPED");
  const cats = Object.keys(EXP_LABEL).filter(k => acc.byCategory[k].est || acc.byCategory[k].act);
  let km = 0, kmPairs = 0;
  it.days.forEach(day => {
    const g = day.activities.filter(a => a.place);
    for (let i = 1; i < g.length; i++) { km += haversine(g[i - 1].place, g[i].place); kmPairs++; }
  });
  const photos = S.db.photos.filter(x => x.tripId === t.id);

  const ratioCell = c => {
    if (!c.enough) return '<span class="hedge">chưa đủ dữ liệu để so</span>';
    return '<span style="color:var(--' + (c.ratio > 1.05 ? "brick" : c.ratio < 0.95 ? "teal" : "teal") + ');font-weight:600">'
      + esc(ratioWords(c.ratio)) + "</span>";
  };

  $("#tabview").innerHTML = '<div class="stack" style="gap:18px">'
    + '<div><h2 class="dp" style="font-size:23px">Nhìn lại ' + esc(t.destination.name) + "</h2>"
    + '<p class="sub">' + fmtD(t.startDate) + " – " + fmtD(t.endDate) + " · " + t.daysCount + " ngày · " + parts.length + " người · đã kết thúc</p></div>"

    + '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">'
    + '<div class="card pad">' + statTile("Đã làm", pr.done + "/" + pr.total + " hoạt động", pr.skipped ? "bỏ " + pr.skipped + " cái" : "không bỏ cái nào") + "</div>"
    + '<div class="card pad">' + (kmPairs
      ? statTile("Quãng đường", km.toFixed(1).replace(".", ",") + " km", "qua " + kmPairs + " chặng giữa hai điểm có toạ độ")
      : statTile("Quãng đường", null, "Không đủ hai điểm liền nhau có toạ độ để tính")) + "</div>"
    + '<div class="card pad">' + statTile("Đã chi thực tế", money(acc.overall.act, acc.currency), "so với ước tính " + money(acc.overall.est, acc.currency)) + "</div>"
    + '<div class="card pad">' + statTile("Ảnh & ghi chép", jr.length + " mục", photos.length + " ảnh") + "</div>"
    + "</div>"

    + '<div class="grid" id="rv-cols" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start">'
    + '<div class="stack">'
    + '<div class="card pad stack" style="gap:12px"><div><h3 style="font-size:16px">Bạn ước sai ở đâu</h3>'
    + '<p class="tiny">So chi phí bạn <b>ước tính</b> cho từng hoạt động với số bạn <b>thực sự ghi</b> vào sổ. Hạng mục nào thiếu một trong hai vế thì không so được — và ở đó hệ thống nói là chưa đủ dữ liệu chứ không hiện 0%.</p></div>'
    + (cats.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Hạng mục</th><th class="r">Ước tính</th><th class="r">Thực tế</th><th>Chênh</th></tr></thead><tbody>'
      + cats.map(k => "<tr><td>" + EXP_LABEL[k] + "</td>"
        + "<td class='r'>" + (acc.byCategory[k].est ? money(acc.byCategory[k].est, acc.currency) : '<span class="hedge">—</span>') + "</td>"
        + "<td class='r'>" + (acc.byCategory[k].act ? money(acc.byCategory[k].act, acc.currency) : '<span class="hedge">chưa ghi</span>') + "</td>"
        + "<td>" + ratioCell(acc.byCategory[k]) + "</td></tr>").join("")
      + "</tbody></table></div>"
      : '<div class="empty"><p>Chuyến này không có cả ước tính lẫn khoản chi nào để so.</p></div>')
    + (acc.overall.enough ? '<div class="plain pad"><b>Tổng:</b> ' + ratioCell(acc.overall)
      + ' <span class="tiny">— ước ' + money(acc.overall.est, acc.currency) + ", chi thật " + money(acc.overall.act, acc.currency) + ".</span></div>" : "")
    + (acc.otherCurrencies.length ? '<p class="tiny">Còn ' + acc.otherCurrencies.map(o => money(o.actualTotal, o.currency)).join(", ")
      + " ghi bằng tiền tệ khác, để riêng không quy đổi.</p>" : "")
    + '<hr class="rule"><div class="stack s"><div class="eyebrow">Thói quen ước lượng của bạn</div>'
    + (bias.enough
      ? Object.keys(bias.byCategory).filter(k => bias.byCategory[k].enough).map(k =>
        '<div class="spread"><span style="font-size:13.5px">' + EXP_LABEL[k] + '</span><span class="tiny">'
        + esc(ratioWords(bias.byCategory[k].ratio)) + " · " + bias.byCategory[k].trips + " chuyến</span></div>").join("") || '<p class="tiny">Chưa hạng mục nào đủ hai chuyến có cả ước tính lẫn chi thật.</p>'
      : '<p class="tiny">Mới có ' + bias.trips + " chuyến đã kết thúc. Cần ít nhất hai chuyến mới nói được bạn hay ước thiếu hay ước dư — một chuyến thì chỉ là ngẫu nhiên.</p>")
    + '<p class="tiny">Con số này <b>không</b> được cộng vào tổng ước tính ở tab Ngân sách. Ở đó “Ước tính từ lịch trình” vẫn đúng nghĩa là tổng chi phí bạn nhập, không hơn.</p></div></div>'

    + (skipped.length ? '<div class="card pad stack" style="gap:9px"><h3 style="font-size:16px">' + skipped.length + " hoạt động đã bỏ</h3>"
      + skipped.map(a => '<div class="row" style="gap:9px;padding:6px 0;border-bottom:1px solid var(--line)">'
        + "<span style='flex:1;font-size:13.5px'>" + esc(a.title) + "</span>"
        + '<span class="chip w">' + (SKIP_REASON[a.skipReason] || "lý do khác") + "</span></div>").join("")
      + '<p class="tiny">Bỏ khác với xoá: chúng vẫn nằm trong lịch trình, và chi phí ước tính của chúng không tính vào phần so ở trên.</p></div>' : "")
    + "</div>"

    + '<div class="stack">'
    + '<div class="card pad stack" style="gap:11px"><h3 style="font-size:16px">Quyết toán</h3>'
    + (settle.length ? settle.map(g => '<div class="stack s">'
      + (settle.length > 1 ? '<div class="eyebrow">' + g.currency + "</div>" : "")
      + g.rows.map(r => '<div class="spread"><span style="font-size:13.5px">' + esc(r.name) + (r.isMe ? " (bạn)" : "") + "</span>"
        + '<span class="num tiny" style="color:' + (r.balance > 0 ? "var(--teal)" : r.balance < 0 ? "var(--brick)" : "var(--muted)") + '">'
        + (r.balance === 0 ? "cân bằng" : (r.balance > 0 ? "+" : "−") + money(Math.abs(r.balance), g.currency)) + "</span></div>").join("")
      + g.transfers.map(tr => '<div class="row" style="gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface-3);font-size:13px">'
        + "<b>" + esc(tr.from) + "</b><span style='color:var(--muted)'>trả</span><b>" + esc(tr.to) + "</b>"
        + "<b class='num' style='margin-left:auto'>" + money(tr.amount, tr.currency) + "</b></div>").join("")
      + "</div>").join('<hr class="rule">')
      : '<div class="empty"><p>Chuyến này chưa ghi khoản chi nào nên không có gì để quyết toán.</p></div>')
    + '<a class="btn s" href="#/app/trips/' + t.id + '/budget">Xem chi tiết ở tab Ngân sách</a></div>'

    + '<div class="card pad stack" style="gap:12px"><h3 style="font-size:16px">Nhật ký</h3>'
    + (jr.length ? tripDays(t.id).map(day => {
      const rows = jr.filter(x => x.dayId === day.id);
      if (!rows.length) return "";
      return '<div class="stack s"><div class="eyebrow">Ngày ' + day.dayNumber + " · " + fmtD(day.date) + "</div>"
        + rows.map(j => {
          const act = j.activityId ? S.db.activities.find(x => x.id === j.activityId) : null;
          return '<div class="jrow" style="margin:0">'
            + (act ? '<div class="tiny"><b>' + esc(act.title) + "</b></div>" : '<div class="tiny"><b>Cả ngày</b></div>')
            + (j.mood ? '<div class="tiny">' + MOOD_ICON[j.mood] + " " + MOOD[j.mood] + "</div>" : "")
            + (j.note ? '<div class="note">“' + esc(j.note) + "”</div>" : "")
            + (j.photoIds.length ? '<div class="thumbs">' + j.photoIds.map(pid => {
              const m = photoMeta(pid);
              return m ? '<img src="' + m.thumb + '" alt="" data-act="photo-open" data-p="' + pid + '">' : "";
            }).join("") + "</div>" : "")
            + "</div>";
        }).join("") + "</div>";
    }).join("")
      : '<div class="empty"><p><strong>Chưa ghi gì cho chuyến này.</strong> Nhật ký viết được cả trong lúc đi lẫn sau khi về — mở tab Lịch trình rồi bấm “Ghi cảm nhận” ở từng hoạt động.</p></div>')
    + "</div></div></div>"
    + '<style>@media(max-width:900px){#rv-cols{grid-template-columns:1fr !important}}</style></div>';
}

let searchTimer = null, lastQuery = "";
function placeRow(p, ctx) {
  const dbRow = p.xid ? S.db.places.find(x => x.externalId === p.xid) : S.db.places.find(x => x.id === p.id);
  const saved = dbRow && S.db.savedPlaces.some(x => x.userId === S.session.userId && x.placeId === dbRow.id);
  const ref = p.xid ? 'data-xid="' + p.xid + '"' : 'data-id="' + p.id + '"';
  return '<div class="pl"><div><div class="nm">' + esc(p.name)
    + (dbRow ? ' <span class="chip t" title="Đã có dòng trong cơ sở dữ liệu của bạn">trong CSDL</span>'
      : ' <span class="chip" title="Mới chỉ là kết quả tra cứu, chưa lưu ở đâu">chưa lưu</span>') + "</div><div class='mt'>"
    + "<span>" + esc(p.category) + '</span><span class="dot">·</span>'
    + '<span class="num">' + p.rating + "★ <span class='tiny'>(" + p.reviews.toLocaleString("vi-VN") + ")</span></span>"
    + '<span class="dot">·</span><span>' + PRICE_LABEL[p.price] + "</span>"
    + (p.distanceKm != null ? '<span class="dot">·</span><span class="num">cách trung tâm ' + p.distanceKm.toFixed(1).replace(".", ",") + " km</span>" : "")
    + (p.indoor ? '<span class="dot">·</span><span class="chip">Trong nhà</span>' : "")
    + "<br><span style='color:var(--faint)'>" + esc(p.address) + "</span></div></div>"
    + '<div class="row" style="gap:6px">'
    + (saved ? '<button class="btn s" disabled title="Địa điểm đã có trong danh sách đã lưu">✓ Đã lưu</button>'
      : '<button class="btn s" data-act="place-save" ' + ref + ">Lưu</button>")
    + (ctx === "trip" ? '<button class="btn s p" data-act="place-add" ' + ref + ">Thêm vào ngày…</button>"
      : '<button class="btn s p" data-act="place-to-trip" ' + ref + ">Thêm vào chuyến…</button>")
    + "</div></div>";
}
function dbPlaceCount() { return S.db.places.length; }

async function tabPlaces(t) {
  $("#tabview").innerHTML = '<div class="stack" style="gap:14px">'
    + '<div><h2 class="dp" style="font-size:23px">Địa điểm quanh ' + esc(t.destination.name) + "</h2>"
    + '<p class="sub">Kết quả đến thẳng từ nhà cung cấp, <b>không lấy từ cơ sở dữ liệu</b>. Hệ thống chờ bạn ngừng gõ khoảng 400 ms rồi mới hỏi.</p></div>'
    + '<input class="inp" id="pl-q" placeholder="Tìm: bảo tàng, hải sản, chợ, chùa…" autocomplete="off" style="max-width:520px">'
    + '<div id="pl-res"></div>'
    + '<p class="tiny" id="pl-attr"></p>'
    + '<div class="empty"><p><strong>Cơ sở dữ liệu của bạn đang giữ ' + dbPlaceCount() + ' địa điểm.</strong> '
    + 'Chỉ những chỗ bạn đã bấm “Lưu” hoặc đưa vào lịch trình mới có dòng ở đó. ' + PROVIDER.name + ' có ' + PROVIDER.places.length
    + " chỗ; số còn lại hệ thống không giữ bản sao nào.</p></div></div>";
  const inp = $("#pl-q");
  inp.addEventListener("input", () => {
    clearTimeout(searchTimer);
    $("#pl-res").innerHTML = '<div class="plain pad">' + skeletonBlock(3) + "</div>";
    searchTimer = setTimeout(() => runSearch(inp.value, t), 400);   /* chờ gõ xong — ADS-40 §D.10 */
  });
  runSearch("", t);
}
async function runSearch(q, t) {
  lastQuery = q;
  const box = $("#pl-res"); if (!box) return;
  box.innerHTML = '<div class="plain pad">' + skeletonBlock(3) + "</div>";
  try {
    const r = await api.searchPlaces(q, t.destId);
    if (lastQuery !== q) return;
    $("#pl-attr").innerHTML = esc(r.attribution) + (r.cached ? " · lấy lại từ bộ đệm, chưa hỏi lại nhà cung cấp" : "")
      + " · Thông tin là ảnh chụp lúc tra cứu; hệ thống không biết chỗ đó hôm nay còn mở cửa hay không.";
    /* Dịch vụ lỗi ≠ không tìm thấy — ADS-40 §D.10 */
    if (r.reason === "PROVIDER_UNAVAILABLE") {
      box.innerHTML = '<div class="empty"><p><strong>Không tra được lúc này.</strong> Dịch vụ tìm kiếm địa điểm không trả lời. '
        + "Đây khác với “không tìm thấy kết quả nào” — hệ thống không biết có kết quả hay không, nên không nói bừa.</p>"
        + '<button class="btn s" data-act="place-retry">Thử lại</button></div>';
      return;
    }
    box.innerHTML = r.results.length
      ? '<div class="plain">' + r.results.map(p => placeRow(p, "trip")).join("") + "</div>"
      : '<div class="empty"><p><strong>Không có địa điểm nào khớp “' + esc(q) + '”.</strong> Dịch vụ trả lời bình thường, chỉ là không có kết quả. Thử từ khoá ngắn hơn?</p></div>';
  } catch (e) { handle(e); }
}
Object.assign(actions, {
  "place-retry"() { runSearch($("#pl-q") ? $("#pl-q").value : "", CUR); },
  async "place-save"(el) {
    try {
      const row = await api.savePlace(el.dataset.xid || (S.db.places.find(x => x.id === Number(el.dataset.id)) || {}).externalId);
      toast("Đã lưu “" + row.name + "” — giờ nó mới có dòng trong CSDL");
      Tour.mark("savePlace"); render();
    } catch (e) { handle(e); }
  },
  async "place-unsave"(el) { try { await api.unsavePlace(el.dataset.id); toast("Đã bỏ lưu — bản ghi địa điểm vẫn giữ trong hệ thống"); render(); } catch (e) { handle(e); } },
  "place-add"(el) {
    const xid = el.dataset.xid || (S.db.places.find(x => x.id === Number(el.dataset.id)) || {}).externalId;
    const p = PROVIDER.places.find(x => x.xid === xid) || S.db.places.find(x => x.externalId === xid);
    if (!p) { toast("Nhà cung cấp không còn địa điểm này", "warn"); return; }
    const days = tripDays(CUR.id);
    openModal({
      title: "Thêm “" + p.name + "” vào ngày nào?",
      body: '<div class="opts">' + days.map(x => '<button type="button" class="opt" data-act="place-add-day" data-p="' + xid + '" data-d="' + x.dayNumber + '">'
        + "<div><div class='h'>Ngày " + x.dayNumber + " — " + fmtDLong(x.date) + "</div><div class='d'>"
        + (dayActs(x.id).length ? dayActs(x.id).length + " hoạt động" : "Ngày này chưa có hoạt động") + "</div></div></button>").join("") + "</div>"
        + '<p class="tiny">Chi phí điền sẵn ' + money(p.fee * CUR.travelers, CUR.currency) + " cho " + CUR.travelers + " người — đây là ước tính, bạn sửa được sau."
        + (S.db.places.some(x => x.externalId === xid) ? "" : " Bấm chọn ngày là địa điểm này mới được ghi vào cơ sở dữ liệu.")
    });
  },
  async "place-add-day"(el) {
    const xid = el.dataset.p;
    const p = PROVIDER.places.find(x => x.xid === xid) || S.db.places.find(x => x.externalId === xid);
    try {
      await api.addActivity(CUR.id, {
        dayNumber: Number(el.dataset.d), title: p.name, placeXid: xid,
        type: p.category === "Nhà hàng" || p.category === "Quán cà phê" ? "FOOD" : "SIGHTSEEING",
        start: null, end: null, cost: p.fee * CUR.travelers, notes: null
      });
      closeModal(); toast("Đã thêm " + p.name + " vào ngày " + el.dataset.d); Tour.mark("addActivity"); render();
    } catch (e) { handle(e); }
  },
  "place-to-trip"(el) {
    const xid = el.dataset.xid || (S.db.places.find(x => x.id === Number(el.dataset.id)) || {}).externalId;
    const p = PROVIDER.places.find(x => x.xid === xid) || S.db.places.find(x => x.externalId === xid);
    const trips = S.db.trips.filter(t => t.userId === S.session.userId && t.endDate >= TODAY);
    if (!trips.length) { toast("Bạn chưa có chuyến nào sắp tới để thêm vào", "warn"); return; }
    openModal({
      title: "Thêm “" + p.name + "” vào chuyến nào?",
      body: '<div class="opts">' + trips.map(t => '<button type="button" class="opt" data-act="pick-trip" data-p="' + xid + '" data-t="' + t.id + '">'
        + "<div><div class='h'>" + esc(t.name) + "</div><div class='d'>" + fmtD(t.startDate) + " — " + fmtD(t.endDate) + " · " + (diffDays(t.startDate, t.endDate) + 1) + " ngày</div></div></button>").join("") + "</div>"
    });
  },
  async "pick-trip"(el) {
    CUR = await api.trip(el.dataset.t);
    actions["place-add"]({ dataset: { xid: el.dataset.p } });
  }
});

        + esc(p.category) + '<span class="dot">·</span><span class="num">' + p.rating + "★</span>"
        + '<span class="dot">·</span><span class="tiny">lưu ngày ' + fmtD(p.savedAt) + "</span>"
        + "<br><span style='color:var(--faint)'>" + esc(p.address) + "</span></div></div>"
        + '<div class="row" style="gap:6px"><button class="btn s" data-act="place-unsave" data-id="' + p.id + '">Bỏ lưu</button>'
        + '<button class="btn s p" data-act="place-to-trip" data-xid="' + p.externalId + '">Thêm vào chuyến…</button></div></div>').join("") + "</div>"
      : '<div class="empty"><p><strong>Chưa lưu địa điểm nào.</strong> Khi tìm địa điểm trong một chuyến đi, bấm “Lưu” là chỗ đó xuất hiện ở đây.</p>'
      + '<a class="btn s p" href="#/app">Về danh sách chuyến</a></div>';
