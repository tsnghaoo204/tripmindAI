}

async function vProfile() {
  const me = api.me();
  const p = me.preferences;
  shell('<div class="wrap narrow stack" style="gap:18px"><h1 class="dp" style="font-size:27px">Hồ sơ</h1>'
    + '<div class="card pad stack" style="gap:13px"><h3 style="font-size:16px">Thông tin</h3>'
    + '<div class="field"><label for="pf-n">Họ tên</label><input class="inp" id="pf-n" value="' + esc(me.name) + '"></div>'
    + '<div class="field"><label for="pf-e">Email</label><input class="inp" id="pf-e" value="' + esc(me.email) + '" disabled></div>'
    + '<div class="row"><span class="chip' + (me.role === "ADMIN" ? " w" : " t") + '">' + (me.role === "ADMIN" ? "Quản trị" : "Người đi du lịch") + "</span>"
    + '<span class="tiny">Một tài khoản một vai trò. Vai trò không đổi được từ giao diện.</span></div>'
    + '<div><button class="btn p s" data-act="pf-save">Lưu thông tin</button></div></div>'
    + '<div class="card pad stack" style="gap:13px"><h3 style="font-size:16px">Sở thích mặc định</h3>'
    + '<p class="tiny">Dùng để điền sẵn bước 5 và 6 khi bạn tạo chuyến mới.</p>'
    + '<div class="field"><label>Bạn thích gì</label><div class="row wr" style="gap:7px" id="pf-prefs">'
    + PREF_KEYS.map(k => '<button type="button" class="tagbtn' + ((p.preferences || []).includes(k) ? " on" : "") + '" data-act="pf-pref" data-k="' + k + '">' + PREF_LABEL[k] + "</button>").join("") + "</div></div>"
    + '<div class="row wr" style="gap:14px"><div class="field" style="flex:1;min-width:180px"><label for="pf-s">Nhịp đi</label><select class="inp" id="pf-s">'
    + Object.keys(STYLE_LABEL).map(k => '<option value="' + k + '"' + (p.travelStyle === k ? " selected" : "") + ">" + STYLE_LABEL[k] + "</option>").join("") + "</select></div>"
    + '<div class="field" style="flex:1;min-width:180px"><label for="pf-b">Mức chi</label><select class="inp" id="pf-b">'
    + Object.keys(BUDGET_LABEL).map(k => '<option value="' + k + '"' + (p.budgetPreference === k ? " selected" : "") + ">" + BUDGET_LABEL[k] + "</option>").join("") + "</select></div></div>"
    + '<div><button class="btn p s" data-act="pf-save-prefs">Lưu sở thích</button></div></div>'
    + '<div class="card pad stack" style="gap:11px"><h3 style="font-size:16px">Cơ sở dữ liệu của bạn</h3>'
    + '<p class="tiny">Hệ thống <b>không giữ danh mục địa điểm dựng sẵn</b>. Bảng địa điểm chỉ có dòng khi bạn chọn một chỗ — lưu lại, đưa vào lịch trình, hoặc duyệt một đề xuất.</p>'
    + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Bảng</th><th class="r">Số dòng</th><th>Có vì đâu</th></tr></thead><tbody>'
    + [["Chuyến đi", S.db.trips.filter(t => t.userId === me.id).length, "bạn tạo"],
    ["Ngày trong chuyến", S.db.days.filter(d0 => S.db.trips.some(t => t.id === d0.tripId && t.userId === me.id)).length, "sinh tự động khi tạo chuyến"],
    ["Hoạt động", S.db.trips.filter(t => t.userId === me.id).reduce((n, t) => n + tripActs(t.id).length, 0), "bạn thêm, hoặc duyệt đề xuất"],
    ["Địa điểm", S.db.places.length, "chỉ những chỗ bạn đã chọn"],
    ["Khoản chi", S.db.expenses.filter(e => S.db.trips.some(t => t.id === e.tripId && t.userId === me.id)).length, "bạn ghi, hoặc duyệt phiếu"],
    ["Người đi cùng", S.db.participants.filter(x => S.db.trips.some(t => t.id === x.tripId && t.userId === me.id)).length, "bạn thêm"]]
      .map(r => "<tr><td>" + r[0] + "</td><td class='r num'>" + r[1] + "</td><td class='tiny'>" + r[2] + "</td></tr>").join("")
    + "</tbody></table></div>"
    + '<div class="row wr" style="gap:14px;padding-top:2px">'
    + '<span class="tiny">Nhà cung cấp ngoài đang có <b class="num">' + PROVIDER.places.length + "</b> địa điểm</span>"
    + '<span class="tiny">Bộ đệm 1 giờ đang giữ <b class="num">' + Object.keys(PLACE_CACHE).length + "</b> lượt tra</span></div>"
    + '<p class="tiny">Bộ đệm hết hạn là mất và không ai thấy. Cơ sở dữ liệu thì còn, và hiện ra ở “Địa điểm đã lưu”. Hai thứ đó khác nhau.</p></div>'
    + '<div class="card pad stack" style="gap:10px"><h3 style="font-size:16px">Bản demo</h3>'
    + '<p class="tiny">Toàn bộ dữ liệu nằm trong trình duyệt của bạn (localStorage). Không có máy chủ, không gửi gì đi đâu.</p>'
    + '<div class="row wr"><button class="btn s" data-act="demo-panel">Bảng điều khiển demo</button>'
    + '<button class="btn s d" data-act="tour-reset">Đặt lại dữ liệu demo</button></div></div>'
    + "</div>");
}
Object.assign(actions, {
  "pf-pref"(el) { el.classList.toggle("on"); },
  async "pf-save"() { try { await api.updateMe({ name: $("#pf-n").value.trim() }); toast("Đã lưu thông tin"); render(); } catch (e) { handle(e); } },
  async "pf-save-prefs"() {
    const prefs = $$("#pf-prefs .tagbtn.on").map(x => x.dataset.k);
    try { await api.updatePreferences({ preferences: prefs, travelStyle: $("#pf-s").value, budgetPreference: $("#pf-b").value }); toast("Đã lưu sở thích"); } catch (e) { handle(e); }
  }
});
</script>

<style>
.console-panel{background:var(--console);color:var(--console-ink);border:1px solid var(--console-line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.console-panel .db{padding:18px;display:flex;flex-direction:column;gap:14px;min-height:340px;max-height:min(74vh,780px);overflow-y:auto}
.console-panel .df{border-top:1px solid var(--console-line);padding:12px 14px;background:var(--console-2)}
.console-panel .icb{background:transparent;border-color:var(--console-line);color:var(--console-muted)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.sugg button{background:transparent;border:1px solid var(--console-line);color:var(--console-muted);border-radius:100px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.sugg button:hover{border-color:#4ec3ac;color:#4ec3ac}
.prop.applied{border-color:#2e6f5f}
.prop.dead{opacity:.62}
.ai-note{font-size:12px;color:var(--console-muted);line-height:1.5}
.drawer .btn.p,.console-panel .btn.p{background:#3ba98f;border-color:#3ba98f;color:#052019}
.drawer .btn.p:hover,.console-panel .btn.p:hover{background:#4ec3ac;border-color:#4ec3ac}
.drawer .btn,.console-panel .btn{background:transparent;border-color:var(--console-line);color:var(--console-ink)}
.drawer .btn:hover,.console-panel .btn:hover{background:var(--console-2)}
</style>
<script>
"use strict";
/* =============================================================================
   13. Trợ lý — thanh bên mở được từ mọi tab, và cũng là một tab riêng
        Thẻ đề xuất KHÔNG đổi lịch trình cho tới khi bấm áp dụng — QĐ-01
   ========================================================================== */
let drawerOpen = false, AS_BUSY = false;
const SUGGESTIONS = ["Gợi ý chỗ ăn tối", "Cho tôi vài phương án tối ưu", "Hôm qua ăn ở Bé Mặn hết 450k, mình trả",
  "Ngày mai mưa thì đổi lịch giúp tôi", "Ngân sách có đủ không?", "Lên lịch lại toàn bộ chuyến"];

function assistantBody(tripId) {
  const conv = S.db.conversations.find(c => c.tripId === tripId);
  const msgs = conv ? S.db.messages.filter(m => m.convId === conv.id).sort((a, b) => a.id - b.id) : [];
  let html = "";
  if (!msgs.length) {
    html = '<div class="ai-note" style="border:1px dashed var(--console-line);border-radius:9px;padding:12px">'
      + "<b style='color:var(--console-ink)'>Trợ lý chưa được hỏi gì về chuyến này.</b><br>"
      + "Nó đọc được chuyến đi, lịch trình, sở thích, địa điểm đã lưu, ngân sách, thời tiết và tìm địa điểm mới. "
      + "Muốn đổi lịch trình thì nó dựng <b>đề xuất</b> để bạn duyệt — nó không có công cụ nào sửa thẳng vào lịch trình của bạn.</div>";
  }
  msgs.forEach(m => {
    if (m.role === "USER") html += '<div class="msg u">' + esc(m.content) + "</div>";
    else if (m.role === "ASSISTANT") {
      if (m.tools && m.tools.length) html += '<div class="toolstrip">' + m.tools.map(t =>
        '<div class="tl ' + (t.status === "OK" ? "ok" : "bad") + '"><span class="ic">' + (t.status === "OK" ? "✓" : "✕") + '</span><span class="nm">'
        + (TOOL_LABEL[t.tool] || t.tool) + '</span><span class="ms">' + t.ms + "ms</span></div>").join("") + "</div>";
      if (m.ceiling) html += '<div class="notice">Đã chạm trần 8 lượt gọi công cụ. Trợ lý dừng vòng lặp và trả lời bằng dữ liệu đang có — đây không phải lỗi.</div>';
      html += '<div class="msg a"><div class="who">Trợ lý</div>' + esc(m.content).replace(/\n/g, "<br>") + "</div>";
      if (m.candidates && m.candidates.length) html += candidatesCard(m);
      const props = S.db.proposals.filter(p => p.messageId === m.id);
      props.forEach(p => { html += proposalCard(p); });
    }
  });
  return html;
}
function candidatesCard(msg) {
  const rows = (msg.candidates || []).map(c => {
    const x = PROVIDER.places.find(y => y.xid === c.xid);
    if (!x) return "";
    const db = S.db.places.find(pp => pp.externalId === c.xid);
    return '<div style="padding:10px 0;border-bottom:1px solid var(--console-line)">'
      + '<div class="row" style="gap:8px;align-items:baseline"><b style="font-size:13.5px">' + esc(x.name) + "</b>"
      + '<span class="ai-note">' + esc(x.category) + " · " + x.rating + "★ · " + PRICE_LABEL[x.price] + "</span>"
      + '<span style="margin-left:auto;font-family:var(--f-mo);font-size:11.5px;color:' + (db ? "#4ec3ac" : "var(--console-muted)") + '">'
      + (db ? "✓ trong CSDL" : "chưa lưu") + "</span></div>"
      + '<div class="ai-note" style="margin:3px 0 7px">' + esc(c.why) + " · cách trung tâm " + c.km.toFixed(1).replace(".", ",") + " km"
      + (x.fee ? " · vé khoảng " + money(x.fee, CUR.currency) + "/người" : " · miễn phí") + "</div>"
      + '<div class="row" style="gap:6px"><button class="btn s p" data-act="place-add" data-xid="' + x.xid + '">Thêm vào ngày…</button>'
      + (db ? '<button class="btn s" disabled>Đã trong CSDL</button>'
        : '<button class="btn s" data-act="place-save" data-xid="' + x.xid + '">Chỉ lưu lại</button>') + "</div></div>";
  }).join("");
  return '<div class="prop" data-cands="' + msg.id + '"><div class="ph"><span class="t">GỢI Ý ĐỊA ĐIỂM</span>'
    + '<span class="ai-note">từ ' + esc(PROVIDER.name) + "</span></div>"
    + '<div class="pb"><div class="notice">Danh sách này <b style="color:#4ec3ac">chưa nằm trong cơ sở dữ liệu của bạn</b>. Nó là kết quả tra cứu, giữ tạm trong bộ đệm một giờ. Bấm chọn thì mới ghi xuống.</div>'
    + "<div>" + rows + "</div></div></div>";
}

/* Khối hiện sau khi áp dụng: đã ghi gì, bỏ qua gì, và còn lùi được không. */
function appliedFooter(p, whatWasWritten) {
  const c = canUndo(p);
  const mins = Math.ceil(c.msLeft / 60000);
  return '<div class="notice">' + whatWasWritten
    + (p.skipped && p.skipped.length ? "<br><b style='color:#e58573'>" + p.skipped.length + " thao tác bị bỏ qua:</b> "
      + p.skipped.map(x => esc(x.title || "#" + x.activityId) + " — " + (SKIP_WORDS[x.reason] || x.reason)).join("; ") : "")
    + "</div>"
    + (c.ok
      ? '<div class="row" style="gap:8px"><button class="btn s" data-act="prop-undo" data-id="' + p.id + '">↶ Hoàn tác</button>'
      + '<span class="ai-note" style="align-self:center">còn ' + mins + " phút</span></div>"
      : c.reason === "WINDOW_CLOSED" ? '<div class="ai-note">Quá 10 phút nên không hoàn tác tự động được nữa. Sửa tay ở tab Lịch trình.</div>'
        : c.reason === "BLOCKED_BY_LATER" ? '<div class="ai-note">Bạn đã áp dụng một đề xuất khác sau cái này và hai cái đụng cùng một hoạt động. Hoàn tác đề xuất mới nhất trước đã.</div>'
          : "");
}
const SKIP_WORDS = {
  ACTIVITY_ALREADY_DELETED: "hoạt động đã bị xoá từ trước",
  PLACE_NOT_FOUND: "địa điểm không còn trong hệ thống",
  DAY_NOT_FOUND: "ngày không còn tồn tại",
  ACTIVITY_ALREADY_DONE: "hoạt động này bạn đã làm xong rồi"
};
function revertedFooter(p) {
  return '<div class="notice">Đã hoàn tác lúc ' + new Date(p.revertedAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + "."
    + (p.undoSkipped && p.undoSkipped.length ? "<br><b style='color:#e58573'>" + p.undoSkipped.length + " thao tác không lùi được:</b> "
      + p.undoSkipped.map(x => esc(x.title) + " — " + (UNDO_SKIP_WORDS[x.reason] || x.reason)).join("; ")
      + "<br>Nghĩa là lịch trình <b>không</b> quay về đúng y như trước." : "")
    + "<br>Đề xuất đã hoàn tác thì không áp dụng lại được. Hỏi lại trợ lý để nó dựng đề xuất mới trên dữ liệu hiện tại.</div>";
}

function expenseCard(p) {
  const trip = S.db.trips.find(x => x.id === p.tripId);
  const e = p.expense, parts = tripParts(p.tripId);
  const payer = parts.find(x => x.id === e.paidBy);
  const expired = p.status === "PENDING" && Date.parse(p.expiresAt) < Date.now();
  const st = expired ? "EXPIRED" : p.status;
  const head = { PENDING: "PHIẾU CHI TIÊU", APPLIED: "ĐÃ GHI VÀO SỔ", REJECTED: "ĐÃ BỎ", EXPIRED: "ĐÃ HẾT HẠN", REVERTED: "ĐÃ RÚT LẠI" }[st];
  return '<div class="prop' + (st === "APPLIED" ? " applied" : st === "PENDING" ? "" : " dead") + '" data-prop="' + p.id + '">'
    + '<div class="ph"><span class="t">' + head + "</span>"
    + '<span class="ai-note">' + (e.placeName ? esc(e.placeName) : "không rõ địa điểm") + "</span></div>"
    + '<div class="pb"><div style="font-family:var(--f-mo);font-size:22px;color:#4ec3ac">' + money(e.minor, e.currency) + "</div>"
    + '<dl class="deltas" style="border-top:none;padding-top:0">'
    + "<dt>Hạng mục</dt><dd>" + EXP_LABEL[e.category] + "</dd>"
    + "<dt>Ngày chi</dt><dd>" + fmtD(e.date) + "</dd>"
    + "<dt>Người trả</dt><dd>" + (payer ? esc(payer.name) : "—") + "</dd>"
    + "<dt>Chia cho</dt><dd>" + e.shareWith.length + " người</dd>"
    + "<dt>Mỗi người</dt><dd>" + money(Math.round(e.minor / Math.max(e.shareWith.length, 1)), e.currency) + "</dd></dl>"
    + (st === "PENDING"
      ? '<div class="notice">Chưa có gì vào sổ. Trợ lý chỉ đọc câu của bạn ra thành các trường — <b style="color:#4ec3ac">số tiền do mã tính, không do mô hình đoán</b>. Sai chỗ nào thì bấm Sửa.</div>'
      + '<div class="row" style="gap:8px"><button class="btn p s" data-act="prop-apply" data-id="' + p.id + '">Ghi vào sổ chi tiêu</button>'
      + '<button class="btn s" data-act="exp-edit-prop" data-id="' + p.id + '">Sửa</button>'
      + '<button class="btn s" data-act="prop-reject" data-id="' + p.id + '">Bỏ qua</button></div>'
      : st === "APPLIED" ? appliedFooter(p, "Đã ghi vào sổ chi tiêu lúc " + new Date(p.appliedAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + ". Xem ở tab Ngân sách.")
        : st === "REVERTED" ? revertedFooter(p)
        : st === "EXPIRED" ? '<div class="notice">Phiếu này quá hạn. Nhắn lại cho trợ lý để nó đọc lại câu của bạn.</div>'
          : '<div class="notice">Bạn đã bỏ phiếu này. Không có gì được ghi.</div>')
    + "</div></div>";
}

function proposalCard(p) {
  if (p.kind === "EXPENSE") return expenseCard(p);
  const trip = S.db.trips.find(x => x.id === p.tripId);
  const expired = p.status === "PENDING" && Date.parse(p.expiresAt) < Date.now();
  const st = expired ? "EXPIRED" : p.status;
  const b = budgetOf(p.tripId);
  const label = { PENDING: [p.optionTitle ? "PHƯƠNG ÁN · " + p.optionTitle.toUpperCase() : "ĐỀ XUẤT THAY ĐỔI", ""], APPLIED: ["ĐÃ ÁP DỤNG", "applied"], REJECTED: [p.rejectReason === "SUPERSEDED" ? "ĐÃ BỎ — BẠN CHỌN PHƯƠNG ÁN KHÁC" : "ĐÃ HUỶ", "dead"], EXPIRED: ["ĐÃ HẾT HẠN", "dead"], REVERTED: ["ĐÃ HOÀN TÁC", "dead"] }[st];
  const ops = p.changes.map(op => {
    if (op.op === "REMOVE") return '<div class="op rm"><span class="sg">−</span><span class="txt">' + esc(op.title) + '</span><span class="tm">' + (op.time || "") + "</span></div>";
    if (op.op === "ADD") return '<div class="op add"><span class="sg">+</span><span class="txt">' + esc(op.title) + '</span><span class="tm">' + (op.start || "") + "</span></div>";
    /* Thao tác sửa phải hiện CẢ hai giá trị. "đổi giờ" không nói được gì. */
    const cur = S.db.activities.find(x => x.id === op.activityId);
    const wasStart = cur ? cur.start : null, nowStart = op.patch && op.patch.start;
    const shown = st === "PENDING" && wasStart && nowStart && wasStart !== nowStart
      ? wasStart + " → " + nowStart : (nowStart || "");
    return '<div class="op"><span class="sg">~</span><span class="txt">' + esc(op.title)
      + " <span style='color:var(--console-muted)'>(" + esc(op.note || "đổi giờ") + ")</span></span>"
      + '<span class="tm">' + esc(shown) + "</span></div>";
  }).join("");
  /* Đã áp dụng thì `estimatedTotal` đã gồm thay đổi rồi; đã hoàn tác thì nó đã trở
     lại như cũ. Cả hai trường hợp cộng thêm `costDelta` là ra một con số vô nghĩa. */
  const settled = st === "APPLIED" || st === "REVERTED";
  const after = settled ? null : b.estimatedTotal + p.costDelta;
  return '<div class="prop ' + label[1] + '" data-prop="' + p.id + '">'
    + '<div class="ph"><span class="t">' + label[0] + "</span>"
    + (st === "PENDING" ? '<span class="ai-note">hết hạn lúc ' + new Date(p.expiresAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + "</span>" : "") + "</div>"
    + '<div class="pb"><div class="ai-note">' + esc(p.summary) + "</div>"
    + "<div>" + ops + "</div>"
    + (p.metrics ? '<dl class="deltas" style="border-top:none;padding-top:0">'
      + "<dt>Ước tính</dt><dd>" + money(p.metrics.estimated, trip.currency) + " <span style=\"color:var(--console-muted)\">(" + moneySigned(p.costDelta, trip.currency) + ")</span></dd>"
      + "<dt>Quãng đường</dt><dd>" + p.metrics.km.toFixed(1).replace(".", ",") + " km <span style=\"color:var(--console-muted)\">(" + (p.metrics.km >= p.baseline.km ? "+" : "−") + Math.abs(p.metrics.km - p.baseline.km).toFixed(1).replace(".", ",") + ")</span></dd>"
      + "<dt>Ngoài trời gặp mưa</dt><dd>" + p.metrics.rainExposed + " hoạt động <span style=\"color:var(--console-muted)\">(trước: " + p.baseline.rainExposed + ")</span></dd></dl>"
      + ((p.constraints && p.constraints.length) ? '<div class="stack s" style="gap:4px;padding-top:8px;border-top:1px dashed var(--console-line)">'
        + p.constraints.map(c => '<div class="row" style="gap:7px;font-size:12px">'
          + '<span style="color:' + (c.ok ? "#4ec3ac" : "#e58573") + '">' + (c.ok ? "✓" : "✕") + "</span>"
          + '<span style="flex:1;color:var(--console-ink)">' + esc(c.label) + "</span>"
          + '<span style="color:var(--console-muted)">' + esc(c.detail) + "</span></div>").join("")
        + "</div>" : "")
      + '<div class="ai-note">Ba con số trên do mã tính lại trên bản sao lịch trình, không phải mô hình ước lượng. Cột “ngoài trời gặp mưa” chỉ đếm ngày có <b>dự báo thật</b>, bỏ qua ngày chỉ có trung bình khí hậu.</div>'
      : "")
    + '<dl class="deltas"><dt>Chi phí ước tính</dt><dd>' + moneySigned(p.costDelta, trip.currency) + "</dd>"
    + "<dt>Thời gian di chuyển</dt><dd>" + (p.travelDelta > 0 ? "+" : "−") + Math.abs(p.travelDelta) + " phút</dd>"
    + (trip.budget && after != null ? "<dt>Ngân sách sau khi áp dụng</dt><dd>" + money(after, trip.currency) + " / " + money(trip.budget, trip.currency) + "</dd>" : "")
    + "</dl>"
    + (st === "PENDING"
      ? '<div class="notice">Lịch trình của bạn <b style="color:#4ec3ac">chưa đổi gì cả</b>. Thẻ này mới chỉ là đề xuất — bấm áp dụng thì hệ thống mới ghi vào lịch trình.'
      + (p.optionOf ? " Chọn phương án này thì các phương án còn lại tự bỏ." : "") + "</div>"
      + '<div class="row" style="gap:8px"><button class="btn p s" data-act="prop-apply" data-id="' + p.id + '">' + (p.optionOf ? "Chọn phương án này" : "Áp dụng thay đổi") + "</button>"
      + '<button class="btn s" data-act="prop-reject" data-id="' + p.id + '" style="background:transparent;border-color:var(--console-line);color:var(--console-muted)">Huỷ</button></div>'
      : st === "APPLIED"
        ? appliedFooter(p, "Đã ghi vào lịch trình lúc " + new Date(p.appliedAt).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + ".")
        : st === "REVERTED"
          ? revertedFooter(p)
          : st === "EXPIRED"
            ? '<div class="notice">Đề xuất này đã quá hạn. Nút áp dụng biến mất — hỏi lại trợ lý để nó dựng đề xuất mới trên dữ liệu hiện tại.</div>'
            : '<div class="notice">Bạn đã huỷ đề xuất này. Lịch trình giữ nguyên.</div>')
    + "</div></div>";
}
/* Vẽ lại đúng tab đang mở sau khi dữ liệu đổi. Thiếu một nhánh là tab đó đứng lại
   với số liệu cũ. */
async function refreshCurrentTab() {
  const p = path();
  try {
    CUR = await api.trip(CUR.id);
    if (p.endsWith("/itinerary")) await tabItinerary(CUR);
    else if (p.endsWith("/map")) await tabMap(CUR);
    else if (p.endsWith("/budget")) await tabBudget(CUR);
    else if (p.endsWith("/review")) await tabReview(CUR);
    else if (/\/app\/trips\/\d+$/.test(p)) await tabOverview(CUR);
  } catch (e) { handle(e); }
}

function assistantShell(mode, tripId) {
  const head = mode === "drawer"
    ? '<div class="dh"><div><div style="font-weight:600;font-size:14px">Trợ lý TripMind</div>'
    + '<div class="ai-note">' + esc((S.db.destinations.find(x => x.id === CUR.destId) || {}).name || "") + " · " + fmtD(CUR.startDate) + " — " + fmtD(CUR.endDate) + "</div></div>"
    + '<button class="icb" data-act="drawer-close" aria-label="Đóng">✕</button></div>' : "";
  return head
    + '<div class="db" id="as-body">' + assistantBody(tripId) + "</div>"
    + '<div class="df"><div class="sugg">' + SUGGESTIONS.map(s => '<button data-act="as-sugg" data-q="' + esc(s) + '">' + esc(s) + "</button>").join("") + "</div>"
    + '<form class="ai-input" data-act="as-send"><textarea id="as-input" rows="1" placeholder="Hỏi bất cứ điều gì về chuyến đi…"></textarea>'
    + '<button class="btn p" type="submit" id="as-send">Gửi</button></form></div>';
}
function openDrawer() {
  if (drawerOpen || !CUR) return;
  drawerOpen = true;
  const sc = document.createElement("div"); sc.className = "scrim"; sc.dataset.act = "drawer-close";
  const dr = document.createElement("aside"); dr.className = "drawer"; dr.innerHTML = assistantShell("drawer", CUR.id);
  $("#overlays").append(sc, dr);
  scrollAS(); $("#as-input").focus();
}
function closeDrawer() { drawerOpen = false; const s = $(".scrim"), d2 = $(".drawer"); if (s) s.remove(); if (d2) d2.remove(); }
function scrollAS() {
  const b = $("#as-body"); if (!b) return;
  const go = () => { const x = $("#as-body"); if (x) x.scrollTop = x.scrollHeight; };
  go(); requestAnimationFrame(go); setTimeout(go, 140);
}

async function tabAssistant(t) {
  const log = await api.tripToolActivity(t.id);
  $("#tabview").innerHTML = '<div class="grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start">'
    + '<div class="stack" style="gap:12px"><div><h2 class="dp" style="font-size:23px">Trợ lý</h2>'
    + '<p class="sub">Hỏi chỗ ăn chơi, bảo nó dựng phương án tối ưu, hay chỉ cần kể “hôm qua ăn hết 450k” là nó ghi hộ vào sổ chi tiêu. Mọi thứ nó làm đều dừng ở mức <b>đề xuất</b> cho tới khi bạn bấm.</p></div>'
    + '<div class="console-panel">' + assistantShell("tab", t.id) + "</div></div>"
    + '<div class="stack"><div class="card pad stack" style="gap:9px"><h3 style="font-size:15px">Công cụ trợ lý đã chạy cho chuyến này</h3>'
    + (log.length ? '<div class="stack" style="gap:0">' + log.slice(0, 14).map(x =>
      '<div class="row" style="gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px">'
      + '<span class="chip ' + (x.status === "OK" ? "t" : x.status === "TIMEOUT" ? "w" : "c") + '" style="min-width:62px;justify-content:center">' + x.status + "</span>"
      + '<span class="mo" style="flex:1;overflow:hidden;text-overflow:ellipsis">' + x.tool + "</span>"
      + '<span class="mo num tiny">' + x.ms + "ms</span></div>").join("") + "</div>"
      : '<div class="empty"><p>Chưa có lượt gọi công cụ nào cho chuyến này. Hỏi trợ lý một câu rồi quay lại đây xem.</p></div>')
    + '<p class="tiny">Đây là bằng chứng nhìn thấy được rằng trợ lý thực sự gọi công cụ để lấy dữ liệu, chứ không tự bịa câu trả lời.</p></div>'
    + '<div class="card pad stack" style="gap:8px"><h3 style="font-size:15px">' + Object.keys(TOOL_LABEL).length + " công cụ</h3>"
    + '<div class="stack" style="gap:3px">' + Object.keys(TOOL_LABEL).map(k =>
      '<div class="row" style="gap:8px;font-size:12.5px"><span class="mo" style="flex:1;overflow:hidden;text-overflow:ellipsis">' + k + "</span>"
      + '<span class="chip' + (WRITE_TOOLS.includes(k) ? " w" : "") + '">' + (WRITE_TOOLS.includes(k) ? "ghi đề xuất" : "chỉ đọc") + "</span></div>").join("") + "</div>"
    + '<p class="tiny"><b>Không công cụ nào chạm được vào lịch trình, sổ chi tiêu hay bảng địa điểm.</b> Ba công cụ ghi chỉ ghi vào bảng đề xuất; mọi thứ vào cơ sở dữ liệu đều đi qua một cú bấm của bạn.</p>'
    + '<p class="tiny">Mô hình <b>không thấy</b> mã chuyến đi và mã người dùng — hai giá trị đó đi qua ngữ cảnh bảo mật của yêu cầu, ngoài tầm với của mô hình.</p></div></div></div>'
    + '<style>@media(max-width:960px){#tabview>.grid{grid-template-columns:1fr !important}}</style>';
  scrollAS();
}

Object.assign(actions, {
  "drawer-open"() { openDrawer(); },
  "drawer-close"() { closeDrawer(); },
  "as-sugg"(el) { const i = $("#as-input"); if (i) { i.value = el.dataset.q; i.focus(); } },
  async "as-send"(form) {
    if (AS_BUSY) return;
    const inp = $("#as-input"), text = inp.value.trim();
    if (!text) return;
    AS_BUSY = true;
    inp.value = ""; $("#as-send").disabled = true; $("#as-send").textContent = "…";
    const body = $("#as-body");
    body.insertAdjacentHTML("beforeend", '<div class="msg u">' + esc(text) + "</div>");
    const strip = document.createElement("div"); strip.className = "toolstrip"; body.appendChild(strip);
    const bubble = document.createElement("div"); bubble.className = "msg a"; bubble.innerHTML = '<div class="who">Trợ lý</div><span class="txt caret"></span>';
    let txtEl = null, acc = "";
    scrollAS();
    try {
      await AI.chat(CUR.id, text, {
        onToolStart(e) {
          const r = document.createElement("div"); r.className = "tl run"; r.dataset.tool = e.tool;
          r.innerHTML = '<span class="ic">◌</span><span class="nm">' + esc(e.label) + '…</span><span class="ms"></span>';
          strip.appendChild(r); scrollAS();
        },
        onToolEnd(e) {
          const r = Array.from(strip.children).reverse().find(x => x.dataset.tool === e.tool && x.classList.contains("run"));
          if (!r) return;
          r.className = "tl " + (e.status === "OK" ? "ok" : "bad");
          $(".ic", r).textContent = e.status === "OK" ? "✓" : "✕";
          $(".nm", r).textContent = (TOOL_LABEL[e.tool] || e.tool) + (e.status === "OK" ? "" : " — " + e.status);
          $(".ms", r).textContent = e.ms + "ms";
          scrollAS();
        },
        onToken(tk) {
          if (!txtEl) { body.appendChild(bubble); txtEl = $(".txt", bubble); }
          acc += tk; txtEl.innerHTML = esc(acc).replace(/\n/g, "<br>"); scrollAS();
        },
        onCandidates(m) {
          body.insertAdjacentHTML("beforeend", candidatesCard(m));
          Tour.mark("candidates"); scrollAS();
        },
        onProposal(p) {
          body.insertAdjacentHTML("beforeend", proposalCard(p));
          Tour.mark(p.kind === "EXPENSE" ? "chatExpense" : "proposal"); scrollAS();
        },
        onError(e) {
          body.insertAdjacentHTML("beforeend", '<div class="notice" style="border-color:#5e332b;background:rgba(229,133,115,.1);color:#e58573">'
            + esc(e.message) + "</div>");
          scrollAS();
        },
        onDone(e) {
          if (txtEl) txtEl.classList.remove("caret");
          if (e.ceiling) body.insertAdjacentHTML("beforeend", '<div class="notice">Đã chạm trần 8 lượt gọi công cụ. Trợ lý dừng vòng lặp và trả lời bằng dữ liệu đang có — đây không phải lỗi.</div>');
          Tour.mark("ask"); scrollAS();
        }
      });
    } catch (e) {
      if (e.http === 429) body.insertAdjacentHTML("beforeend", '<div class="notice" style="border-color:#5e332b;color:#e58573">Bạn đã hỏi khá nhiều rồi. Thử lại sau ' + Math.ceil((e.retryAfterSeconds || 600) / 60) + " phút. Giới hạn này của riêng tầng AI, các tab khác vẫn dùng bình thường.</div>");
      else handle(e);
      scrollAS();
    }
    AS_BUSY = false;
    const sb = $("#as-send"); if (sb) { sb.disabled = false; sb.textContent = "Gửi"; }
  },
  async "prop-apply"(el) {
    el.disabled = true; el.textContent = "Đang áp dụng…";
    try {
      const r = await api.applyProposal(CUR.id, el.dataset.id);
      const p = S.db.proposals.find(x => x.id === Number(el.dataset.id));
      /* Thẻ có thể đang hiện ở CẢ ngăn kéo lẫn tab Trợ lý — cập nhật hết, không thì
         một trong hai chỗ vẫn hiện trạng thái cũ, tức là giao diện nói dối. */
      $$('[data-prop="' + el.dataset.id + '"]').forEach(card => { card.outerHTML = proposalCard(p); });
      toast("Đã áp dụng " + r.applied + " thay đổi vào lịch trình" + (r.skipped.length ? " · " + r.skipped.length + " thao tác bị bỏ qua" : ""), r.skipped.length ? "warn" : "");
      Tour.mark("apply");
      await refreshCurrentTab();
      scrollAS();
    } catch (e) {
      handle(e);
      const p = S.db.proposals.find(x => x.id === Number(el.dataset.id));
      const card = $('[data-prop="' + el.dataset.id + '"]');
      if (card && p) card.outerHTML = proposalCard(p);
    }
  },
  async "prop-undo"(el) {
    const id = Number(el.dataset.id);
    let info;
    try { info = await api.undoInfo(CUR.id, id); } catch (e) { return handle(e); }
    const pv = info.preview;
    const lines = [];
    if (pv.willDelete.length) lines.push("Xoá " + pv.willDelete.length + " thứ trợ lý đã thêm: " + pv.willDelete.map(esc).join(", "));
    if (pv.willRestore.length) lines.push("Dựng lại " + pv.willRestore.length + " hoạt động đã bị xoá: " + pv.willRestore.map(esc).join(", "));
    if (pv.willRevert.length) lines.push("Trả " + pv.willRevert.length + " hoạt động về giá trị cũ: " + pv.willRevert.map(esc).join(", "));
    openModal({
      title: "Hoàn tác đề xuất này?",
      body: (lines.length ? '<div class="stack s"><div class="eyebrow">Sẽ làm đúng những việc này</div>'
        + lines.map(l => '<div style="font-size:13.5px">· ' + l + "</div>").join("") + "</div>"
        : '<div class="empty"><p>Không còn thao tác nào lùi được — mọi thứ đề xuất này làm đều đã bị sửa hoặc xoá từ trước.</p></div>')
        + (pv.willSkip.length ? '<div class="plain pad" style="border-color:var(--sand-line);background:var(--sand-soft)">'
          + "<b style='color:var(--sand)'>" + pv.willSkip.length + " thao tác sẽ KHÔNG lùi:</b><br>"
          + '<span class="tiny">' + pv.willSkip.map(x => esc(x.title) + " — " + (UNDO_SKIP_WORDS[x.reason] || x.reason)).join("<br>") + "</span><br>"
          + '<span class="tiny">Nghĩa là lịch trình sẽ <b>không</b> quay về đúng y như trước. Hệ thống giữ nguyên phần bạn đã sửa tay thay vì đè lên.</span></div>' : "")
        + '<p class="tiny">Địa điểm đã được ghi vào cơ sở dữ liệu lúc bạn bấm áp dụng <b>vẫn ở lại</b> tab Địa điểm. Hoàn tác lịch trình không rút lại việc đó.</p>',
      footer: '<button class="btn" data-act="modal-close">Thôi</button><button class="btn p" data-act="prop-undo-do" data-id="' + id + '">Hoàn tác</button>'
    });
  },
  async "prop-undo-do"(el) {
    const id = Number(el.dataset.id);
    try {
      const r = await api.undoProposal(CUR.id, id);
      closeModal();
      const p = S.db.proposals.find(x => x.id === id);
      $$('[data-prop="' + id + '"]').forEach(card => { card.outerHTML = proposalCard(p); });
      toast("Đã hoàn tác " + r.reverted + " thao tác" + (r.undoSkipped.length ? " · " + r.undoSkipped.length + " thao tác giữ nguyên vì bạn đã sửa tay" : ""),
        r.undoSkipped.length ? "warn" : "");
      await refreshCurrentTab();
      scrollAS();
    } catch (e) { handle(e); closeModal(); }
  },
  async "prop-reject"(el) {
    try {
      await api.rejectProposal(el.dataset.id);
      const p = S.db.proposals.find(x => x.id === Number(el.dataset.id));
      const card = $('[data-prop="' + el.dataset.id + '"]');
      if (card) card.outerHTML = proposalCard(p);
      toast("Đã huỷ đề xuất — lịch trình giữ nguyên");
    } catch (e) { handle(e); }
  }
});
</script>

<script>
"use strict";
/* =============================================================================
   14. Quản trị — chỉ đọc. Không có nút sửa nội dung chuyến đi của ai — FR-906
   ========================================================================== */
const ADMIN_TABS = [["users", "Người dùng", "#/admin/users"], ["trips", "Chuyến đi", "#/admin/trips"],
["tools", "Nhật ký công cụ", "#/admin/tool-executions"], ["usage", "Thống kê AI", "#/admin/ai-usage"]];
let TF = { userId: "", tool: "", status: "" };

async function vAdmin(kind) {
  const sub = '<div class="tripbar adminbar"><div class="in">'
    + '<div><div class="dp" style="font-size:22px">Quản trị</div>'
    + '<div class="sub">Chỉ đọc. Quản trị xem được danh sách và nhật ký, <b>không xem được nội dung lịch trình của người khác</b> và không sửa được gì.</div></div>'
    + '<nav class="tabs">' + ADMIN_TABS.map(x => '<a class="tab' + (kind === x[0] ? " on" : "") + '" href="' + x[2] + '">' + x[1] + "</a>").join("") + "</nav></div></div>";
  shell('<div class="wrap wide" id="tabview">' + skeletonBlock(5) + "</div>", sub);
  try {
    if (kind === "users") await adminUsers();
    else if (kind === "trips") await adminTrips();
    else if (kind === "tools") await adminTools();
    else await adminUsage();
  } catch (e) { handle(e); }
}
async function adminUsers() {
  const list = await api.adminUsers();
  $("#tabview").innerHTML = '<div class="stack" style="gap:12px"><h2 class="dp" style="font-size:22px">Người dùng</h2>'
    + '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tên</th><th>Email</th><th>Vai trò</th><th class="r">Số chuyến</th><th>Tạo lúc</th><th>Trạng thái</th></tr></thead><tbody>'
    + list.map(u => "<tr><td><b>" + esc(u.name) + "</b></td><td class='mo'>" + esc(u.email) + "</td>"
      + '<td><span class="chip' + (u.role === "ADMIN" ? " w" : "") + '">' + u.role + "</span></td>"
      + "<td class='r num'>" + u.trips + "</td><td class='mo'>" + fmtD(u.createdAt) + "</td>"
      + '<td><span class="chip' + (u.active ? " t" : " c") + '">' + (u.active ? "Đang hoạt động" : "Đã khoá") + "</span></td></tr>").join("")
    + "</tbody></table></div>"

  go(i) { this.i = Math.max(0, Math.min(this.steps.length - 1, i)); this.save(); nav(this.steps[this.i].r()); this.draw(); },
  next() { this.go(this.i + 1); },
  mark(k) { if (!k) return; this.done[k] = true; this.save(); this.draw(); },
  sync() {
    const p = path();
    const nx = this.steps[this.i + 1];
    if (nx && nx.m.test(p) && !this.steps[this.i].m.test(p)) { this.i++; this.save(); }
    this.draw();
  },
  draw() {
    let el = $(".tour");
    if (!el) { el = document.createElement("aside"); el.className = "tour"; $("#overlays").appendChild(el); }
    el.classList.toggle("min", this.hidden);
    const s = this.steps[this.i];
    const doneCount = this.steps.filter(x => x.k && this.done[x.k]).length;
    el.innerHTML = '<div class="th" data-act="tour-min"><span class="n">Kịch bản ' + (this.i + 1) + "/" + this.steps.length + "</span>"
      + "<h4>" + esc(s.t) + '</h4><span aria-hidden="true">' + (this.hidden ? "▲" : "▼") + "</span></div>"
      + '<div class="tb"><div class="goal">' + s.g + "</div>"
      + "<ol>" + this.steps.map((x, i) =>
        '<li class="' + (i === this.i ? "on" : (x.k && this.done[x.k]) || i < this.i ? "done" : "") + '" data-act="tour-goto" data-i="' + i + '">'
        + '<span class="k">' + (i + 1) + "</span><span>" + esc(x.t) + "</span></li>").join("") + "</ol>"
      + '<div class="row" style="gap:6px"><button class="btn p s" data-act="tour-next"' + (this.i >= this.steps.length - 1 ? " disabled" : "") + ">Bước tiếp →</button>"
      + '<button class="btn s" data-act="demo-panel">Tình huống hỏng</button>'
      + '<span class="tiny" style="margin-left:auto">' + doneCount + "/" + this.steps.filter(x => x.k).length + " việc</span></div></div>";
  }
};
Object.assign(actions, {
  "tour-min"() { Tour.hidden = !Tour.hidden; Tour.save(); Tour.draw(); },
  "tour-start"() { Tour.hidden = false; Tour.go(0); }
});

/* =============================================================================
   17. Khởi động
   ========================================================================== */
(function boot() {
  if (!load()) resetAll();
  /* Dữ liệu cũ từ phiên bản demo trước thì dựng lại cho khớp. Kiểm TỪNG bảng chứ
     không kiểm vài cái đại diện — thiếu một bảng là dòng `.filter()` đầu tiên nổ. */
  const TABLES = ["users", "preferences", "destinations", "places", "savedPlaces", "trips", "days",
    "activities", "expenses", "participants", "journalEntries", "photos", "conversations",
    "messages", "proposals", "toolExecutions"];
  if (!S.db || TABLES.some(k => !Array.isArray(S.db[k]))) resetAll();
  if (!S.db.seq) S.db.seq = {};
  if (typeof S.db.applySeq !== "number") S.db.applySeq = 0;
  Tour.load();
  if (!location.hash) location.hash = S.session ? (S.session.role === "ADMIN" ? "#/admin/users" : "#/app") : "#/";
  render();
  Tour.draw();
})();
</script>
