    p.status = "REJECTED"; save(); return p;
  },
  /* Chỉ nhận MÃ đề xuất — BR-506. Bốn điều kiểm — ADS-30 §10.2 */
  async applyProposal(tripId, proposalId) {
    await sleep(lat() + 380);
    const t = ownTrip(tripId);
    const p = S.db.proposals.find(x => x.id === Number(proposalId));
    if (!p || p.tripId !== t.id) throw new ApiError(404, "PROPOSAL_NOT_FOUND", "Không tìm thấy đề xuất");
    if (p.status !== "PENDING") throw new ApiError(409, "PROPOSAL_NOT_PENDING", "Đề xuất đã ở trạng thái " + p.status + ", không áp dụng lại được");
    if (Date.parse(p.expiresAt) < Date.now()) { p.status = "EXPIRED"; save(); throw new ApiError(409, "PROPOSAL_EXPIRED", "Đề xuất đã quá hạn, hãy hỏi lại trợ lý"); }

    const undo = { expiresAt: new Date(Date.now() + (S.flags.undoWindowClosed ? -1000 : UNDO_WINDOW_MS)).toISOString(),
      ops: [], dayOrder: [], touched: { activityIds: [], dayIds: [], expenseIds: [] } };
    p.appliedSeq = ++S.db.applySeq;

    /* Đề xuất ghi chi tiêu: một thao tác, vẫn phải qua một cú bấm của người dùng */
    if (p.kind === "EXPENSE") {
      const e = p.expense;
      const created = await api.addExpense(t.id, {
        minor: e.minor, currency: e.currency, category: e.category, description: e.description,
        date: e.date, paidBy: e.paidBy, shareWith: e.shareWith, placeId: e.placeId, source: "CHAT"
      });
      undo.ops.push({ k: "DELEXP", expenseId: created.id, title: created.description });
      undo.touched.expenseIds.push(created.id);
      p.status = "APPLIED"; p.appliedAt = nowISO(); p.skipped = []; p.undo = undo; save();
      return { applied: 1, skipped: [], budget: budgetOf(t.id) };
    }

    /* Chụp thứ tự CỦA NHỮNG NGÀY BỊ ĐỤNG trước khi sửa — placeByTime đánh số lại cả
       ngày, nên không có ảnh này thì hoàn tác không trả lại đúng thứ tự được. */
    const touchedDays = new Set();
    p.changes.forEach(op => {
      if (op.op === "ADD") { const d0 = tripDays(t.id).find(x => x.dayNumber === op.dayNumber); if (d0) touchedDays.add(d0.id); }
      else { const a0 = S.db.activities.find(x => x.id === op.activityId); if (a0) touchedDays.add(a0.dayId); }
    });
    touchedDays.forEach(id => { undo.dayOrder.push({ dayId: id, ids: dayActs(id).map(a => a.id) }); undo.touched.dayIds.push(id); });

    /* Kiểm lại từng thao tác lúc áp dụng — BR-507. Không tin bản ghi cũ. */
    const skipped = []; let applied = 0;
    for (const op of p.changes) {
      if (op.op === "REMOVE") {
        const a = S.db.activities.find(x => x.id === op.activityId);
        if (!a) { skipped.push({ op: "REMOVE", activityId: op.activityId, title: op.title, reason: "ACTIVITY_ALREADY_DELETED" }); continue; }
        /* Đã đi rồi thì không xoá khỏi lịch trình được nữa — chuyện đã xảy ra. */
        if (isFrozen(a)) { skipped.push({ op: "REMOVE", activityId: a.id, title: a.title, reason: "ACTIVITY_ALREADY_DONE" }); continue; }
        undo.ops.push({ k: "INS", row: clone(a), title: a.title });
        undo.touched.activityIds.push(a.id);
        S.db.activities = S.db.activities.filter(x => x.id !== a.id); applied++;
      } else if (op.op === "ADD") {
        if (op.placeId && !S.db.places.some(x => x.id === op.placeId)) { skipped.push({ op: "ADD", title: op.title, reason: "PLACE_NOT_FOUND" }); continue; }
        let pid = op.placeId || null;
        /* Địa điểm mới chỉ được ghi xuống CSDL ở ĐÂY — sau cú bấm áp dụng của người dùng */
        if (!pid && op.placeXid) {
          if (!PROVIDER.places.some(x => x.xid === op.placeXid)) { skipped.push({ op: "ADD", title: op.title, reason: "PLACE_NOT_FOUND" }); continue; }
          pid = api.adoptPlace(op.placeXid, "PROPOSAL").id;
        }
        const day = tripDays(t.id).find(x => x.dayNumber === op.dayNumber);
        if (!day) { skipped.push({ op: "ADD", title: op.title, reason: "DAY_NOT_FOUND" }); continue; }
        const na = {
          id: nextId("activities"), dayId: day.id, title: op.title, placeId: pid, type: op.type || "OTHER",
          createdBy: "AI", start: op.start || null, end: op.end || null, cost: op.cost == null ? null : op.cost,
          notes: op.notes || null, order: 999, fromProposalId: p.id
        };
        S.db.activities.push(na); placeByTime(day.id, na.id);
        undo.ops.push({ k: "DEL", activityId: na.id, title: na.title, fp: actFingerprint(na) });
        undo.touched.activityIds.push(na.id);
        applied++;
      } else if (op.op === "UPDATE") {
        const a = S.db.activities.find(x => x.id === op.activityId);
        if (!a) { skipped.push({ op: "UPDATE", activityId: op.activityId, title: op.title, reason: "ACTIVITY_ALREADY_DELETED" }); continue; }
        if (isFrozen(a)) { skipped.push({ op: "UPDATE", activityId: a.id, title: a.title, reason: "ACTIVITY_ALREADY_DONE" }); continue; }
        /* Phải phân biệt "khoá có giá trị null" với "khoá không tồn tại": gán undefined
           thì JSON.stringify trong save() nuốt khoá, đọc lại sẽ khác trong bộ nhớ. */
        const keys = Object.keys(op.patch), prev = {}, missing = [];
        keys.forEach(k => { if (Object.prototype.hasOwnProperty.call(a, k)) prev[k] = a[k]; else missing.push(k); });
        Object.assign(a, op.patch);
        undo.ops.push({ k: "RESTORE", activityId: a.id, title: a.title, prev, missing, keys, fp: actFingerprint(a) });
        undo.touched.activityIds.push(a.id);
        applied++;
      }
    }
    p.status = "APPLIED"; p.appliedAt = nowISO(); p.skipped = skipped; p.undo = undo;
    let superseded = 0;
    if (p.optionOf) S.db.proposals.forEach(x => {
      if (x.optionOf === p.optionOf && x.id !== p.id && x.status === "PENDING") { x.status = "REJECTED"; x.rejectReason = "SUPERSEDED"; superseded++; }
    });
    save();
    return { applied, skipped, superseded, itinerary: await api.itinerary(t.id) };
  },

  /* Hoàn tác: năm điều kiểm, đối xứng với bốn điều kiểm lúc áp dụng */
  async undoProposal(tripId, proposalId) {
    await sleep(lat() + 260);
    const t = ownTrip(tripId);
    const p = S.db.proposals.find(x => x.id === Number(proposalId));
    if (!p || p.tripId !== t.id) throw new ApiError(404, "PROPOSAL_NOT_FOUND", "Không tìm thấy đề xuất");
    const c = canUndo(p);
    if (!c.ok) {
      const map = {
        NOT_APPLIED: ["PROPOSAL_NOT_APPLIED", "Đề xuất này đang ở trạng thái " + p.status + ", không có gì để hoàn tác"],
        NOT_AVAILABLE: ["UNDO_NOT_AVAILABLE", "Đề xuất này được áp dụng trước khi bản demo có tính năng hoàn tác nên không lùi tự động được"],
        WINDOW_CLOSED: ["UNDO_WINDOW_CLOSED", "Quá 10 phút nên không hoàn tác tự động được nữa. Sửa tay ở tab Lịch trình."],
        BLOCKED_BY_LATER: ["UNDO_BLOCKED_BY_LATER", "Bạn đã áp dụng một đề xuất khác sau đề xuất này và hai cái đụng cùng một hoạt động. Hoàn tác đề xuất mới nhất trước đã."]
      }[c.reason];
      throw new ApiError(409, map[0], map[1], { blockedBy: c.blockedBy || null });
    }

    const undoSkipped = []; let reverted = 0;
    /* Duyệt NGƯỢC thứ tự áp dụng, và kiểm lại từng bước — cùng nguyên tắc BR-507:
       không tin bản ghi cũ, vì lịch trình có thể đã đổi từ lúc áp dụng. */
    for (let i = p.undo.ops.length - 1; i >= 0; i--) {
      const op = p.undo.ops[i];
      if (op.k === "DEL") {
        const a = S.db.activities.find(x => x.id === op.activityId);
        if (!a) { undoSkipped.push({ title: op.title, reason: "ACTIVITY_ALREADY_DELETED" }); continue; }
        /* Người dùng đã sửa tay sau khi áp dụng → GIỮ LẠI. Hoàn tác không được nuốt
           công sức người dùng; thà lùi dở dang mà nói rõ. */
        if (actFingerprint(a) !== op.fp) { undoSkipped.push({ title: a.title, reason: "ACTIVITY_EDITED_AFTER_APPLY" }); continue; }
        S.db.activities = S.db.activities.filter(x => x.id !== a.id); reverted++;
      } else if (op.k === "INS") {
        const row = clone(op.row);
        if (S.db.activities.some(x => x.id === row.id)) row.id = nextId("activities");   /* id đã bị chiếm */
        if (!S.db.days.some(d0 => d0.id === row.dayId)) { undoSkipped.push({ title: row.title, reason: "DAY_NOT_FOUND" }); continue; }
        S.db.activities.push(row); reverted++;
      } else if (op.k === "RESTORE") {
        const a = S.db.activities.find(x => x.id === op.activityId);
        if (!a) { undoSkipped.push({ title: op.title, reason: "ACTIVITY_ALREADY_DELETED" }); continue; }
        if (actFingerprint(a) !== op.fp) { undoSkipped.push({ title: a.title, reason: "ACTIVITY_EDITED_AFTER_APPLY" }); continue; }
        Object.keys(op.prev).forEach(k => { a[k] = op.prev[k]; });
        (op.missing || []).forEach(k => { delete a[k]; });   /* khoá vốn không tồn tại thì xoá hẳn */
        reverted++;
      } else if (op.k === "DELEXP") {
        const e = S.db.expenses.find(x => x.id === op.expenseId);
        if (!e) { undoSkipped.push({ title: op.title || "khoản chi", reason: "EXPENSE_ALREADY_DELETED" }); continue; }
        S.db.expenses = S.db.expenses.filter(x => x.id !== e.id); reverted++;
      }
    }
    /* Trả lại thứ tự trong ngày. KHÔNG dùng sortDayByTime — hàm đó xếp lại theo giờ và
       sẽ phá thứ tự người dùng đã kéo thả. */
    (p.undo.dayOrder || []).forEach(d0 => restoreDayOrder(d0.dayId, d0.ids));

    p.status = "REVERTED"; p.revertedAt = nowISO(); p.undoSkipped = undoSkipped;
    save();
    return { reverted, undoSkipped, itinerary: p.kind === "EXPENSE" ? null : await api.itinerary(t.id), budget: budgetOf(t.id) };
  },
  async undoInfo(tripId, proposalId) {
    const t = ownTrip(tripId);
    const p = S.db.proposals.find(x => x.id === Number(proposalId));
    if (!p || p.tripId !== t.id) throw new ApiError(404, "PROPOSAL_NOT_FOUND", "Không tìm thấy đề xuất");
    return { can: canUndo(p), preview: undoPreview(p) };
  },

  /* Quản trị — chỉ đọc, không có điểm cuối sửa nội dung chuyến — FR-906 */
  async adminUsers() { await sleep(lat()); requireAdmin(); return S.db.users.map(u => ({ id: u.id, name: u.name, email: u.email, role: u.role, active: u.active, createdAt: u.createdAt, trips: S.db.trips.filter(t => t.userId === u.id).length })); },
  async adminTrips() { await sleep(lat()); requireAdmin(); return S.db.trips.map(t => ({ id: t.id, name: t.name, owner: S.db.users.find(u => u.id === t.userId).name, destination: S.db.destinations.find(x => x.id === t.destId).name, startDate: t.startDate, endDate: t.endDate, days: diffDays(t.startDate, t.endDate) + 1, activities: tripActs(t.id).length })); },
  async adminToolExecutions(f) {
    await sleep(lat()); requireAdmin(); f = f || {};
    return S.db.toolExecutions.filter(x =>
      (!f.userId || x.userId === Number(f.userId)) && (!f.tool || x.tool === f.tool) && (!f.status || x.status === f.status)
    ).map(x => Object.assign({}, x, { userName: (S.db.users.find(u => u.id === x.userId) || {}).name || "—" }));
  },
  async adminAiUsage() {
    await sleep(lat()); requireAdmin();
    const ex = S.db.toolExecutions, byTool = {}, byDay = {};
    ex.forEach(x => {
      byTool[x.tool] = (byTool[x.tool] || 0) + 1;
      const k = x.at.slice(0, 10); byDay[k] = (byDay[k] || 0) + 1;
    });
    const msgs = S.db.messages.filter(m => m.role === "ASSISTANT");
    return {
      totalToolCalls: ex.length,
      okRate: ex.length ? ex.filter(x => x.status === "OK").length / ex.length : 0,
      avgMs: ex.length ? Math.round(ex.reduce((s, x) => s + x.ms, 0) / ex.length) : 0,
      assistantMessages: msgs.length,
      tokensIn: msgs.length * 1840 + 4200, tokensOut: msgs.length * 260 + 700,
      byTool: Object.entries(byTool).sort((a, b) => b[1] - a[1]),
      byDay: Object.entries(byDay).sort((a, b) => a[0].localeCompare(b[0])).slice(-10)
    };
  }
};

/* Chèn một hoạt động vào đúng chỗ theo giờ, GIỮ NGUYÊN thứ tự người dùng đã kéo thả */
function placeByTime(dayId, actId) {
  const a = S.db.activities.find(x => x.id === actId);
  const list = dayActs(dayId).filter(x => x.id !== actId);
  if (!a.start) list.push(a);
  else {
    let i = list.findIndex(x => x.start && x.start > a.start);
    if (i < 0) i = list.length;
    list.splice(i, 0, a);
  }
  list.forEach((x, k) => x.order = k);
}
/* Xếp lại cả ngày theo giờ — chỉ dùng cho lịch trình vừa sinh */
function sortDayByTime(dayId) {
  const list = dayActs(dayId);
  list.sort((a, b) => (a.start || "99:99").localeCompare(b.start || "99:99"));
  list.forEach((a, i) => a.order = i);
}
</script>

<script>
"use strict";
/* =============================================================================
   4. Trợ lý AI — vòng lặp gọi công cụ, luồng sự kiện, đề xuất
      Mô phỏng đúng chuỗi ở ADS-21 §3.3: tool_start → tool_end → token → proposal → done
   ========================================================================== */
const TOOL_LABEL = {
  get_current_trip: "Đang đọc chuyến đi", get_itinerary: "Đang đọc lịch trình",
  get_user_preferences: "Đang xem sở thích của bạn", get_saved_places: "Đang xem địa điểm đã lưu",
  calculate_trip_budget: "Đang tính ngân sách", get_weather: "Đang kiểm tra thời tiết",
  search_places: "Đang hỏi nhà cung cấp địa điểm", calculate_distance: "Đang tính khoảng cách",
  rank_candidates: "Đang chấm điểm các lựa chọn", parse_expense: "Đang đọc câu ghi chi tiêu",
  get_participants: "Đang xem danh sách người đi",
  propose_places: "Đang dựng danh sách gợi ý", propose_expense: "Đang dựng phiếu chi tiêu",
  propose_itinerary_changes: "Đang dựng bản đề xuất"
};
const WRITE_TOOLS = ["propose_places", "propose_expense", "propose_itinerary_changes"];
const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

/* =============================================================================
   4b. Đọc câu tiếng Việt thành một khoản chi
   "hôm qua ăn ở Bé Mặn hết 1tr2, mình trả, chia đều 2 người"
   → 1.200.000 ₫ · Ăn uống · 18/10 · Hải An trả · chia cho cả hai
   Phần này chạy bằng mã, không giao cho mô hình đoán — cùng lý do với QĐ-09.
   ========================================================================== */
const WORDNUM = { mot: 1, hai: 2, ba: 3, bon: 4, tu: 4, nam: 5, sau: 6, bay: 7, tam: 8, chin: 9, muoi: 10 };
function parseMoney(raw) {
  const t = norm(raw).replace(/\s+/g, " ")
    .replace(/\b(mot|hai|ba|bon|tu|nam|sau|bay|tam|chin|muoi)\s+(tram|nghin|ngan|trieu|tr|cu|k)\b/g, (m, a, b) => WORDNUM[a] + " " + b);
  const rules = [
    [/(\d+)\s*(?:tr|trieu|cu)\s*(\d)\b/, m => Number(m[1]) * 1e6 + Number(m[2]) * 1e5],
    [/(\d+(?:[.,]\d+)?)\s*(?:tr|trieu|cu)\b(\s*ruoi)?/, m => Number(m[1].replace(",", ".")) * 1e6 + (m[2] ? 5e5 : 0)],
    [/(\d+(?:[.,]\d+)?)\s*tram\s*(?:nghin|ngan|k)?\b(\s*ruoi)?/, m => Number(m[1].replace(",", ".")) * 1e5 + (m[2] ? 5e4 : 0)],
    [/(\d+(?:[.,]\d+)?)\s*(?:nghin|ngan|k)\b(\s*ruoi)?/, m => Number(m[1].replace(",", ".")) * 1e3 + (m[2] ? 5e2 : 0)],
    [/(\d{1,3}(?:[.,]\d{3})+)\s*(?:d|dong|vnd)?\b/, m => Number(m[1].replace(/[.,]/g, ""))],
    [/(\d{4,})\s*(?:d|dong|vnd)?\b/, m => Number(m[1])]
  ];
  for (const [re, fn] of rules) { const m = t.match(re); if (m) return Math.round(fn(m)); }
  return null;
}
const CAT_WORDS = [
  ["TRANSPORTATION", ["taxi", "grab", "xe", "xe om", "ve may bay", "may bay", "xang", "tau", "xe khach", "gui xe", "do xe", "thue xe", "ve tau", "ve xe"]],
  ["ACCOMMODATION", ["khach san", "homestay", "resort", "phong", "nha nghi", "hotel", "dat coc phong"]],
  ["FOOD", ["an", "an trua", "an toi", "an sang", "quan", "nha hang", "ca phe", "cafe", "tra sua", "bun", "pho", "com", "nhau", "bia", "lau", "banh", "hai san", "buffet", "do uong", "che"]],
  ["ACTIVITIES", ["ve", "tham quan", "tour", "vao cua", "cap treo", "massage", "spa", "lan bien", "vui choi", "cong vien", "bao tang"]],
  ["SHOPPING", ["mua", "qua", "luu niem", "shop", "sam", "dac san"]]
];
/* Khớp theo TỪ, không theo chuỗi con: "taxi từ sân bay" mà khớp chuỗi con thì
   thành Ăn uống, vì "san bay" có chứa "an". */
function guessCategory(t) {
  const has = w => new RegExp("(^|[^a-z0-9])" + w.replace(/ /g, "\\s+") + "($|[^a-z0-9])").test(t);
  for (const [cat, words] of CAT_WORDS) if (words.some(has)) return cat;
  return "OTHER";
}
function parseExpenseText(text, trip) {
  const t = norm(text).replace(/\s+/g, " ");
  const minor = parseMoney(text);
  if (minor == null) return null;

  let date = TODAY, dateWord = "hôm nay";
  if (/hom qua|toi qua|dem qua|sang qua/.test(t)) { date = addDays(TODAY, -1); dateWord = "hôm qua"; }
  else if (/hom kia/.test(t)) { date = addDays(TODAY, -2); dateWord = "hôm kia"; }
  else {
    const dm = t.match(/ngay (\d{1,2})(?:[\/\-](\d{1,2}))?/);
    if (dm) {
      const day = String(dm[1]).padStart(2, "0");
      const mon = dm[2] ? String(dm[2]).padStart(2, "0") : (trip.startDate || TODAY).slice(5, 7);
      const cand = (trip.startDate || TODAY).slice(0, 4) + "-" + mon + "-" + day;
      if (!isNaN(Date.parse(cand))) { date = cand; dateWord = "ngày " + day + "/" + mon; }
    }
  }

  /* Chỉ nhận địa điểm ĐÃ có trong cơ sở dữ liệu hoặc do nhà cung cấp trả về —
     không tự bịa ra một cái tên rồi gán vào. */
  let place = null;
  const pool = S.db.places.concat(PROVIDER.places.filter(x => x.destId === trip.destId));
  for (const pl of pool) {
    const n = norm(pl.name), tail = n.split(" ").slice(-2).join(" ");
    if ((n.length > 5 && t.includes(n)) || (tail.length > 5 && t.includes(tail))) { place = pl; break; }
  }

  const parts = tripParts(trip.id);
  const me = parts.find(x => x.isMe) || parts[0];
  let paidBy = me ? me.id : null, payerWord = me ? me.name : null;
  for (const pt of parts) {
    const n = norm(pt.name), tail = n.split(" ").slice(-1)[0];
    if (new RegExp("(" + n + "|" + tail + ")\\s*(tra|thanh toan|ung|chi)").test(t)) { paidBy = pt.id; payerWord = pt.name; break; }
  }
  let shareWith = parts.map(x => x.id), shareWord = "chia đều cả nhóm";
  if (/rieng minh|mot minh|minh an thoi|chi minh/.test(t)) { shareWith = me ? [me.id] : shareWith; shareWord = "chỉ mình bạn"; }
  const pm = t.match(/(\d+)\s*nguoi/);
  if (pm && Number(pm[1]) < parts.length) { shareWith = parts.slice(0, Number(pm[1])).map(x => x.id); shareWord = "chia cho " + pm[1] + " người"; }

  const category = place && (place.category === "Nhà hàng" || place.category === "Quán cà phê") ? "FOOD" : guessCategory(t);
  let desc = text.trim().replace(/\s+/g, " ");
  if (desc.length > 90) desc = desc.slice(0, 88) + "…";
  return {
    minor, currency: trip.currency, category, date, dateWord, description: desc,
    placeId: place && place.id ? place.id : null, placeName: place ? place.name : null,
    placeXid: place && place.xid ? place.xid : null,
    paidBy, payerWord, shareWith, shareWord,
    confidence: (place ? 1 : 0) + (category !== "OTHER" ? 1 : 0) + 1
  };
}

/* Ước lượng một phương án: chi phí, quãng đường, số hoạt động ngoài trời gặp mưa.
   Tính bằng mã trên bản sao, không hỏi mô hình — QĐ-09. */
function simulatePlan(tripId, changes) {
  const days = tripDays(tripId).map(d0 => ({
    date: d0.date, dayNumber: d0.dayNumber,
    acts: dayActs(d0.id).map(a => Object.assign({}, a))
  }));
  /* Hoạt động đã xong hoặc đã bỏ vẫn tính vào chi phí và quãng đường — tiền đã tiêu,
     đường đã đi — nhưng KHÔNG nhận thay đổi. Xếp lại chuyện đã xảy ra là vô nghĩa. */
  const frozenIds = new Set(tripActs(tripId).filter(isFrozen).map(a => a.id));
  (changes || []).forEach(op => {
    if (op.activityId && frozenIds.has(op.activityId)) return;
    if (op.op === "REMOVE") days.forEach(d0 => { d0.acts = d0.acts.filter(a => a.id !== op.activityId); });
    else if (op.op === "ADD") {
      const d0 = days.find(x => x.dayNumber === op.dayNumber);
      if (d0) d0.acts.push({ id: -Math.random(), title: op.title, placeId: op.placeId || null, placeXid: op.placeXid || null, type: op.type, start: op.start, cost: op.cost || 0 });
    } else if (op.op === "UPDATE") days.forEach(d0 => d0.acts.forEach(a => { if (a.id === op.activityId) Object.assign(a, op.patch); }));
  });
  const w = weatherOf(tripId);
  const geo = a => a.placeId ? S.db.places.find(p => p.id === a.placeId) : (a.placeXid ? PROVIDER.places.find(p => p.xid === a.placeXid) : null);
  let estimated = 0, km = 0, rainExposed = 0, rainSource = null;
  days.forEach(d0 => {
    d0.acts.sort((a, b) => (a.start || "99:99").localeCompare(b.start || "99:99"));
    const wd = w.days.find(x => x.date === d0.date);
    d0.acts.forEach((a, i) => {
      estimated += a.cost || 0;
      const g = geo(a);
      if (g && wd && wd.precipitationProbability >= 0.6 && !g.indoor && a.type === "SIGHTSEEING") {
        rainExposed++; rainSource = rainSource === "CLIMATE_NORMAL" || wd.source === "CLIMATE_NORMAL" ? "CLIMATE_NORMAL" : wd.source;
      }
      if (i > 0) { const g0 = geo(d0.acts[i - 1]); if (g0 && g) km += haversine(g0, g); }
    });
  });
  return { estimated, km, minutes: travelMinutes(km), rainExposed, rainSource };
}

function buildScenario(trip, msg) {
  const m = norm(msg);
  const w = weatherOf(trip.id);
  const b = budgetOf(trip.id);
  const days = tripDays(trip.id);
  /* Khớp theo TỪ. "phương án" và "ăn" cùng bỏ dấu thành có chữ "an" — khớp chuỗi
     con thì câu hỏi về phương án lại rơi vào nhánh gợi ý quán ăn. */
  const has = k => new RegExp("(^|[^a-z0-9])" + k.trim().replace(/ /g, "\\s+") + "($|[^a-z0-9])").test(m);
  const isQuestion = /\?|co du|du khong|bao nhieu|con lai|the nao|nhu the nao|goi y|nen /.test(m);

  /* — Ghi chi tiêu bằng câu chữ — mô hình đọc câu, MÃ tính tiền, NGƯỜI DÙNG duyệt — */
  if (!isQuestion && /het|tieu|tra tien|da tra|minh tra|thanh toan|vua mua|mua |chi /.test(m)) {
    const ex = parseExpenseText(msg, trip);
    if (ex) {
      const parts = tripParts(trip.id);
      const payer = parts.find(x => x.id === ex.paidBy);
      return {
        tools: [["get_current_trip", 96], ["get_participants", 38], ["parse_expense", 61], ["search_places", 288], ["propose_expense", 54]],
        answer: "Tôi đọc câu của bạn ra thế này:\n"
          + "· Số tiền: " + money(ex.minor, ex.currency) + "\n"
          + "· Hạng mục: " + EXP_LABEL[ex.category] + "\n"
          + "· Ngày: " + ex.dateWord + " (" + fmtD(ex.date) + ")\n"
          + (ex.placeName ? "· Địa điểm: " + ex.placeName + "\n" : "")
          + (payer ? "· Người trả: " + payer.name + "\n" : "")
          + "· " + ex.shareWord + "\n\n"
          + (ex.placeName ? "" : "Tôi không nhận ra tên quán nào trong câu nên để trống địa điểm — thà trống còn hơn gán bừa.\n\n")
          + "Chưa ghi vào sổ đâu. Xem lại rồi bấm “Ghi vào sổ chi tiêu”, sai chỗ nào thì sửa ngay trên phiếu.",
        expense: ex
      };
    }
    if (/het|tieu|tra tien|thanh toan/.test(m)) return {
      tools: [["get_current_trip", 92], ["parse_expense", 47]],
      answer: "Tôi hiểu là bạn muốn ghi một khoản chi, nhưng không tìm ra con số nào trong câu. Viết kèm số tiền giúp tôi — kiểu “trưa nay ăn bún chả hết 120k” hay “taxi 250.000”. Tôi đọc được cả “1tr2”, “hai trăm rưỡi” lẫn “500.000 đ”."
    };
  }

  /* — Trễ lịch: MÃ tính ra trễ bao nhiêu, trợ lý chỉ dựng đề xuất dời giờ — */
  if (has("tre") || has("muon") || has("lech lich") || has("khong kip") || has("cham gio")) {
    const dr = scheduleDrift(trip.id, currentDayNumber(trip) || undefined);
    if (!dr) return {
      tools: [["get_current_trip", 97], ["get_itinerary", 118]],
      answer: "Hôm nay không nằm trong khoảng ngày của chuyến này nên không có gì để so. Bạn muốn xem lệch lịch của một ngày cụ thể thì nói rõ ngày mấy."
    };
    if (!dr.anchorActivityId) return {
      tools: [["get_current_trip", 94], ["get_itinerary", 126]],
      answer: "Ngày " + dr.dayNumber + " chưa có hoạt động nào được đánh dấu đã xong hay đang làm, nên tôi không có mốc nào để tính bạn đang trễ bao nhiêu.\n\nBấm “Bắt đầu” rồi “Xong” ở từng hoạt động trong tab Lịch trình, tôi sẽ đo được ngay."
    };
    if (dr.driftMinutes <= 5) return {
      tools: [["get_current_trip", 96], ["get_itinerary", 131], ["calculate_distance", 12]],
      answer: "Bạn đang bám sát lịch — lệch " + Math.abs(dr.driftMinutes) + " phút so với dự kiến ở “" + dr.anchorTitle + "”. Chưa cần đổi gì cả."
    };
    if (!dr.affected.length) return {
      tools: [["get_current_trip", 99], ["get_itinerary", 124]],
      answer: (dr.source === "NOW" ? "Bạn **đang** trễ " : "Bạn đã trễ ") + dr.driftMinutes + " phút tính từ “" + dr.anchorTitle + "”, nhưng ngày "
        + dr.dayNumber + " không còn hoạt động nào phía sau để dời. Trễ cũng không sao."
    };
    const acts = dayActs(dr.dayId);
    const changes = dr.affected.map(id => {
      const a2 = acts.find(x => x.id === id);
      return { op: "UPDATE", activityId: id, title: a2.title, note: "dời muộn " + dr.driftMinutes + " phút",
        patch: { start: shiftHM(a2.start, dr.driftMinutes), end: a2.end ? shiftHM(a2.end, dr.driftMinutes) : null } };
    });
    const last = acts.find(x => x.id === dr.affected[dr.affected.length - 1]);
    return {
      tools: [["get_current_trip", 98], ["get_itinerary", 129], ["calculate_distance", 15], ["get_weather", 288], ["propose_itinerary_changes", 84]],
      answer: (dr.source === "NOW"
        ? "Bạn đang trễ " + dr.driftMinutes + " phút tính tới lúc này — “" + dr.anchorTitle + "” lẽ ra xong lúc " + (acts.find(x => x.id === dr.anchorActivityId).end || "trước đó") + ", giờ vẫn đang làm."
        : "Bạn đã trễ " + dr.driftMinutes + " phút: “" + dr.anchorTitle + "” xong muộn hơn dự kiến.")
        + "\n\nCòn " + dr.affected.length + " hoạt động phía sau trong ngày " + dr.dayNumber + ". Tôi đề xuất dời cả " + dr.affected.length + " cái muộn lại đúng " + dr.driftMinutes
        + " phút, hoạt động cuối sẽ kết thúc lúc " + (last && last.end ? shiftHM(last.end, dr.driftMinutes) : "muộn hơn") + ".\n\n"
        + "Những hoạt động đã xong tôi không đụng tới. Lịch trình chưa đổi gì — bấm áp dụng thì mới đổi.",
      proposal: { summary: "Dời " + dr.affected.length + " hoạt động còn lại của ngày " + dr.dayNumber + " muộn " + dr.driftMinutes + " phút", changes, travelDelta: 0 }
    };
  }

  /* — Chạm trần vòng lặp: vẫn trả lời, KHÔNG báo lỗi — BR-502/503 — */
  if (has("lam lai") || has("len lich lai") || has("toan bo chuyen")) {
    return {
      tools: [["get_current_trip", 112], ["get_user_preferences", 64], ["get_itinerary", 143], ["get_weather", 298],
      ["search_places", 812], ["search_places", 640], ["calculate_distance", 21], ["calculate_trip_budget", 176]],
      ceiling: true,
      answer: "Tôi đã chạm trần 8 lượt gọi công cụ trong một lượt trả lời nên dừng lại và trả lời bằng dữ liệu đang có. Dựng lại toàn bộ lịch trình là việc lớn — bạn dùng nút “Sinh lịch trình bằng AI” ở tab Tổng quan sẽ hợp hơn, việc đó chạy nền và có thanh tiến trình. Còn ở đây tôi sửa từng ngày một thì chắc tay hơn: bạn muốn bắt đầu từ ngày nào?"
    };
  }

  /* — Phương án tối ưu: dựng nhiều phương án, đo bằng mã, người dùng chọn một —
       Mô hình chỉ quyết định CÓ NÊN tối ưu không và diễn giải kết quả; phần tính
       là Haversine + láng giềng gần nhất chạy trong Java/JS — QĐ-09. */
  if (has("toi uu") || has("rut ngan") || has("di chuyen") || has("sap xep") || has("phuong an") || has("hop ly") || has("lich trinh tot")) {
    const base = simulatePlan(trip.id, []);
    const opts = [];

    /* (a) Tránh mưa — chỉ dựa trên ngày có DỰ BÁO thật, không dựa trung bình khí hậu */
    const rainDays = w.days.filter(x => x.source === "FORECAST" && x.precipitationProbability >= 0.6);
    if (rainDays.length) {
      const ch = [];
      const indoor = PROVIDER.places.filter(x => x.destId === trip.destId && x.indoor && x.category !== "Nhà hàng");
      let k = 0;
      rainDays.forEach(rd => {
        const day = days.find(x => x.date === rd.date);
        if (!day) return;
        dayActs(day.id).forEach(a => {
          const pl = placeOf(a);
          if (!pl || pl.indoor || a.type !== "SIGHTSEEING" || isFrozen(a)) return;
          const alt = indoor[k++ % indoor.length];
          if (!alt) return;
          ch.push({ op: "REMOVE", activityId: a.id, title: a.title, time: a.start });
          ch.push({ op: "ADD", dayNumber: day.dayNumber, title: alt.name, placeXid: alt.xid, type: "SIGHTSEEING", start: a.start, end: a.end, cost: alt.fee * trip.travelers, notes: "Phương án trong nhà" });
        });
      });
      if (ch.length) opts.push({ title: "Tránh mưa", why: "Dự báo mưa ngày " + rainDays.map(x => fmtD(x.date)).join(", ") + " — đổi hoạt động ngoài trời sang chỗ trong nhà.", changes: ch });
    }

    /* (b) Ít di chuyển nhất — láng giềng gần nhất trên ngày đi lòng vòng nhất */
    let worst = null;
    days.forEach(day => {
      const acts = dayActs(day.id).filter(a => placeOf(a) && !isFrozen(a));
      if (acts.length < 3) return;
      let d0 = 0; for (let n = 1; n < acts.length; n++) d0 += haversine(placeOf(acts[n - 1]), placeOf(acts[n]));
      if (!worst || d0 > worst.km) worst = { day, acts, km: d0 };
    });
    if (worst) {
      const left = worst.acts.slice(1), order = [worst.acts[0]];
      while (left.length) {
        const cur = placeOf(order[order.length - 1]);
        let bi = 0, bd = Infinity;
        left.forEach((a, n) => { const dd = haversine(cur, placeOf(a)); if (dd < bd) { bd = dd; bi = n; } });
        order.push(left.splice(bi, 1)[0]);
      }
      const slots = worst.acts.map(a => ({ start: a.start, end: a.end }));
      const ch = order.map((a, n) => a.id === worst.acts[n].id ? null
        : { op: "UPDATE", activityId: a.id, title: a.title, patch: { start: slots[n].start, end: slots[n].end }, note: "chuyển sang khung " + slots[n].start }).filter(Boolean);
      if (ch.length) opts.push({ title: "Ít di chuyển nhất", why: "Ngày " + worst.day.dayNumber + " đang đi lòng vòng " + worst.km.toFixed(1).replace(".", ",") + " km — xếp lại theo láng giềng gần nhất.", changes: ch });
    }

    /* (c) Tiết kiệm nhất — đổi hoạt động đắt nhất lấy một chỗ rẻ hơn cùng loại */
    let pricey = null;
    days.forEach(day => dayActs(day.id).forEach(a => {
      if (a.type === "SIGHTSEEING" && !isFrozen(a) && (a.cost || 0) > 0 && (!pricey || a.cost > pricey.a.cost)) pricey = { a, day };
    }));
    if (pricey) {
      const alt = PROVIDER.places.filter(x => x.destId === trip.destId && x.fee * trip.travelers < pricey.a.cost && x.rating >= 4.1)
        .sort((x, y) => y.rating - x.rating)[0];
      if (alt) opts.push({
        title: "Tiết kiệm nhất",
        why: "“" + pricey.a.title + "” chiếm " + money(pricey.a.cost, trip.currency) + " — đổi sang " + alt.name + " (" + alt.rating + "★) rẻ hơn.",
        changes: [
          { op: "REMOVE", activityId: pricey.a.id, title: pricey.a.title, time: pricey.a.start },
          { op: "ADD", dayNumber: pricey.day.dayNumber, title: alt.name, placeXid: alt.xid, type: "SIGHTSEEING", start: pricey.a.start, end: pricey.a.end, cost: alt.fee * trip.travelers, notes: "Phương án tiết kiệm" }
        ]
      });
    }

    if (!opts.length) return {
      tools: [["get_itinerary", 121], ["get_weather", 240], ["calculate_distance", 14]],
      answer: "Tôi đo lại rồi: lịch trình hiện tại không có chỗ nào đáng đổi. Tổng quãng đường " + base.km.toFixed(1).replace(".", ",") + " km, ước tính " + money(base.estimated, trip.currency)
        + (base.rainExposed ? ", còn " + base.rainExposed + " hoạt động ngoài trời rơi vào ngày dự báo mưa nhưng tôi chưa tìm được chỗ thay tử tế." : ", không có hoạt động ngoài trời nào rơi vào ngày dự báo mưa.")
        + "\n\nThêm địa điểm vào lịch rồi hỏi lại thì tôi có nhiều thứ để xếp hơn."
    };
    opts.forEach(o => {
      o.metrics = simulatePlan(trip.id, o.changes);
      o.constraints = checkConstraints(trip.id, o.changes);   /* nói ra cái không thoả được */
    });
    return {
      tools: [["get_current_trip", 104], ["get_itinerary", 137], ["get_weather", 296], ["calculate_trip_budget", 172], ["search_places", 588], ["calculate_distance", 21], ["propose_itinerary_changes", 91]],
      answer: "Tôi dựng " + opts.length + " phương án cho " + trip.name + " rồi đo từng cái bằng mã — không phải ước lượng."
        + (function () {
          const bad = opts.map(o => (o.constraints || []).filter(c => !c.ok)).filter(v => v.length);
          if (!bad.length) return "";
          return "\n\nLưu ý: không phải phương án nào cũng giữ được ràng buộc bạn đặt. Cái nào phạm thì thẻ của nó ghi rõ — tôi không giấu để phương án trông đẹp hơn.";
        })()
        + "\n\n"
        + "Hiện tại: ước tính " + money(base.estimated, trip.currency) + " · " + base.km.toFixed(1).replace(".", ",") + " km di chuyển · "
        + base.rainExposed + " hoạt động ngoài trời rơi vào ngày dự báo mưa"
        + (trip.budget ? " · còn " + money(trip.budget - Math.max(base.estimated, b.actualTotal), trip.currency) + " so với ngân sách" : " · bạn chưa đặt ngân sách nên tôi không có mốc để so")
        + ".\n\nSo ba con số đó ở các thẻ bên dưới rồi chọn một. Chọn cái nào thì hai cái kia bỏ, lịch trình chỉ đổi sau khi bạn bấm.",
      options: opts, baseline: base
    };
  }

  /* — Thời tiết / đổi lịch vì mưa — */
  if (has("mua") || has("thoi tiet") || has("doi lich")) {
    const rainy = w.days.filter(x => x.source === "FORECAST" && x.precipitationProbability >= 0.6);
    const target = rainy.length ? days.find(dd => dd.date === rainy[0].date) : null;
    const outdoor = target ? dayActs(target.id).filter(a => { const p = placeOf(a); return p && !p.indoor && a.type === "SIGHTSEEING" && !isFrozen(a); }) : [];
    const indoorOpts = PROVIDER.places.filter(p => p.destId === trip.destId && p.indoor && p.category !== "Nhà hàng").slice(0, 3);

    if (!w.days.length && w.reason === "PAST_TRIP") return {
      tools: [["get_current_trip", 102], ["get_weather", 88]],
      answer: "Chuyến này đã kết thúc từ " + fmtD(trip.endDate) + " nên không có thời tiết để xem — dự báo cho quá khứ không có ý nghĩa gì. Tôi vẫn xem lại lịch trình và chi tiêu của chuyến giúp bạn được."
    };
    if (!w.days.length) return {
      tools: [["get_current_trip", 106], ["get_weather", 2410, "ERROR"]],
      answer: "Tôi không tra được thời tiết lúc này — dịch vụ dự báo không trả lời. Đây là “không tra được”, khác với “trời đẹp”: tôi không có số liệu nào để nói. Bạn thử lại sau ít phút, hoặc cứ hỏi tôi việc khác về chuyến đi."
    };
    if (!target || !outdoor.length) {
      const lines = w.days.map(x => "· " + fmtD(x.date) + " — " + (x.source === "FORECAST"
        ? "dự báo " + x.tempMax + "°C, khả năng mưa " + Math.round(x.precipitationProbability * 100) + "%"
        : "trung bình khí hậu nhiều năm cho tháng " + (d(x.date).getUTCMonth() + 1) + ": khoảng " + x.tempMax + "°C, hay mưa " + Math.round(x.precipitationProbability * 100) + "% số ngày")).join("\n");
      return {
        tools: [["get_current_trip", 109], ["get_weather", 318]],
        answer: "Thời tiết cho " + trip.name + ":\n" + lines + "\nTôi tách rõ hai loại: dòng ghi “dự báo” là số liệu dự báo thật; dòng ghi “trung bình khí hậu” là thống kê nhiều năm, không phải dự báo cho đúng ngày đó. Chưa thấy ngày nào mưa đủ nhiều để cần đổi lịch."
      };
    }
    const rm = outdoor[0], p0 = placeOf(rm);
    const add1 = indoorOpts[0], add2 = indoorOpts[1];
    const pct = Math.round(rainy[0].precipitationProbability * 100);
    const changes = [
      { op: "REMOVE", activityId: rm.id, title: rm.title, time: rm.start },
      { op: "ADD", dayNumber: target.dayNumber, title: add1.name, placeXid: add1.xid, type: "SIGHTSEEING", start: "14:30", end: "16:00", cost: add1.fee * trip.travelers, notes: "Trợ lý đề xuất — phương án trong nhà" },
      { op: "ADD", dayNumber: target.dayNumber, title: add2.name, placeXid: add2.xid, type: "SIGHTSEEING", start: "16:30", end: "17:30", cost: add2.fee * trip.travelers, notes: "Trợ lý đề xuất — phương án trong nhà" }
    ];
    return {
      tools: [["get_current_trip", 118], ["get_itinerary", 96], ["get_weather", 320], ["search_places", 430], ["calculate_distance", 85], ["propose_itinerary_changes", 88]],
      evidence: {
        question: "Chỗ trong nhà nào thay được “" + rm.title + "” vào ngày " + target.dayNumber + "?",
        considered: PROVIDER.places.filter(x => x.destId === trip.destId && x.category !== "Nhà hàng")
          .map(x => ({
            name: x.name, chosen: x.xid === add1.xid || x.xid === add2.xid,
            score: (x.indoor ? 2 : 0) + x.rating / 2,
            why: x.indoor ? "trong nhà, " + x.rating + "★" : "ngoài trời — loại vì đang tìm chỗ tránh mưa"
          })).sort((a2, b2) => b2.score - a2.score).slice(0, 8)
      },
      answer: "Dự báo ngày " + target.dayNumber + " (" + fmtD(target.date) + ") có khả năng mưa " + pct + "%. Đây là dự báo thật, không phải trung bình khí hậu.\n\n“" + rm.title + "” là hoạt động ngoài trời vào " + (rm.start || "chiều") + ", gặp mưa thì hỏng buổi. Tôi đề xuất thay bằng hai chỗ trong nhà gần đó: " + add1.name + " và " + add2.name + ". Cả hai đều lấy từ kết quả tìm kiếm, không phải tôi tự nghĩ ra.\n\nLịch trình của bạn chưa đổi gì cả. Xem thẻ bên dưới rồi bấm “Áp dụng thay đổi” nếu thấy được.",
      proposal: { summary: "Đổi hoạt động ngoài trời ngày " + target.dayNumber + " sang phương án trong nhà vì dự báo mưa " + pct + "%", changes, travelDelta: -18 }
    };
  }

  /* — Ngân sách — */
  if (has("ngan sach") || has("tien") || has("chi phi") || has("du khong") || has("bao nhieu")) {
    if (!trip.budget) return {
      tools: [["get_current_trip", 104], ["calculate_trip_budget", 168]],
      answer: "Chuyến này bạn chưa đặt ngân sách nên tôi không có mốc nào để so. Tổng ước tính từ các hoạt động hiện là " + money(b.estimatedTotal, trip.currency) + " — con số này do bạn nhập cho từng hoạt động, không phải giá thị trường. Bạn đặt ngân sách ở tab Ngân sách thì tôi cảnh báo được khi sắp vượt."
    };
    return {
      tools: [["get_current_trip", 111], ["get_itinerary", 132], ["calculate_trip_budget", 189]],
      answer: "Ngân sách " + money(trip.budget, trip.currency) + ".\n· Ước tính từ lịch trình: " + money(b.estimatedTotal, trip.currency) + "\n· Đã chi thực tế: " + money(b.actualTotal, trip.currency) + "\n· Còn lại: " + money(b.remaining, trip.currency) + "\n\nHai con số ước tính và thực tế là hai đại lượng tách rời, tôi không cộng chúng vào nhau. Ước tính là do bạn nhập cho từng hoạt động, không phải giá thị trường — tôi không biết giá thật hôm bạn đi." + (b.otherCurrencies.length ? "\n\nCó " + b.otherCurrencies.length + " khoản ghi bằng tiền tệ khác (" + b.otherCurrencies.map(o => money(o.actualTotal, o.currency)).join(", ") + "). Tôi để riêng, không quy đổi." : "")
    };
  }

  /* — Gợi ý địa điểm: hỏi NHÀ CUNG CẤP, chấm điểm bằng mã, người dùng chọn thì mới lưu — */
  if (has("an") || has("quan") || has("nha hang") || has("ca phe") || has("choi") || has("dia diem") || has("goi y") || has("o dau") || has("cho nao")) {
    if (S.flags.placesDown) return {
      tools: [["get_current_trip", 98], ["search_places", 5000, "TIMEOUT"]],
      answer: "Tôi không tra được địa điểm lúc này — nhà cung cấp quá hạn chờ. Tôi không đoán bừa tên quán cho bạn được: nói tên một chỗ không có thật thì tệ hơn là nói thẳng rằng tôi chưa tra được. Thử lại sau nhé."
    };
    const wantFood = has("an") || has("quan") || has("nha hang") || has("ca phe") || has("do uong");
    const isFood = x => x.category === "Nhà hàng" || x.category === "Quán cà phê";
    const dest = S.db.destinations.find(x => x.id === trip.destId);
    const rainy = w.days.some(x => x.source === "FORECAST" && x.precipitationProbability >= 0.6);
    const target = { BUDGET: 1, MODERATE: 2, LUXURY: 3 }[trip.budgetPreference] || 2;
    const pool = PROVIDER.places.filter(x => x.destId === trip.destId && (wantFood ? isFood(x) : !isFood(x)));
    if (!pool.length) return {
      tools: [["get_current_trip", 101], ["search_places", 402]],
      answer: "Nhà cung cấp trả lời bình thường nhưng không có chỗ nào quanh " + (dest ? dest.name : "điểm đến") + " khớp yêu cầu này. Đây là “không có kết quả”, khác với “tra không được”. Bạn thử mô tả khác xem sao."
    };
    const scored = pool.map(x => {
      const km = dest ? haversine(dest, x) : 0;
      const score = x.rating * 2 - km * 0.12 - Math.abs(x.price - target) * 0.6 + (rainy && x.indoor ? 1.4 : 0) + Math.min(x.reviews / 8000, 1);
      const why = rainy && x.indoor ? "trong nhà, hợp ngày dự báo mưa"
        : km < 2 ? "gần trung tâm, chỉ " + km.toFixed(1).replace(".", ",") + " km"
          : x.rating >= 4.4 ? "điểm đánh giá cao: " + x.rating + "★ trên " + x.reviews.toLocaleString("vi-VN") + " lượt"
            : x.price <= target ? "vừa mức chi " + BUDGET_LABEL[trip.budgetPreference || "MODERATE"].toLowerCase() : "cân đối giữa giá và đánh giá";
      return { xid: x.xid, score, why, km };
    }).sort((a, b) => b.score - a.score).slice(0, 4);
    const inDb = scored.filter(c => S.db.places.some(pp => pp.externalId === c.xid)).length;
    return {
      tools: [["get_current_trip", 101], ["get_user_preferences", 47], ["get_saved_places", 52], ["search_places", 640], ["calculate_distance", 18], ["rank_candidates", 9], ["propose_places", 44]],
      answer: "Tôi hỏi " + PROVIDER.name + " rồi chấm điểm " + pool.length + " chỗ theo đánh giá, khoảng cách tới trung tâm, mức chi bạn đặt"
        + (rainy ? " và có mưa trong dự báo hay không" : "") + ". Bốn chỗ đứng đầu ở thẻ bên dưới.\n\n"
        + (inDb ? inDb + " trong số này đã có trong dữ liệu của bạn. " : "")
        + "Những chỗ còn lại chưa được lưu ở đâu cả — chúng chỉ là kết quả tra cứu. Bạn bấm chọn thì tôi mới ghi vào cơ sở dữ liệu; không chọn thì lát nữa bộ đệm hết hạn là mất.",
      candidates: scored
    };
  }

  /* — Mặc định — */
  const nAct = tripActs(trip.id).length, emptyDays = days.filter(x => !dayActs(x.id).length);
  return {
    tools: [["get_current_trip", 108], ["get_itinerary", 137]],
    answer: trip.name + " — " + fmtD(trip.startDate) + " đến " + fmtD(trip.endDate) + ", " + days.length + " ngày, " + trip.travelers + " người. Hiện có " + nAct + " hoạt động"
      + (emptyDays.length ? ", còn " + emptyDays.length + " ngày chưa có gì (ngày " + emptyDays.map(x => x.dayNumber).join(", ") + ")" : "") + ".\n\nBạn hỏi tôi được: thời tiết từng ngày, gợi ý chỗ ăn chơi, ngân sách còn bao nhiêu, hay bảo tôi đổi lịch khi trời mưa. Muốn đổi gì trong lịch trình thì tôi dựng đề xuất để bạn duyệt, chứ tôi không tự sửa."
  };
}

const AI = {
  async chat(tripId, message, h) {
    /* Kiểm sở hữu và giới hạn tần suất TRƯỚC khi mở luồng — BR-101, BR-601 */
    const trip = ownTrip(tripId);
    if (S.flags.aiRateLimited) { const e = new ApiError(429, "RATE_LIMITED", "Bạn đã hỏi khá nhiều rồi. Thử lại sau 12 phút."); e.retryAfterSeconds = 720; throw e; }
    await sleep(220);

    let conv = S.db.conversations.find(c => c.tripId === trip.id);
    if (!conv) { conv = { id: nextId("conversations"), userId: trip.userId, tripId: trip.id, title: message.slice(0, 40), createdAt: nowISO(), updatedAt: nowISO() }; S.db.conversations.push(conv); }
    S.db.messages.push({ id: nextId("messages"), convId: conv.id, role: "USER", content: message, at: nowISO() });

    const sc = buildScenario(trip, message);
    const toolLog = [], turnLogIds = [];

    for (const [tool, ms, st] of sc.tools) {
      const status = st || "OK";
      h.onToolStart({ tool, label: TOOL_LABEL[tool] || tool });
      await sleep(Math.min(ms, 900) * (S.flags.slowNet ? 1.8 : 0.55) + 90);
      if (S.flags.aiDown) {
        logTool(tool, {}, "ERROR", ms, null, "MODEL_PROVIDER_UNAVAILABLE", trip.id, conv.id);
        h.onToolEnd({ tool, ms, status: "ERROR" });
        h.onError({ code: "UPSTREAM_UNAVAILABLE", message: "Trợ lý tạm thời không dùng được — nhà cung cấp mô hình không trả lời. Các tab khác của chuyến đi vẫn dùng bình thường." });
        return;
      }
      const logId = logTool(tool, {}, status, ms, status === "OK" ? { ok: true } : null, status === "OK" ? null : (status === "TIMEOUT" ? "Quá hạn chờ 5000 ms" : "PROVIDER_UNAVAILABLE"), trip.id, conv.id);
      turnLogIds.push(logId);
      toolLog.push({ tool, ms, status });
      h.onToolEnd({ tool, ms, status });
    }

    /* Phát câu trả lời dần theo từng phần */
    const parts = sc.answer.split(/(\s+)/);
    for (let i = 0; i < parts.length; i++) { h.onToken(parts[i]); if (i % 3 === 0) await sleep(S.flags.slowNet ? 34 : 14); }

    const msg = {
      id: nextId("messages"), convId: conv.id, role: "ASSISTANT", content: sc.answer, at: nowISO(),
      tools: toolLog, ceiling: !!sc.ceiling, candidates: sc.candidates || null
    };
    S.db.messages.push(msg);
    if (sc.candidates) h.onCandidates(msg);

    const expiry = () => new Date(Date.now() + (S.flags.proposalExpired ? -60000 : 15 * 60000)).toISOString();

    /* Phiếu chi tiêu — vẫn là một đề xuất, vẫn phải người dùng bấm mới ghi */
    if (sc.expense) {
      const ep = {
        id: nextId("proposals"), kind: "EXPENSE", tripId: trip.id, convId: conv.id, messageId: msg.id,
        summary: "Ghi " + money(sc.expense.minor, sc.expense.currency) + " vào hạng mục " + EXP_LABEL[sc.expense.category],
        expense: sc.expense, changes: [], costDelta: 0, travelDelta: 0,
        status: "PENDING", createdAt: nowISO(), expiresAt: expiry(), skipped: null
      };
      S.db.proposals.push(ep); h.onProposal(ep);
    }

    /* Nhiều phương án cùng một nhóm — chọn một, các phương án còn lại tự bỏ */
    if (sc.options) {
      const group = "opt-" + Math.random().toString(36).slice(2, 8);
      sc.options.forEach(o => {
        const costDelta = o.metrics.estimated - sc.baseline.estimated;
        const op = {
          id: nextId("proposals"), kind: "ITINERARY", tripId: trip.id, convId: conv.id, messageId: msg.id,
          optionOf: group, optionTitle: o.title, metrics: o.metrics, baseline: sc.baseline,
          evidence: { question: "Phương án “" + o.title + "” được dựng thế nào?", considered: [], toolExecutionIds: turnLogIds.slice() },
          summary: o.why, changes: o.changes, costDelta, constraints: o.constraints,
          travelDelta: o.metrics.minutes - sc.baseline.minutes,
          status: "PENDING", createdAt: nowISO(), expiresAt: expiry(), skipped: null
        };
        S.db.proposals.push(op); h.onProposal(op);
      });
    }

    let proposal = null;
    if (sc.proposal) {
      const costDelta = sc.proposal.changes.reduce((s, op) => {
        if (op.op === "ADD") return s + (op.cost || 0);
        if (op.op === "REMOVE") { const a = S.db.activities.find(x => x.id === op.activityId); return s - ((a && a.cost) || 0); }
        return s;
      }, 0);
      proposal = {
        id: nextId("proposals"), kind: "ITINERARY", tripId: trip.id, convId: conv.id, messageId: msg.id,
        summary: sc.proposal.summary, changes: sc.proposal.changes, costDelta, travelDelta: sc.proposal.travelDelta,
        evidence: sc.evidence ? Object.assign({}, sc.evidence, { toolExecutionIds: turnLogIds.slice() }) : { toolExecutionIds: turnLogIds.slice() },
        status: "PENDING", createdAt: nowISO(), expiresAt: expiry(), skipped: null
      };
      S.db.proposals.push(proposal);
      h.onProposal(proposal);
    }
    conv.updatedAt = nowISO(); save();
    h.onDone({ messageId: msg.id, conversationId: conv.id, ceiling: !!sc.ceiling });
  },

  /* Sinh lịch trình chạy nền, 30–90 giây thật → ở demo rút còn ~9 giây — ADS-30 §9.3 */
  generate(tripId) {
    const trip = ownTrip(tripId);
    const jobId = "job-" + Math.random().toString(36).slice(2, 9);
    const job = { id: jobId, tripId: trip.id, state: "RUNNING", step: "Đang đọc chuyến đi và sở thích…", progress: 0.05, result: null };
    S.jobs[jobId] = job;
    const steps = [
      [900, 0.15, "Đang đọc chuyến đi và sở thích…", "get_current_trip", 112],
      [1100, 0.3, "Đang tìm địa điểm quanh điểm đến…", "search_places", 812],
      [1300, 0.45, "Đang tìm quán ăn và chỗ nghỉ…", "search_places", 764],
      [1500, 0.6, "Đang dựng bản nháp lịch trình…", null, 0],
      [1200, 0.78, "Đang đối chiếu địa điểm với kết quả tìm kiếm…", null, 0],
      [1400, 0.92, "Đang xếp thứ tự trong ngày (láng giềng gần nhất + 2-opt)…", "calculate_distance", 24],
      [900, 1, "Xong", "propose_itinerary_changes", 96]
    ];
    let i = 0;
    const tick = () => {
      if (i >= steps.length) return;
      const [ms, pr, label, tool, tms] = steps[i++];
      setTimeout(() => {
        job.progress = pr; job.step = label;
        if (tool) logTool(tool, {}, "OK", tms, { ok: true }, null, trip.id, null);
        if (pr === 1) { job.result = fillItinerary(trip); job.state = "SUCCEEDED"; save(); }
        else tick();
      }, ms);
    };
    tick();
    return jobId;
  },
  job(id) { return S.jobs[id] || null; }
};

/* Đối chiếu địa điểm: tên nào không có trong kết quả tìm kiếm thì LOẠI — BR-509 */
function fillItinerary(trip) {
  /* Lấy từ NHÀ CUNG CẤP, không phải từ cơ sở dữ liệu — CSDL có thể đang trống trơn.
     Chỉ những chỗ thật sự vào lịch trình mới được ghi xuống, và chỉ vì người dùng
     đã bấm "Sinh lịch trình". */
  const pool = PROVIDER.places.filter(p => p.destId === trip.destId).map(x => api.adoptPlace(x.xid, "AI_GENERATE"));
  const sights = pool.filter(p => p.category !== "Nhà hàng" && p.category !== "Quán cà phê");
  const foods = pool.filter(p => p.category === "Nhà hàng" || p.category === "Quán cà phê");
  const invented = ["Nhà hàng Sen Vàng " + (S.db.destinations.find(x => x.id === trip.destId) || {}).name, "Quán cà phê Mây Ngàn"];
  const days = tripDays(trip.id);
  let si = 0, fi = 0, added = 0;
  days.forEach((day, di) => {
    if (dayActs(day.id).length) return;
    const plan = [];
    if (di === 0) plan.push({ title: "Di chuyển tới " + (S.db.destinations.find(x => x.id === trip.destId) || {}).name, type: "TRANSPORT", start: "08:00", end: "11:00", cost: null, place: null });
    const s1 = sights[si++ % Math.max(sights.length, 1)];
    if (s1) plan.push({ title: s1.name, type: "SIGHTSEEING", start: "09:30", end: "11:30", cost: s1.fee * trip.travelers, place: s1 });
    const f1 = foods[fi++ % Math.max(foods.length, 1)];
    if (f1) plan.push({ title: "Ăn trưa — " + f1.name, type: "FOOD", start: "12:00", end: "13:00", cost: f1.fee * trip.travelers, place: f1 });
    const s2 = sights[si++ % Math.max(sights.length, 1)];
    if (s2 && s2 !== s1) plan.push({ title: s2.name, type: "SIGHTSEEING", start: "14:30", end: "16:30", cost: s2.fee * trip.travelers, place: s2 });
    if (di === days.length - 1) plan.push({ title: "Trả phòng và về", type: "TRANSPORT", start: "16:00", end: "18:00", cost: null, place: null });
    else plan.push({ title: "Ăn tối và nghỉ", type: "FOOD", start: "19:00", end: "20:30", cost: 300000, place: null });
    plan.forEach((p, k) => {
      S.db.activities.push({
        id: nextId("activities"), dayId: day.id, title: p.title, placeId: p.place ? p.place.id : null,
        type: p.type, createdBy: "AI", start: p.start, end: p.end, cost: p.cost, notes: null, order: k
      });
      added++;
    });
    sortDayByTime(day.id);
  });
  save();
  return {
    added, days: days.length, adopted: pool.length,
    rejected: invented.map(n => ({ name: n, reason: "Không khớp kết quả search_places" }))
  };
}

<script>
"use strict";

const MARK = '<svg class="mk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4 10.4 10.4 8.4 15.6 13.6 13.6Z" fill="currentColor" stroke-linejoin="round"/></svg>';

function toast(msg, kind) {
  const n = document.createElement("div");
  n.className = "toast" + (kind ? " " + kind : "");
  n.textContent = msg;
  $("#toasts").appendChild(n);
  setTimeout(() => { n.style.transition = "opacity .3s"; n.style.opacity = "0"; setTimeout(() => n.remove(), 320); }, kind === "bad" ? 5200 : 3200);
}
function handle(err) {
  if (!(err instanceof ApiError)) { console.error(err); toast("Có lỗi không lường trước. Thử lại giúp tôi.", "bad"); return; }
  if (err.http === 401) { toast(err.message, "bad"); if (err.code === "UNAUTHENTICATED") nav("#/login"); return; }
  toast(err.message, err.http >= 500 || err.http === 429 ? "bad" : "warn");
}

let modalCleanup = null;

  closeModal();
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = '<div class="box" role="dialog" aria-modal="true"><header><h3 style="font-size:16px">' + esc(opts.title) + '</h3>'

  wrap.addEventListener("mousedown", e => { if (e.target === wrap) closeModal(); });

  const f = wrap.querySelector("input,select,textarea,button.p"); if (f) f.focus();
  return wrap;
}

function render() {
  revokeUrls();          /* render() thay innerHTML toàn bộ — không thu hồi là rò bộ nhớ */
  const p = path();
  const r = ROUTES.find(x => x.p.test(p));
  if (!r) { nav(S.session ? "#/app" : "#/"); return; }
  const m = p.match(r.p);
  if (!r.pub && !S.session) { nav("#/login"); return; }
  if (r.admin && (!S.session || S.session.role !== "ADMIN")) { toast("Trang này chỉ dành cho quản trị", "bad"); nav(S.session ? "#/app" : "#/login"); return; }
  document.body.classList.toggle("admin", !!r.admin);
  if (drawerOpen && !/^\/app\/trips\/\d+/.test(p)) closeDrawer();
  r.v(m);
  window.scrollTo(0, 0);
  Tour.sync();
}

/* ── Vỏ ứng dụng ───────────────────────────────────────────────────────────── */
function topbar(kind) {
  const u = S.session ? S.db.users.find(x => x.id === S.session.userId) : null;
  let right = "";
  if (!u) right = '<a class="btn s" href="#/login">Đăng nhập</a><a class="btn s p" href="#/register">Đăng ký</a>';
  else if (u.role === "ADMIN") right =
    '<a class="btn g s" href="#/admin/users">Người dùng</a><a class="btn g s" href="#/admin/trips">Chuyến đi</a>'
    + '<a class="btn g s" href="#/admin/tool-executions">Nhật ký công cụ</a><a class="btn g s" href="#/admin/ai-usage">Thống kê AI</a>'
    + '<span class="chip w">Quản trị</span><button class="btn s" data-act="logout">Thoát</button>';
  else right =
    '<a class="btn g s" href="#/app">Chuyến đi</a><a class="btn g s" href="#/app/saved">Đã lưu</a>'
    + '<a class="btn g s" href="#/app/profile">' + esc(u.name.split(" ").slice(-1)[0]) + "</a>"
    + '<button class="btn s" data-act="logout">Thoát</button>';
  return '<header class="topbar"><a class="brand" href="' + (u ? (u.role === "ADMIN" ? "#/admin/users" : "#/app") : "#/") + '">' + MARK + "TripMind</a>"
    + '<div style="flex:1"></div><nav class="row" style="gap:2px;flex-wrap:wrap;justify-content:flex-end">' + right + "</nav></header>";
}
function shell(inner, sub) {
  $("#app").innerHTML = topbar() + (sub || "") + '<main id="view">' + inner + "</main>";
}
function skeletonBlock(n) { let s = ""; for (let i = 0; i < (n || 3); i++) s += '<div class="sk" style="width:' + (60 + (i * 13) % 35) + '%"></div>'; return '<div class="stack s">' + s + "</div>"; }

/* ── Hành động chung ───────────────────────────────────────────────────────── */
const actions = {
  "modal-close": closeModal,
  logout() { api.logout(); toast("Đã đăng xuất"); nav("#/"); },
  "tour-toggle"() { $(".tour").classList.toggle("min"); },
  "tour-next"() { Tour.next(); },
  "tour-goto"(el) { Tour.go(Number(el.dataset.i)); },
  "tour-reset"() { if (confirm("Đặt lại toàn bộ dữ liệu demo về trạng thái ban đầu?")) { resetAll(); Tour.i = 0; Tour.save(); nav("#/"); toast("Đã đặt lại dữ liệu demo"); } },
  "demo-panel"() { openDemoPanel(); }
};
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (/^(SELECT|INPUT|TEXTAREA|OPTION)$/.test(t.tagName)) return;   // để control tự xử lý
  const fn = actions[t.dataset.act];
  if (fn) { e.preventDefault(); fn(t, e); }
});
document.addEventListener("submit", e => {
  e.preventDefault();                       // không form nào trong demo được nạp lại trang
  const f = e.target.closest("form[data-act]");
  if (!f) return;
  const fn = actions[f.dataset.act];
  if (fn) fn(f, e);
});

actions["auth-submit"] = async function (form) {
  const btn = $("button[type=submit]", form), errBox = $("#auth-err", form);
  const fd = new FormData(form);
  btn.disabled = true; btn.textContent = "Đang xử lý…"; errBox.innerHTML = "";
  try {
    const reg = path() === "/register";
    const r = reg
      ? await api.register(fd.get("name"), fd.get("email"), fd.get("password"))
      : await api.login(fd.get("email"), fd.get("password"));
    toast("Chào " + r.user.name.split(" ").slice(-1)[0] + "!");
    nav(r.user.role === "ADMIN" ? "#/admin/users" : "#/app");
  } catch (e) {
    errBox.innerHTML = '<div class="err-txt"><span>⚠</span><span>' + esc(e.message) + "</span></div>";
    btn.disabled = false; btn.textContent = path() === "/register" ? "Tạo tài khoản" : "Đăng nhập";
  }
};
