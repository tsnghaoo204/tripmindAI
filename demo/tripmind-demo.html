<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TripMind — bản demo giao diện chạy được, dữ liệu giả lập trong trình duyệt.">
<title>TripMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* ─────────────────────────────────────────────────────────────
   TripMind — tokens
   Nguyên tắc màu: teal = hệ thống, cát = cảnh báo, gạch = nghiêm trọng,
   chàm = dữ liệu "thực tế" trong biểu đồ. Nền quản trị ngả cát để
   nhánh quản trị nhìn ra ngay là khác nhánh người dùng (ADS-40 §A.1).
   ───────────────────────────────────────────────────────────── */
:root{
  --paper:#f0f3f0; --surface:#fff; --surface-2:#e9ede9; --surface-3:#f7f9f7;
  --ink:#0f1c1a; --ink-2:#394a45; --muted:#6b7a74; --faint:#93a09a;
  --line:#d7ded9; --line-2:#bcc7c1;
  --teal:#0d6e5f; --teal-2:#0a5749; --teal-soft:#dcece7; --teal-line:#a9cfc4;
  --sand:#b0602f; --sand-soft:#f8eadd; --sand-line:#e2b891;
  --brick:#9d3a2b; --brick-soft:#f9e3df; --brick-line:#e6b0a6;
  --admin-paper:#f6efe6; --admin-line:#e0d2c1;
  --console:#0f1f1c; --console-2:#16302b; --console-line:#27473f; --console-ink:#dcece7; --console-muted:#8fada4;
  --s1:#0f8a72; --s2:#4a55a8;           /* biểu đồ: ước tính · thực tế */
  --grid:#e4e9e5;
  --focus:#0d6e5f;
  --shadow:0 1px 2px rgba(15,28,26,.06), 0 8px 24px -12px rgba(15,28,26,.18);
  --shadow-lg:0 24px 60px -20px rgba(15,28,26,.35);
  --r:10px; --r-s:7px;
  --f-ui:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-dp:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mo:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0c1614; --surface:#132220; --surface-2:#1b2d29; --surface-3:#0f1c1a;
  --ink:#e6efeb; --ink-2:#bccdc7; --muted:#8ba39c; --faint:#6b8079;
  --line:#263b36; --line-2:#33504a;
  --teal:#4ec3ac; --teal-2:#7bd8c4; --teal-soft:#12312b; --teal-line:#255249;
  --sand:#dd9459; --sand-soft:#33241a; --sand-line:#5c412c;
  --brick:#e58573; --brick-soft:#331d19; --brick-line:#5e332b;
  --admin-paper:#171310; --admin-line:#33291f;
  --console:#08120f; --console-2:#0f1f1c; --console-line:#1f3b34;
  --s1:#2ea88e; --s2:#7f8ede;
  --grid:#26403a;
  --focus:#4ec3ac;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.75);
}}
:root[data-theme="dark"]{
  --paper:#0c1614; --surface:#132220; --surface-2:#1b2d29; --surface-3:#0f1c1a;
  --ink:#e6efeb; --ink-2:#bccdc7; --muted:#8ba39c; --faint:#6b8079;
  --line:#263b36; --line-2:#33504a;
  --teal:#4ec3ac; --teal-2:#7bd8c4; --teal-soft:#12312b; --teal-line:#255249;
  --sand:#dd9459; --sand-soft:#33241a; --sand-line:#5c412c;
  --brick:#e58573; --brick-soft:#331d19; --brick-line:#5e332b;
  --admin-paper:#171310; --admin-line:#33291f;
  --console:#08120f; --console-2:#0f1f1c; --console-line:#1f3b34;
  --s1:#2ea88e; --s2:#7f8ede;
  --grid:#26403a;
  --focus:#4ec3ac;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
table{border-collapse:collapse;font:inherit;color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal);text-underline-offset:3px}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ── type roles ── */
.dp{font-family:var(--f-dp);font-weight:500;letter-spacing:-.015em;line-height:1.15}
.mo{font-family:var(--f-mo);font-variant-ligatures:none}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:13.5px}
.tiny{font-size:12px;color:var(--muted);line-height:1.45}

/* ── controls ── */
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:var(--r-s);font-size:14px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s,transform .06s;white-space:nowrap}
.btn{text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.p{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.p,:root:not([data-theme="light"]) .btn.p{color:#06201b}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn.p{color:#fff}}
.btn.p:hover{background:var(--teal-2);border-color:var(--teal-2)}
.btn.d{border-color:var(--brick-line);color:var(--brick);background:var(--brick-soft)}
.btn.s{padding:5px 10px;font-size:13px}
.btn.g{background:transparent;border-color:transparent;color:var(--muted)}
.btn.g:hover{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.icb{border:1px solid var(--line);background:var(--surface);width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);font-size:13px;padding:0}
.icb:hover{background:var(--surface-2);color:var(--ink)}

.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:13px;font-weight:600;color:var(--ink-2)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);font-size:14.5px}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 18%,transparent)}
.inp::placeholder{color:var(--faint)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
.err-txt{color:var(--brick);font-size:12.5px;display:flex;gap:5px;align-items:flex-start}

/* ── surfaces ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.plain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rule{height:1px;background:var(--line);border:0;margin:0}
.grid{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center}
.row.wr,.spread.wr{flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.s{gap:8px}

/* ── chips / badges ── */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:100px;font-size:11.5px;font-weight:600;
  border:1px solid var(--line-2);color:var(--muted);background:var(--surface);letter-spacing:.01em;white-space:nowrap}
.chip.t{background:var(--teal-soft);border-color:var(--teal-line);color:var(--teal)}
.chip.w{background:var(--sand-soft);border-color:var(--sand-line);color:var(--sand)}
.chip.c{background:var(--brick-soft);border-color:var(--brick-line);color:var(--brick)}
.chip.ai{border-style:dashed;border-color:var(--teal-line);color:var(--teal);background:transparent}

/* ── "nói thật": nhãn nguồn dữ liệu (ADS-40 phần F) ── */
.src{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.src.fc{color:var(--teal)}
.src.cn{color:var(--muted)}
.hedge{color:var(--muted);font-size:12.5px;border-bottom:1px dotted var(--line-2);padding-bottom:1px}
.est{border-bottom:1px dotted var(--line-2);cursor:help}

/* ── trạng thái rỗng: rỗng KHÁC bằng không ── */
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:18px;background:var(--surface-3);
  display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.empty p{color:var(--muted);font-size:13.5px;max-width:52ch}
.empty strong{color:var(--ink-2);font-weight:600}

/* ── khung xương ── */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);background-size:280% 100%;
  animation:shim 1.3s linear infinite;border-radius:6px;height:13px}
@keyframes shim{to{background-position:-280% 0}}

/* ── vỏ ứng dụng ── */
#app{min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:0 20px;height:56px;display:flex;align-items:center;gap:14px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-dp);font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand .mk{width:22px;height:22px;flex:0 0 auto}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:26px 20px 90px}
.wrap.narrow{max-width:760px}
.wrap.wide{max-width:1320px}
main{flex:1 1 auto}

/* ── tab không gian chuyến đi ── */
.tripbar{border-bottom:1px solid var(--line);background:var(--surface-3)}
.tripbar .in{max-width:1320px;margin:0 auto;padding:14px 20px 0}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{text-decoration:none;padding:8px 13px;border-radius:7px 7px 0 0;font-size:13.5px;font-weight:500;color:var(--muted);text-decoration:none;
  border:1px solid transparent;border-bottom:none;white-space:nowrap;position:relative;top:1px}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab.on{background:var(--paper);border-color:var(--line);color:var(--ink);font-weight:600}

/* ── bảng ── */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{width:100%;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-3);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tbody tr:hover{background:var(--surface-3)}

/* ── ngăn kéo trợ lý (mặt "bảng điều khiển" tối) ── */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.42);z-index:60;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--console);color:var(--console-ink);
  z-index:61;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .22s cubic-bezier(.2,.7,.3,1)}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
.drawer .dh{padding:14px 16px;border-bottom:1px solid var(--console-line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.drawer .db{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.drawer .db>*,.console-panel .db>*{flex:0 0 auto}
.drawer .df{border-top:1px solid var(--console-line);padding:12px 14px;background:var(--console-2)}
.drawer .icb{background:transparent;border-color:var(--console-line);color:var(--console-muted)}
.drawer .icb:hover{background:var(--console-2);color:var(--console-ink)}
.msg{max-width:92%;font-size:14px;line-height:1.6}
.msg.u{align-self:flex-end;background:var(--console-2);border:1px solid var(--console-line);border-radius:12px 12px 3px 12px;padding:9px 12px}
.msg.a{align-self:flex-start}
.msg.a .who{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--console-muted);font-weight:600;margin-bottom:4px}
.toolstrip{border-left:2px solid var(--console-line);padding-left:11px;display:flex;flex-direction:column;gap:3px;align-self:stretch}
.tl{display:flex;align-items:center;gap:8px;font-family:var(--f-mo);font-size:11.5px;color:var(--console-muted)}
.tl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .ms{font-variant-numeric:tabular-nums}
.tl.ok .ic{color:#4ec3ac}
.tl.run .ic{color:var(--console-muted);animation:pulse 1s ease-in-out infinite}
.tl.bad .ic{color:#e58573}
.tl.bad{color:#e58573}
@keyframes pulse{50%{opacity:.3}}
.ai-input{display:flex;gap:8px;align-items:flex-end}
.ai-input textarea{flex:1;background:var(--console);border:1px solid var(--console-line);color:var(--console-ink);
  border-radius:8px;padding:9px 11px;resize:none;font-size:14px;min-height:40px;max-height:120px}
.ai-input textarea::placeholder{color:var(--console-muted)}
.ai-input textarea:focus{outline:none;border-color:#4ec3ac}
.caret::after{content:"▋";color:#4ec3ac;animation:pulse .9s steps(1) infinite;margin-left:1px}

/* ── thẻ đề xuất ── */
.prop{border:1px solid var(--console-line);border-radius:10px;background:var(--console-2);overflow:hidden;align-self:stretch}
.prop .ph{padding:10px 13px;border-bottom:1px solid var(--console-line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.prop .ph .t{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:#4ec3ac}
.prop .pb{padding:12px 13px;display:flex;flex-direction:column;gap:10px}
.op{display:flex;gap:9px;align-items:baseline;font-size:13.5px}
.op .sg{font-family:var(--f-mo);font-weight:700;width:12px;flex:0 0 auto;text-align:center}
.op.add .sg{color:#4ec3ac}
.op.rm .sg{color:#e58573}
.op.rm .txt{text-decoration:line-through;text-decoration-color:var(--console-muted);color:var(--console-muted)}
.op .tm{font-family:var(--f-mo);font-size:12px;color:var(--console-muted);margin-left:auto;white-space:nowrap}
.deltas{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:12.5px;padding-top:9px;border-top:1px dashed var(--console-line)}
.deltas dt{color:var(--console-muted)}
.deltas dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mo)}
.notice{background:rgba(78,195,172,.09);border:1px solid var(--console-line);border-radius:7px;padding:8px 10px;font-size:12.5px;color:var(--console-muted);line-height:1.5}

/* ── dòng thời gian lịch trình ── */
.day{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.day>header{padding:12px 16px;background:var(--surface-3);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.acts{list-style:none;margin:0;padding:0}
.act{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:start;background:var(--surface)}
.act:last-child{border-bottom:none}
.act.drag-over{box-shadow:inset 0 2px 0 var(--teal)}
.act.dragging{opacity:.4}
.act .tm{font-family:var(--f-mo);font-size:12.5px;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}
.act .ti{font-weight:600;font-size:14.5px;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.act .mt{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.act .ctrls{display:flex;gap:4px;opacity:0;transition:opacity .12s}
.act:hover .ctrls,.act:focus-within .ctrls{opacity:1}
.hop{display:flex;align-items:center;gap:7px;padding:3px 16px 3px 92px;font-size:12px;color:var(--faint);font-family:var(--f-mo);background:var(--surface-3);border-bottom:1px solid var(--line)}
.grip{cursor:grab;color:var(--faint);user-select:none;font-size:13px;letter-spacing:-1px}
.grip:active{cursor:grabbing}

/* ── Giai đoạn đang đi ── */
.act.done{background:var(--surface-3)}
.act.done .ti,.act.done .mt{opacity:.72}
.act.skipped{background:var(--surface-3)}
.act.skipped .ti>span:nth-child(2){text-decoration:line-through;text-decoration-color:var(--line-2)}
.act.skipped .mt{opacity:.6}
.act.doing{background:var(--teal-soft);box-shadow:inset 3px 0 0 var(--teal)}
.act-real{color:var(--teal);font-weight:600;font-size:11.5px;white-space:nowrap}
.runctrls{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.runbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:100px;
  padding:3px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.runbtn:hover{border-color:var(--teal-line);color:var(--ink);background:var(--surface-3)}
.runbtn.go{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.runbtn.go:hover{background:var(--teal-2);border-color:var(--teal-2);color:#fff}
.today{border:1px solid var(--teal-line);background:var(--teal-soft);border-radius:var(--r);padding:14px 16px;
  display:flex;flex-direction:column;gap:11px}
.today .hd{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.today .nowk{font-family:var(--f-mo);font-size:12.5px;color:var(--teal);font-weight:600}
.nextup{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;
  background:var(--surface);border:1px solid var(--teal-line);border-radius:var(--r-s);padding:11px 13px}
.driftbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 13px;border-radius:var(--r-s);
  border:1px solid var(--sand-line);background:var(--sand-soft);font-size:13px}
.driftbar b{color:var(--sand)}
.jrow{margin-top:8px;padding:8px 10px;border-left:2px solid var(--teal-line);background:var(--surface-3);border-radius:0 6px 6px 0;
  display:flex;flex-direction:column;gap:6px}
.jrow .note{font-size:13px;color:var(--ink-2);font-style:italic}
.jrow .thumbs{display:flex;gap:5px;flex-wrap:wrap}
.jrow .thumbs img{width:44px;height:44px;object-fit:cover;border-radius:5px;border:1px solid var(--line);cursor:zoom-in;display:block}
.jadd{align-self:flex-start;border:1px dashed var(--line-2);background:transparent;color:var(--muted);border-radius:100px;
  padding:2px 10px;font-size:12px;cursor:pointer}
.jadd:hover{border-color:var(--teal-line);color:var(--teal)}
.moodpick{display:flex;gap:6px}
.lightbox{position:fixed;inset:0;z-index:85;background:rgba(8,16,14,.86);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:var(--shadow-lg)}
.lightbox .cap{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#dcece7;font-size:12.5px;

.meter i.b{background:var(--s2)}
.meter i.w{background:var(--sand)}
.meter i.c{background:var(--brick)}

.tour .th .n{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.85}
.tour .th h4{font-size:13.5px;font-weight:600;flex:1;color:#fff}
.tour .tb{padding:12px;display:flex;flex-direction:column;gap:10px}

.tour ol li{display:flex;gap:9px;padding:5px 7px;border-radius:6px;font-size:12.5px;color:var(--muted);cursor:pointer;align-items:baseline}

<script>

const STORE_KEY = "tripmind.demo.v4";
const FLAG_DEFAULTS = {
  placesDown: false,     // dịch vụ tìm địa điểm hỏng → 200 kèm reason, KHÔNG phải "không có kết quả"
  weatherDown: false,    // Open-Meteo hỏng → days: [] kèm reason
  aiDown: false,         // nhà cung cấp mô hình hỏng → event: error
  aiRateLimited: false,  // vượt giới hạn tần suất tầng AI → 429
  proposalExpired: false,// đề xuất sinh ra đã quá hạn
  undoWindowClosed: false,// cửa sổ hoàn tác đóng sẵn, khỏi phải chờ 10 phút
  slowNet: false,        // mạng chậm, để nhìn rõ khung xương
  mockClock: ""          // "14:20" — giả lập giờ hiện tại để dựng cảnh trễ lịch
};

const S = { db: null, session: null, flags: Object.assign({}, FLAG_DEFAULTS), jobs: {}, aiCallsThisHour: 0 };

/* Lưu phải BÁO được khi hỏng. Bản trước nuốt lỗi trong `catch (e) {}`: khi vượt
   hạn mức localStorage, màn hình vẫn hiện nhưng tải lại là mất — và mất luôn mọi
   thứ khác ghi cùng lần đó, vì cả object bị từ chối chứ không riêng phần mới. */
let saveFailed = false;
function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ db: S.db, session: S.session, flags: S.flags }));
    saveFailed = false;
    return true;
  } catch (e) {
    saveFailed = true;
    const full = e && (e.name === "QuotaExceededError" || e.code === 22);
    if (typeof toast === "function") {
      toast(full ? "Hết chỗ lưu trong trình duyệt. Thay đổi vừa rồi CHƯA được ghi lại — xoá bớt ảnh rồi thử lại."
        : "Trình duyệt không cho lưu dữ liệu. Thay đổi vừa rồi chỉ nằm trên màn hình, tải lại trang là mất.", "bad");
    }
    return false;
  }
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.db) { S.db = o.db; S.session = o.session || null; S.flags = Object.assign({}, FLAG_DEFAULTS, o.flags || {}); return true; } }
  } catch (e) { }
  return false;
}
function resetAll() {
  S.db = clone(SEED); S.session = null; S.flags = Object.assign({}, FLAG_DEFAULTS); S.jobs = {}; S.aiCallsThisHour = 0;
  if (typeof idbClear === "function") idbClear().catch(() => { });   /* byte ảnh nằm ngoài localStorage nên phải dọn riêng */
  save();
}

/* =============================================================================
   2c. BỘ ĐỆM TRA CỨU — khác cơ sở dữ liệu
   Đệm hết hạn thì mất và không ai thấy. Cơ sở dữ liệu thì còn mãi và hiện ra
   trong "Địa điểm đã lưu". Giữ đệm để khỏi đốt hạn ngạch nhà cung cấp; nó
   không vi phạm quy tắc "chỉ lưu địa điểm người dùng chọn".
   ========================================================================== */
const PLACE_CACHE = {};
const CACHE_TTL = 3600 * 1000;
function cacheKey(q, destId) { return (destId || 0) + "|" + norm(q || "").trim(); }

/* =============================================================================
   2d. KHO ẢNH — byte nằm ở IndexedDB, KHÔNG nằm trong localStorage
   `save()` gói cả cơ sở dữ liệu vào MỘT khoá localStorage. Một tấm ảnh điện thoại
   3 MB thành base64 4 MB là vỡ hạn mức ngay tấm đầu, và vỡ thì mất luôn mọi thứ
   khác ghi cùng lần đó. Nên: byte đầy đủ vào IndexedDB (hàng trăm MB), chỉ ảnh
   thu nhỏ ~3 KB đi vào localStorage để lưới ảnh vẽ được đồng bộ như phần còn lại.
   ========================================================================== */
const IDB = { name: "tripmind-photos", store: "blobs", db: null, ready: null, usable: null };
function idbOpen() {
  if (IDB.ready) return IDB.ready;
  IDB.ready = new Promise(res => {
    let req;
    try { req = indexedDB.open(IDB.name, 1); }
    catch (e) { IDB.usable = false; return res(null); }
    req.onupgradeneeded = () => { const db = req.result; if (!db.objectStoreNames.contains(IDB.store)) db.createObjectStore(IDB.store); };
    req.onsuccess = () => { IDB.db = req.result; IDB.usable = true; res(IDB.db); };
    req.onerror = () => { IDB.usable = false; res(null); };   /* chế độ riêng tư, file:// bị chặn… */
  });
  return IDB.ready;
}
function idbTx(mode, fn) {
  return idbOpen().then(db => {
    if (!db) return null;
    return new Promise((res, rej) => {
      const tx = db.transaction(IDB.store, mode), st = tx.objectStore(IDB.store);
      const r = fn(st);
      tx.oncomplete = () => res(r && r.result !== undefined ? r.result : null);
      tx.onerror = () => rej(tx.error);
    });
  });
}
const idbPut = (id, blob) => idbTx("readwrite", st => st.put(blob, id));
const idbGet = id => idbTx("readonly", st => st.get(id));
const idbDel = id => idbTx("readwrite", st => st.delete(id));
const idbClear = () => idbTx("readwrite", st => st.clear());

/* Nén trước khi lưu. Không nén thì 12 ảnh × 3 MB = 36 MB, chậm và vô ích. */
function compressImage(file, maxEdge, quality) {
  maxEdge = maxEdge || 1600; quality = quality || 0.82;
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("Không đọc được tệp ảnh"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("Tệp này không phải ảnh đọc được"));
      img.onload = () => {
        const sc = Math.min(1, maxEdge / Math.max(img.width, img.height));
        const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        /* Ảnh thu nhỏ cạnh dài 80px — đủ để vẽ lưới, đủ nhỏ để nằm trong localStorage */
        const ts = Math.min(1, 80 / Math.max(w, h));
        const tc = document.createElement("canvas");
        tc.width = Math.max(1, Math.round(w * ts)); tc.height = Math.max(1, Math.round(h * ts));
        tc.getContext("2d").drawImage(c, 0, 0, tc.width, tc.height);
        const thumb = tc.toDataURL("image/jpeg", 0.5);
        c.toBlob(blob => blob ? res({ blob, w, h, thumb }) : rej(new Error("Không nén được ảnh")), "image/jpeg", quality);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* Mỗi createObjectURL phải có revoke — render() thay innerHTML toàn bộ, quên là rò bộ nhớ */
const LIVE_URLS = new Set();
function blobUrl(blob) { const u = URL.createObjectURL(blob); LIVE_URLS.add(u); return u; }
function revokeUrls() { LIVE_URLS.forEach(u => URL.revokeObjectURL(u)); LIVE_URLS.clear(); }

class ApiError extends Error {
  constructor(http, code, message, details) { super(message); this.http = http; this.code = code; this.details = details || null; }
}
const lat = () => (S.flags.slowNet ? rnd(900, 1600) : rnd(120, 320));
/* Bộ đếm KHÔNG lùi. Bản trước lấy max(id)+1: xoá dòng có id lớn nhất rồi thêm dòng
   mới là cấp lại đúng id đó. Hoàn tác dựng lại dòng cũ vào sẽ ra hai dòng trùng id,
   và mọi phép `find(x => x.id === n)` sau đó trả về nhầm dòng. */
function nextId(key) {
  const arr = S.db[key] || [];
  const maxRow = arr.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);
  if (!S.db.seq) S.db.seq = {};
  const next = Math.max(maxRow, S.db.seq[key] || 0) + 1;
  S.db.seq[key] = next;
  return next;
}
const nowISO = () => new Date().toISOString();

function requireAuth() { if (!S.session) throw new ApiError(401, "UNAUTHENTICATED", "Phiên đăng nhập đã hết hạn"); return S.db.users.find(u => u.id === S.session.userId); }
function requireAdmin() { const u = requireAuth(); if (u.role !== "ADMIN") throw new ApiError(403, "FORBIDDEN_ROLE", "Tài khoản không có quyền quản trị"); return u; }
/* 404 cho cả "không có" lẫn "không phải của bạn" — BR-104 */
function ownTrip(id) {
  const u = requireAuth();
  const t = S.db.trips.find(x => x.id === Number(id));
  if (!t || t.userId !== u.id) throw new ApiError(404, "TRIP_NOT_FOUND", "Không tìm thấy chuyến đi");
  return t;
}
function logTool(tool, args, status, ms, result, error, tripId, convId) {
  const id = nextId("toolExecutions");
  S.db.toolExecutions.unshift({
    id, userId: S.session ? S.session.userId : null, tripId: tripId || null, convId: convId || null,
    tool, status, ms, args: args || {}, result: result || null, error: error || null, at: nowISO()
  });
  return id;   /* để buộc bằng chứng vào đề xuất — xem "vì sao chỗ này" */
}

/* ── Suy dẫn ───────────────────────────────────────────────────────────────── */
function tripDays(tripId) { return S.db.days.filter(x => x.tripId === tripId).sort((a, b) => a.dayNumber - b.dayNumber); }
function dayActs(dayId) { return S.db.activities.filter(a => a.dayId === dayId).sort((a, b) => a.order - b.order); }
function placeOf(a) { return a.placeId ? S.db.places.find(p => p.id === a.placeId) : null; }
function tripActs(tripId) { const ids = tripDays(tripId).map(d => d.id); return S.db.activities.filter(a => ids.includes(a.dayId)); }
function planningProgress(tripId) {
  const ds = tripDays(tripId); if (!ds.length) return 0;
  return ds.filter(x => dayActs(x.id).length >= 2).length / ds.length;   // BR-207
}
/* Tiến độ THỰC HIỆN — khác hẳn planningProgress ở trên, và không được trộn vào nhau.
   Một cái đo "đã lên lịch tới đâu", một cái đo "đã đi tới đâu". */
function tripProgress(tripId) {
  const acts = tripActs(tripId);
  const n = k => acts.filter(a => (a.status || "PLANNED") === k).length;
  const done = n("DONE"), skipped = n("SKIPPED"), doing = n("DOING"), planned = n("PLANNED");
  const total = acts.length;
  return { done, skipped, doing, planned, total, pct: total ? (done + skipped) / total : 0 };
}
/* Giai đoạn chuyến đi. Suy từ ngày là mặc định, nhưng người dùng bật tay được —
   bắt buộc phải có, vì TODAY của bản demo bị đóng băng ở 19/10 nên chuyến 20–23/10
   sẽ KHÔNG BAO GIỜ tự vào giai đoạn đang đi. Khi bật tay thì giao diện phải nói rõ. */
function derivedPhase(t) { return TODAY < t.startDate ? "BEFORE" : TODAY > t.endDate ? "AFTER" : "DURING"; }
function tripPhase(t) { return t.phaseOverride || derivedPhase(t); }
function realDayNumber(t) {
  if (TODAY < t.startDate || TODAY > t.endDate) return null;
  return diffDays(t.startDate, TODAY) + 1;
}
/* Hôm nay nằm ngoài chuyến thì KHÔNG tự đoán về ngày 1 — trừ khi người dùng đã tự bật
   chế độ đang đi, lúc đó họ chọn ngày nào lấy ngày đó, và giao diện ghi rõ đây là ngày
   mô phỏng chứ không phải hôm nay thật. */
function currentDayNumber(t) {
  const real = realDayNumber(t);
  if (real) return real;
  if (t.phaseOverride === "DURING") {
    const n = diffDays(t.startDate, t.endDate) + 1;
    return Math.min(Math.max(Number(t.simulatedDay) || 1, 1), n);
  }
  return null;
}
function decorateTrip(t) {
  const dest = S.db.destinations.find(x => x.id === t.destId);
  return Object.assign({}, t, {
    destination: dest, daysCount: diffDays(t.startDate, t.endDate) + 1,
    planningProgress: planningProgress(t.id), isPast: t.endDate < TODAY,
    phase: tripPhase(t), phaseIsManual: !!t.phaseOverride && t.phaseOverride !== derivedPhase(t),
    currentDay: currentDayNumber(t), dayIsSimulated: !realDayNumber(t) && t.phaseOverride === "DURING",
    progress: tripProgress(t.id)
  });
}

function tripParts(tripId) { return S.db.participants.filter(x => x.tripId === tripId); }

/* ── Ràng buộc cứng ──────────────────────────────────────────────────────────
   Những điều kiện người dùng đặt ra mà trợ lý phải tôn trọng. Cái quan trọng không

   không âm thầm bỏ qua rồi đưa một phương án trông có vẻ ổn. */
const CONSTRAINTS = {
  RETURN_BEFORE: { label: "Ngày cuối phải xong trước", unit: "giờ", def: "18:00", input: "time" },
  NO_EARLY: { label: "Không bắt đầu trước", unit: "giờ", def: "08:00", input: "time" },
  MAX_KM_DAY: { label: "Mỗi ngày đi không quá", unit: "km", def: 40, input: "number" }
};
function checkConstraints(tripId, changes) {
  const t = S.db.trips.find(x => x.id === tripId);
  const list = t.constraints || [];
  if (!list.length) return [];
  /* Dựng lịch trình giả lập rồi đo trên đó — cùng cách simulatePlan làm */
  const days = tripDays(tripId).map(d0 => ({ dayNumber: d0.dayNumber, acts: dayActs(d0.id).map(a => Object.assign({}, a)) }));
  const frozen = new Set(tripActs(tripId).filter(isFrozen).map(a => a.id));
  (changes || []).forEach(op => {
    if (op.activityId && frozen.has(op.activityId)) return;
    if (op.op === "REMOVE") days.forEach(d0 => { d0.acts = d0.acts.filter(a => a.id !== op.activityId); });
    else if (op.op === "ADD") { const d0 = days.find(x => x.dayNumber === op.dayNumber); if (d0) d0.acts.push({ id: -Math.random(), title: op.title, placeId: op.placeId || null, placeXid: op.placeXid || null, start: op.start, end: op.end }); }
    else if (op.op === "UPDATE") days.forEach(d0 => d0.acts.forEach(a => { if (a.id === op.activityId) Object.assign(a, op.patch); }));
  });
  days.forEach(d0 => d0.acts.sort((a, b) => (a.start || "99:99").localeCompare(b.start || "99:99")));
  const geo = a => a.placeId ? S.db.places.find(x => x.id === a.placeId) : (a.placeXid ? PROVIDER.places.find(x => x.xid === a.placeXid) : null);

  return list.map(c => {
    const spec = CONSTRAINTS[c.kind];
    if (c.kind === "RETURN_BEFORE") {
      const last = days[days.length - 1];
      const ends = last.acts.map(a => a.end || a.start).filter(Boolean);
      if (!ends.length) return { kind: c.kind, label: spec.label + " " + c.value, ok: true, detail: "ngày cuối chưa có hoạt động nào" };
      const latest = ends.sort()[ends.length - 1];
      const over = deltaMinutes(c.value, latest);
      return { kind: c.kind, label: spec.label + " " + c.value, ok: over <= 0,
        detail: over <= 0 ? "hoạt động cuối xong lúc " + latest : "hoạt động cuối xong lúc " + latest + ", trễ " + over + " phút" };
    }
    if (c.kind === "NO_EARLY") {
      let worst = null;
      days.forEach(d0 => d0.acts.forEach(a => { if (a.start && (!worst || a.start < worst.start)) worst = { start: a.start, title: a.title, day: d0.dayNumber }; }));
      if (!worst) return { kind: c.kind, label: spec.label + " " + c.value, ok: true, detail: "chưa có hoạt động nào đặt giờ" };
      const early = deltaMinutes(worst.start, c.value);
      return { kind: c.kind, label: spec.label + " " + c.value, ok: early <= 0,
        detail: early <= 0 ? "sớm nhất là " + worst.start : "“" + worst.title + "” ngày " + worst.day + " bắt đầu " + worst.start + ", sớm hơn " + early + " phút" };
    }
    if (c.kind === "MAX_KM_DAY") {
      let worst = null;
      days.forEach(d0 => {
        const g = d0.acts.map(geo).filter(Boolean);
        let km = 0; for (let i = 1; i < g.length; i++) km += haversine(g[i - 1], g[i]);
        if (!worst || km > worst.km) worst = { km, day: d0.dayNumber };
      });
      const lim = Number(c.value);
      return { kind: c.kind, label: spec.label + " " + lim + " km", ok: !worst || worst.km <= lim,
        detail: !worst ? "chưa tính được" : "ngày " + worst.day + " đi nhiều nhất: " + worst.km.toFixed(1).replace(".", ",") + " km" };
    }
    return { kind: c.kind, label: c.kind, ok: true, detail: "" };
  });
}

/* ── Hoàn tác một đề xuất đã áp dụng ─────────────────────────────────────────
   Không thể sinh thao tác nghịch từ `p.changes` sau khi đã áp dụng: `op.patch` chỉ
   có giá trị MỚI, id của hoạt động thêm vào do nextId cấp lúc chạy, dòng bị xoá thì
   mất hẳn. Nên phải ghi nhật ký nghịch đảo NGAY TRONG lúc áp dụng.
   Cũng không chụp cả cây: chụp cả cây thì hoàn tác một đề xuất ngày 1 sẽ nuốt luôn
   thứ người dùng vừa thêm cho ngày 4. */
const UNDO_WINDOW_MS = 10 * 60000;
function actFingerprint(a) {
  return [a.title, a.start || "", a.end || "", a.cost == null ? "" : a.cost,
    a.placeId || "", a.dayId, a.notes || "", a.status || "PLANNED"].join("|");
}
function restoreDayOrder(dayId, ids) {
  const live = dayActs(dayId);
  const order = ids.filter(id => live.some(a => a.id === id));
  live.forEach(a => { if (order.indexOf(a.id) < 0) order.push(a.id); });  /* id lạ (thêm sau) xếp cuối */
  order.forEach((id, i) => { const a = live.find(x => x.id === id); if (a) a.order = i; });
}
function canUndo(p) {
  if (!p) return { ok: false, reason: "NOT_FOUND", msLeft: 0 };
  if (p.status !== "APPLIED") return { ok: false, reason: "NOT_APPLIED", msLeft: 0 };
  if (!p.undo) return { ok: false, reason: "NOT_AVAILABLE", msLeft: 0 };
  const msLeft = Date.parse(p.undo.expiresAt) - Date.now();
  if (msLeft <= 0) return { ok: false, reason: "WINDOW_CLOSED", msLeft: 0 };
  /* LIFO có nới: cho lùi nếu là cái áp dụng gần nhất, HOẶC nếu nó không đụng chung
     bản ghi nào với những đề xuất áp dụng sau nó. Hai đề xuất ở hai ngày khác nhau
     thì lùi cái nào trước cũng được. */
  const mine = new Set(p.undo.touched.activityIds || []);
  const later = S.db.proposals.filter(x => x.tripId === p.tripId && x.status === "APPLIED"
    && (x.appliedSeq || 0) > (p.appliedSeq || 0));
  for (const x of later) {
    const theirs = (x.undo && x.undo.touched.activityIds) || [];
    if (theirs.some(id => mine.has(id))) return { ok: false, reason: "BLOCKED_BY_LATER", blockedBy: x.id, msLeft };
  }
  return { ok: true, reason: null, msLeft };
}
/* Chạy khô để hộp xác nhận nói được ĐÚNG những gì sắp xảy ra, kể cả phần sẽ bị bỏ qua */
function undoPreview(p) {
  const out = { willDelete: [], willRestore: [], willRevert: [], willSkip: [] };
  if (!p || !p.undo) return out;
  for (let i = p.undo.ops.length - 1; i >= 0; i--) {
    const op = p.undo.ops[i];
    if (op.k === "DEL") {
      const a = S.db.activities.find(x => x.id === op.activityId);
      if (!a) out.willSkip.push({ title: op.title, reason: "ACTIVITY_ALREADY_DELETED" });
      else if (actFingerprint(a) !== op.fp) out.willSkip.push({ title: a.title, reason: "ACTIVITY_EDITED_AFTER_APPLY" });
      else out.willDelete.push(a.title);
    } else if (op.k === "INS") {
      out.willRestore.push(op.row.title);
    } else if (op.k === "RESTORE") {
      const a = S.db.activities.find(x => x.id === op.activityId);
      if (!a) out.willSkip.push({ title: op.title, reason: "ACTIVITY_ALREADY_DELETED" });
      else if (actFingerprint(a) !== op.fp) out.willSkip.push({ title: a.title, reason: "ACTIVITY_EDITED_AFTER_APPLY" });
      else out.willRevert.push(a.title);
    } else if (op.k === "DELEXP") {
      const e = S.db.expenses.find(x => x.id === op.expenseId);
      if (!e) out.willSkip.push({ title: op.title || "khoản chi", reason: "EXPENSE_ALREADY_DELETED" });
      else out.willDelete.push("khoản chi " + money(e.amount, e.currency));
    }
  }
  return out;
}

  ACTIVITY_EDITED_AFTER_APPLY: "bạn đã sửa tay sau khi áp dụng nên hệ thống giữ nguyên",
  EXPENSE_ALREADY_DELETED: "khoản chi đã bị xoá từ trước"
};

const MOOD_ICON = { GOOD: "◕", OK: "◑", BAD: "◔" };
function tripJournal(tripId) { return S.db.journalEntries.filter(x => x.tripId === tripId); }
function journalOf(tripId, dayId, activityId) {

    && (x.activityId || null) === (activityId || null)) || null;
}

const ACT_STATUS = { PLANNED: "Chưa làm", DOING: "Đang làm", DONE: "Đã xong", SKIPPED: "Đã bỏ" };
const SKIP_REASON = { RAIN: "trời mưa", TIRED: "mệt", CLOSED: "chỗ đó đóng cửa", NO_TIME: "không kịp giờ", OTHER: "lý do khác" };
const actStatus = a => a.status || "PLANNED";
const isFrozen = a => actStatus(a) === "DONE" || actStatus(a) === "SKIPPED";

/* ── Lệch lịch ────────────────────────────────────────────────────────────────
   Chỉ TÍNH ra bạn đang trễ bao nhiêu. Không tự dời giờ hoạt động nào — dời giờ là
   việc của một đề xuất mà bạn phải bấm duyệt, y như mọi thay đổi khác. */
function scheduleDrift(tripId, dayNumber) {
  const days = tripDays(tripId);
  const day = dayNumber ? days.find(x => x.dayNumber === Number(dayNumber))
    : (days.find(x => x.date === TODAY) || null);
  if (!day) return null;
  const acts = dayActs(day.id);
  let anchor = null, drift = 0, source = null;
  acts.forEach(a => {
    const st = actStatus(a);
    if (st === "DONE" && a.actualEnd && a.end) {
      anchor = a; drift = deltaMinutes(a.end, a.actualEnd); source = "ACTUAL";
    } else if (st === "DOING") {
      /* Chưa xong nên chưa có giờ thực tế. Mốc là ĐỒNG HỒ — phải nói khác đi:
         "đang trễ … tính tới lúc này", không phải "đã trễ …". */
      const ref = a.end || a.start;
      const dlt = ref ? deltaMinutes(ref, nowHM()) : null;
      if (dlt != null && dlt > 0) { anchor = a; drift = dlt; source = "NOW"; }
    }
  });
  const idx = anchor ? acts.indexOf(anchor) : -1;
  return {
    dayId: day.id, dayNumber: day.dayNumber, date: day.date,
    anchorActivityId: anchor ? anchor.id : null, anchorTitle: anchor ? anchor.title : null,
    driftMinutes: Math.round(drift || 0), source,
    chain: acts.filter(a => a.actualStart || a.actualEnd).map(a => ({
      activityId: a.id, title: a.title, plannedStart: a.start, actualStart: a.actualStart,
      delta: a.start && a.actualStart ? deltaMinutes(a.start, a.actualStart) : null
    })),
    affected: idx < 0 ? [] : acts.slice(idx + 1).filter(a => actStatus(a) === "PLANNED" && a.start).map(a => a.id)
  };
}

/* ── Chia tiền: số dư từng người, rồi rút gọn thành ít lượt chuyển nhất ─────
   Chia theo TỪNG loại tiền tệ, không quy đổi — cùng lý do với BR-401. */
function settleTrip(tripId) {
  const parts = tripParts(tripId);
  const exps = S.db.expenses.filter(e => e.tripId === tripId);
  const byCur = {};
  exps.forEach(e => {
    const share = (e.shareWith && e.shareWith.length ? e.shareWith : parts.map(p => p.id)).filter(id => parts.some(p => p.id === id));
    if (!share.length || e.paidBy == null) return;
    const g = byCur[e.currency] || (byCur[e.currency] = { paid: {}, owed: {}, total: 0, count: 0 });
    g.total += e.amount; g.count++;
    g.paid[e.paidBy] = (g.paid[e.paidBy] || 0) + e.amount;
    /* Chia đều tới đơn vị nhỏ nhất; phần dư rải cho vài người đầu để tổng khớp
       tuyệt đối — không được làm tròn rồi lệch mất mấy đồng. */
    const base = Math.floor(e.amount / share.length), rem = e.amount - base * share.length;
    share.forEach((id, i) => { g.owed[id] = (g.owed[id] || 0) + base + (i < rem ? 1 : 0); });
  });
  return Object.keys(byCur).map(cur => {
    const g = byCur[cur];
    const rows = parts.map(p => ({
      id: p.id, name: p.name, isMe: p.isMe,
      paid: g.paid[p.id] || 0, owed: g.owed[p.id] || 0, balance: (g.paid[p.id] || 0) - (g.owed[p.id] || 0)
    }));
    const cred = rows.filter(r => r.balance > 0).map(r => ({ name: r.name, v: r.balance })).sort((a, b) => b.v - a.v);
    const debt = rows.filter(r => r.balance < 0).map(r => ({ name: r.name, v: -r.balance })).sort((a, b) => b.v - a.v);
    const transfers = []; let i = 0, j = 0;
    while (i < debt.length && j < cred.length) {
      const amt = Math.min(debt[i].v, cred[j].v);
      if (amt > 0) transfers.push({ from: debt[i].name, to: cred[j].name, amount: amt, currency: cur });
      debt[i].v -= amt; cred[j].v -= amt;
      if (debt[i].v <= 0.0001) i++;
      if (cred[j].v <= 0.0001) j++;
    }
    return { currency: cur, total: g.total, count: g.count, rows, transfers };
  }).sort((a, b) => b.total - a.total);
}

/* Loại hoạt động ↦ hạng mục chi tiêu. MỘT bản duy nhất — viết bản thứ hai là bảo
   đảm hai màn hình sẽ lệch nhau sau vài lần sửa. */
const TYPE2CAT = { ACCOMMODATION: "ACCOMMODATION", FOOD: "FOOD", TRANSPORT: "TRANSPORTATION", SIGHTSEEING: "ACTIVITIES", REST: "OTHER", OTHER: "OTHER" };

/* ── Ngân sách — BR-401/402/403 ────────────────────────────────────────────── */
function budgetOf(tripId) {
  const t = S.db.trips.find(x => x.id === tripId);
  const acts = tripActs(tripId);
  const estimatedTotal = acts.reduce((s, a) => s + (a.cost || 0), 0);
  const exps = S.db.expenses.filter(e => e.tripId === tripId);
  const same = exps.filter(e => e.currency === t.currency);
  const actualTotal = same.reduce((s, e) => s + e.amount, 0);
  const byCategory = {};
  Object.keys(EXP_LABEL).forEach(k => { byCategory[k] = same.filter(e => e.category === k).reduce((s, e) => s + e.amount, 0); });
  const estByCategory = { ACCOMMODATION: 0, FOOD: 0, TRANSPORTATION: 0, ACTIVITIES: 0, SHOPPING: 0, OTHER: 0 };
  acts.forEach(a => { estByCategory[TYPE2CAT[a.type] || "OTHER"] += (a.cost || 0); });
  const others = {};
  exps.filter(e => e.currency !== t.currency).forEach(e => { others[e.currency] = (others[e.currency] || 0) + e.amount; });
  const used = Math.max(estimatedTotal, actualTotal);
  let warningLevel = "NONE";
  if (t.budget) { const r = used / t.budget; warningLevel = r > 1 ? "OVER" : r > 0.9 ? "NEAR_LIMIT" : "NONE"; }
  return {
    budget: t.budget, currency: t.currency, estimatedTotal, actualTotal,
    remaining: t.budget == null ? null : t.budget - used,
    byCategory, estByCategory, warningLevel, hasExpenses: exps.length > 0,
    otherCurrencies: Object.keys(others).map(c => ({ currency: c, actualTotal: others[c] }))
  };
}

/* ── Bạn ước sai ở đâu ────────────────────────────────────────────────────────
   So ƯỚC TÍNH (bạn nhập cho từng hoạt động) với THỰC TẾ (bạn ghi vào sổ chi tiêu).
   Chỉ tính tỉ số khi CẢ HAI vế đều lớn hơn 0 — thiếu một vế thì nói "chưa đủ dữ
   liệu", không hiện 0% cũng không hiện vô cực. */
function estimateAccuracy(tripId) {
  const t = S.db.trips.find(x => x.id === tripId);
  const acts = tripActs(tripId);
  const exps = S.db.expenses.filter(e => e.tripId === tripId && e.currency === t.currency);
  const cats = Object.keys(EXP_LABEL);
  const byCategory = {};
  cats.forEach(k => {
    /* Hoạt động đã bỏ thì tiền ước tính của nó không đáng để so — mình có đi đâu */
    const est = acts.filter(a => (TYPE2CAT[a.type] || "OTHER") === k && actStatus(a) !== "SKIPPED")
      .reduce((sum, a) => sum + (a.cost || 0), 0);
    const act = exps.filter(e => e.category === k).reduce((sum, e) => sum + e.amount, 0);
    const enough = est > 0 && act > 0;
    byCategory[k] = { est, act, enough, ratio: enough ? act / est : null, n: exps.filter(e => e.category === k).length };
  });
  const est = cats.reduce((sum, k) => sum + byCategory[k].est, 0);
  const act = cats.reduce((sum, k) => sum + byCategory[k].act, 0);
  const others = {};
  S.db.expenses.filter(e => e.tripId === tripId && e.currency !== t.currency)
    .forEach(e => { others[e.currency] = (others[e.currency] || 0) + e.amount; });
  return {
    currency: t.currency, byCategory,
    overall: { est, act, enough: est > 0 && act > 0, ratio: est > 0 && act > 0 ? act / est : null },
    otherCurrencies: Object.keys(others).map(c => ({ currency: c, actualTotal: others[c] }))
  };
}
/* Thói quen ước lượng qua NHIỀU chuyến. Dưới hai chuyến đã kết thúc thì không đủ để
   nói gì cả — và phải nói thẳng là chưa đủ, chứ không đưa ra một con số mong manh. */
function userBias(userId) {
  const trips = S.db.trips.filter(t => t.userId === userId && tripPhase(t) === "AFTER");
  const cats = Object.keys(EXP_LABEL), acc = {};
  cats.forEach(k => { acc[k] = { sumEst: 0, sumAct: 0, trips: 0 }; });
  trips.forEach(t => {
    const a = estimateAccuracy(t.id);
    cats.forEach(k => { if (a.byCategory[k].enough) { acc[k].sumEst += a.byCategory[k].est; acc[k].sumAct += a.byCategory[k].act; acc[k].trips++; } });
  });
  const byCategory = {};
  cats.forEach(k => {
    byCategory[k] = acc[k].trips >= 2 && acc[k].sumEst > 0
      ? { ratio: acc[k].sumAct / acc[k].sumEst, trips: acc[k].trips, enough: true }
      : { ratio: null, trips: acc[k].trips, enough: false };
  });
  return { byCategory, trips: trips.length, enough: trips.length >= 2 };
}

/* ── Thời tiết — trường `source` bắt buộc, QĐ-07 ───────────────────────────── */
const WEATHER_FIXED = {
  "2026-10-20": { tempMax: 29, tempMin: 24, precip: 0.8, code: 61 },
  "2026-10-21": { tempMax: 31, tempMin: 25, precip: 0.2, code: 2 }
};
function weatherOf(tripId) {
  const t = S.db.trips.find(x => x.id === tripId);
  if (S.flags.weatherDown) return { days: [], reason: "PROVIDER_UNAVAILABLE" };
  if (t.endDate < TODAY) return { days: [], reason: "PAST_TRIP" };
  const out = [];
  for (let i = 0; i < diffDays(t.startDate, t.endDate) + 1; i++) {
    const date = addDays(t.startDate, i);
    if (date <= FORECAST_LIMIT && date >= TODAY) {
      const f = WEATHER_FIXED[date] || { tempMax: 30, tempMin: 24, precip: 0.15, code: 1 };
      out.push({ date, tempMax: f.tempMax, tempMin: f.tempMin, precipitationProbability: f.precip, weatherCode: f.code, source: "FORECAST" });
    } else {
      const m = d(date).getUTCMonth() + 1;
      const wet = [9, 10, 11].includes(m);
      out.push({ date, tempMax: wet ? 29 : 27, tempMin: wet ? 23 : 18, precipitationProbability: wet ? 0.45 : 0.2, weatherCode: null, source: "CLIMATE_NORMAL" });
    }
  }
  return { days: out, reason: null };
}

/* ── API ───────────────────────────────────────────────────────────────────── */
const api = {
  async login(email, password) {
    await sleep(lat() + 240);
    const u = S.db.users.find(x => x.email === String(email).trim().toLowerCase());
    /* Một câu chung, không nói cái nào sai — ADS-40 §C.1 */
    if (!u || u.password !== password) throw new ApiError(401, "BAD_CREDENTIALS", "Email hoặc mật khẩu không đúng");
    S.session = { userId: u.id, role: u.role, at: nowISO() }; save();
    return { user: { id: u.id, name: u.name, email: u.email, role: u.role }, expiresIn: 900 };
  },
  async register(name, email, password) {
    await sleep(lat() + 300);
    email = String(email).trim().toLowerCase();
    if (S.db.users.some(x => x.email === email)) throw new ApiError(409, "EMAIL_TAKEN", "Email này đã được đăng ký");
    const u = { id: nextId("users"), email, password, name, role: "USER", createdAt: TODAY, active: true };
    S.db.users.push(u);
    S.db.preferences.push({ userId: u.id, travelStyle: "BALANCED", budgetPreference: "MODERATE", preferences: [] });
    S.session = { userId: u.id, role: "USER", at: nowISO() }; save();
    return { user: u };
  },
  logout() { S.session = null; save(); },
  me() { const u = requireAuth(); return Object.assign({}, u, { preferences: S.db.preferences.find(p => p.userId === u.id) || { travelStyle: null, budgetPreference: null, preferences: [] } }); },
  async updateMe(patch) { await sleep(lat()); const u = requireAuth(); Object.assign(u, patch); save(); return u; },

  async trips(status) {

    let list = S.db.trips.filter(t => t.userId === u.id).map(decorateTrip);
    if (status === "upcoming") list = list.filter(t => !t.isPast).sort((a, b) => a.startDate.localeCompare(b.startDate));
    if (status === "past") list = list.filter(t => t.isPast).sort((a, b) => b.startDate.localeCompare(a.startDate));
    return list;
  },
  async trip(id) { await sleep(lat()); return decorateTrip(ownTrip(id)); },
  async createTrip(b) {
    await sleep(lat() + 420); const u = requireAuth();
    if (!S.db.destinations.some(x => x.id === Number(b.destId))) throw new ApiError(404, "DESTINATION_NOT_FOUND", "Không tìm thấy điểm đến");
    if (b.endDate < b.startDate) throw new ApiError(400, "INVALID_DATE_RANGE", "Ngày về không được trước ngày đi");
    const len = diffDays(b.startDate, b.endDate) + 1;
    if (len > 30) throw new ApiError(422, "TRIP_TOO_LONG", "Chuyến đi tối đa 30 ngày");
    if (!(b.travelers >= 1)) throw new ApiError(400, "VALIDATION_FAILED", "Số người phải từ 1 trở lên");
    const t = {
      id: nextId("trips"), userId: u.id, destId: Number(b.destId), name: b.name, startDate: b.startDate, endDate: b.endDate,
      travelers: Number(b.travelers), budget: b.budget == null || b.budget === "" ? null : Number(b.budget), currency: b.currency || "VND",
      travelStyle: b.travelStyle, budgetPreference: b.budgetPreference, preferences: b.preferences || [], createdAt: TODAY
    };
    S.db.trips.push(t);
    /* Sinh luôn đủ số ngày trong cùng giao dịch — BR-202 */
    let did = nextId("days");
    for (let i = 0; i < len; i++) S.db.days.push({ id: did++, tripId: t.id, dayNumber: i + 1, date: addDays(t.startDate, i) });
    save(); return decorateTrip(t);
  },
  async deleteTrip(id) {
    await sleep(lat()); const t = ownTrip(id);
    const dayIds = tripDays(t.id).map(x => x.id);
    S.db.activities = S.db.activities.filter(a => !dayIds.includes(a.dayId));
    S.db.days = S.db.days.filter(x => x.tripId !== t.id);
    S.db.expenses = S.db.expenses.filter(e => e.tripId !== t.id);
    S.db.participants = S.db.participants.filter(x => x.tripId !== t.id);
    S.db.journalEntries = S.db.journalEntries.filter(x => x.tripId !== t.id);
    /* Byte ảnh nằm ở IndexedDB, không tự biến mất theo localStorage */
    S.db.photos.filter(x => x.tripId === t.id).forEach(x => idbDel(x.id).catch(() => { }));
    S.db.photos = S.db.photos.filter(x => x.tripId !== t.id);
    S.db.trips = S.db.trips.filter(x => x.id !== t.id);
    save(); return { ok: true };
  },

  /* Gửi CẢ danh sách, phải khớp đúng tập hoạt động của ngày — BR-204/205 */
  async reorder(dayId, activityIds) {
    await sleep(lat()); const day = S.db.days.find(x => x.id === Number(dayId));
    if (!day) throw new ApiError(404, "DAY_NOT_FOUND", "Không tìm thấy ngày");
    ownTrip(day.tripId);

  /* Tra cứu đi RA NGOÀI. Kết quả không vào cơ sở dữ liệu — chỉ vào bộ đệm 1 giờ.
     Muốn có dòng trong CSDL thì người dùng phải bấm chọn: xem adoptPlace. */
  async searchPlaces(q, destId, opts) {
    opts = opts || {};
    const key = cacheKey(q, destId), hit = PLACE_CACHE[key];
    const fresh = hit && Date.now() - hit.at < CACHE_TTL;
    await sleep(fresh ? 60 : lat() + 260);
    const t0 = performance.now();
    if (!fresh && S.flags.placesDown) {
      logTool("search_places", { query: q, radius: 5000 }, "ERROR", Math.round(performance.now() - t0) + 2400, null, "PROVIDER_UNAVAILABLE", opts.tripId || null, null);
      /* Dịch vụ ngoài lỗi → 200 kèm lý do, KHÔNG phải "không tìm thấy" — QĐ-11 */
      return { results: [], reason: "PROVIDER_UNAVAILABLE", cached: false, attribution: PROVIDER.attribution };
    }
    let raw;
    if (fresh) raw = hit.raw;
    else {
      const term = norm(q || "");
      raw = PROVIDER.places.filter(x => !destId || x.destId === Number(destId));
      if (term) raw = raw.filter(x => norm(x.name).includes(term) || norm(x.category).includes(term) || norm(x.address).includes(term));
      raw = raw.slice(0, opts.limit || 8);
      PLACE_CACHE[key] = { at: Date.now(), raw };
    }
    const dest = S.db.destinations.find(x => x.id === Number(destId));
    const res = raw.map(x => Object.assign({}, x, {
      distanceKm: dest ? haversine({ lat: dest.lat, lng: dest.lng }, { lat: x.lat, lng: x.lng }) : null,
      fetchedAt: nowISO(),
      /* Có nằm trong CSDL của người dùng chưa? Giao diện phải nói rõ. */
      dbId: (S.db.places.find(p => p.externalId === x.xid) || {}).id || null
    }));
    return { results: res, reason: null, cached: fresh, attribution: PROVIDER.attribution + " · ảnh chụp lúc tra cứu " + new Date().toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) };
  },

  /* Điểm DUY NHẤT ghi một địa điểm vào cơ sở dữ liệu. Luôn do người dùng bấm. */
  adoptPlace(xid, via) {
    requireAuth();
    const has = S.db.places.find(p => p.externalId === xid);
    if (has) return has;
    const src = PROVIDER.places.find(x => x.xid === xid);
    if (!src) throw new ApiError(404, "PLACE_NOT_FOUND", "Nhà cung cấp không còn địa điểm này");
    const row = Object.assign({}, src, {
      id: nextId("places"), provider: "GOOGLE_PLACES", externalId: xid,
      adoptedAt: TODAY, adoptedVia: via || "USER_PICK"
    });
    S.db.places.push(row); save();
    return row;
  },

    await sleep(lat()); const u = requireAuth();
    return S.db.savedPlaces.filter(s => s.userId === u.id).map(s => Object.assign({}, S.db.places.find(p => p.id === s.placeId), { savedAt: s.savedAt }));
  },

  async budget(tripId) { await sleep(lat()); const t = ownTrip(tripId); return budgetOf(t.id); },
  async expenses(tripId) { await sleep(lat()); const t = ownTrip(tripId); return S.db.expenses.filter(e => e.tripId === t.id).sort((a, b) => b.date.localeCompare(a.date)); },
  async addExpense(tripId, b) {
    await sleep(lat()); const t = ownTrip(tripId);
    const rawAmount = b.minor != null ? Number(b.minor) : Number(b.amount) * (MINOR[b.currency || t.currency] || 1);
    if (!(rawAmount >= 0)) throw new ApiError(400, "VALIDATION_FAILED", "Số tiền không được âm");
    const parts = tripParts(t.id);
    const me = (parts.find(x => x.isMe) || parts[0] || {}).id || null;
    const e = {
      id: nextId("expenses"), tripId: t.id, category: b.category,
      amount: Math.round(rawAmount),
      currency: b.currency || t.currency, description: b.description || null, date: b.date || TODAY,
      paidBy: b.paidBy != null ? Number(b.paidBy) : me,
      shareWith: (b.shareWith && b.shareWith.length ? b.shareWith.map(Number) : parts.map(x => x.id)),
      placeId: b.placeId || null, source: b.source || "FORM"
    };
    S.db.expenses.push(e); save(); return e;   /* Vượt ngân sách KHÔNG chặn — chỉ cảnh báo */
  },

  async weather(tripId) { await sleep(lat() + 180); const t = ownTrip(tripId); return weatherOf(t.id); },

  /* Đánh dấu một hoạt động. Nhiều nhất MỘT hoạt động đang làm mỗi chuyến — không có
     ràng buộc này thì phép tính lệch lịch không còn mốc nào để bám. */
  async setActivityStatus(id, status, opts) {
    await sleep(lat() - 60);
    opts = opts || {};
    const a = S.db.activities.find(x => x.id === Number(id));
    if (!a) throw new ApiError(404, "ACTIVITY_NOT_FOUND", "Không tìm thấy hoạt động");
    const day = S.db.days.find(x => x.id === a.dayId);
    const t = ownTrip(day.tripId);
    if (!ACT_STATUS[status]) throw new ApiError(400, "VALIDATION_FAILED", "Trạng thái không hợp lệ");
    let closed = null;
    if (status === "DOING") {
      tripActs(t.id).forEach(x => {
        if (x.id !== a.id && actStatus(x) === "DOING") {
          x.status = "DONE"; x.actualEnd = x.actualEnd || nowHM(); closed = x;
        }
      });
      a.actualStart = opts.actualStart || a.actualStart || nowHM();
      a.actualEnd = null; a.skipReason = null;
    } else if (status === "DONE") {
      a.actualStart = opts.actualStart || a.actualStart || a.start || nowHM();
      a.actualEnd = opts.actualEnd || nowHM();
      a.skipReason = null;
    } else if (status === "SKIPPED") {
      a.skipReason = opts.skipReason || "OTHER";
      a.actualStart = null; a.actualEnd = null;
    } else {
      a.actualStart = null; a.actualEnd = null; a.skipReason = null;
    }
    a.status = status;
    save();
    return { activity: a, autoClosed: closed ? { id: closed.id, title: closed.title } : null, drift: scheduleDrift(t.id, day.dayNumber) };
  },
  async setTripPhase(tripId, phase, simulatedDay) {
    await sleep(lat() - 80);
    const t = ownTrip(tripId);
    if (phase && !["BEFORE", "DURING", "AFTER"].includes(phase)) throw new ApiError(400, "VALIDATION_FAILED", "Giai đoạn không hợp lệ");
    t.phaseOverride = phase || null;
    if (simulatedDay != null) t.simulatedDay = Number(simulatedDay);
    save();
    return decorateTrip(t);
  },
  async drift(tripId, dayNumber) { await sleep(lat() - 90); const t = ownTrip(tripId); return scheduleDrift(t.id, dayNumber); },
  async setConstraints(tripId, list) {

  /* ── Nhật ký ─────────────────────────────────────────────────────────────── */
  async journal(tripId) { await sleep(lat() - 90); const t = ownTrip(tripId); return tripJournal(t.id); },
  async accuracy(tripId) { await sleep(lat() - 70); const t = ownTrip(tripId); return estimateAccuracy(t.id); },
  async bias() { await sleep(lat() - 100); const u = requireAuth(); return userBias(u.id); },
  async saveJournal(tripId, body) {
    await sleep(lat() - 60); const t = ownTrip(tripId);
    const day = tripDays(t.id).find(x => x.dayNumber === Number(body.dayNumber));
    if (!day) throw new ApiError(404, "DAY_NOT_FOUND", "Không tìm thấy ngày trong chuyến");
    const note = (body.note || "").trim().slice(0, 280);
    let row = body.id ? S.db.journalEntries.find(x => x.id === Number(body.id)) : null;
    if (!row) {
      /* Một hoạt động một mục, một ngày một mục chung — khỏi đẻ ra hàng chục mẩu rời */
      row = S.db.journalEntries.find(x => x.tripId === t.id && x.dayId === day.id
        && (x.activityId || null) === (body.activityId ? Number(body.activityId) : null));
    }
    if (!row) {
      row = {
        id: nextId("journalEntries"), tripId: t.id, dayId: day.id,
        activityId: body.activityId ? Number(body.activityId) : null,
        note: "", mood: null, photoIds: [], at: nowISO(), updatedAt: nowISO()
      };
      S.db.journalEntries.push(row);
    }
    if (body.note != null) row.note = note;
    if (body.mood !== undefined) row.mood = body.mood || null;
    row.updatedAt = nowISO();
    /* Mục rỗng hoàn toàn thì xoá luôn, đừng để lại dòng trắng trong nhật ký */
    if (!row.note && !row.mood && !row.photoIds.length) {
      S.db.journalEntries = S.db.journalEntries.filter(x => x.id !== row.id);
      save(); return null;
    }
    save(); return row;
  },
  async deleteJournal(id) {
    await sleep(lat() - 90); requireAuth();
    const row = S.db.journalEntries.find(x => x.id === Number(id));
    if (!row) return { ok: true };
    await Promise.all((row.photoIds || []).map(pid => api.deletePhoto(pid).catch(() => { })));
    S.db.journalEntries = S.db.journalEntries.filter(x => x.id !== row.id);
    save(); return { ok: true };
  },

  /* ── Ảnh ─────────────────────────────────────────────────────────────────── */
  async addPhoto(tripId, body, file) {
    const t = ownTrip(tripId);
    const day = tripDays(t.id).find(x => x.dayNumber === Number(body.dayNumber));
    if (!day) throw new ApiError(404, "DAY_NOT_FOUND", "Không tìm thấy ngày trong chuyến");
    if (!/^image\//.test(file.type)) throw new ApiError(400, "NOT_AN_IMAGE", "Tệp này không phải ảnh");
    const db = await idbOpen();
    /* Không có kho ảnh thì NÓI THẲNG, không nhận rồi làm mất */
    if (!db) throw new ApiError(507, "PHOTO_STORE_UNAVAILABLE",
      "Trình duyệt này không cho lưu ảnh (thường gặp khi mở bằng file:// hoặc ở chế độ riêng tư). Bạn vẫn ghi được dòng cảm nhận.");
    let out;
    try { out = await compressImage(file); }
    catch (e) { throw new ApiError(400, "IMAGE_UNREADABLE", e.message); }
    const id = "ph_" + Math.random().toString(36).slice(2, 10);
    await idbPut(id, out.blob);
    const meta = {
      id, tripId: t.id, dayId: day.id, activityId: body.activityId ? Number(body.activityId) : null,
      w: out.w, h: out.h, bytes: out.blob.size, mime: "image/jpeg", thumb: out.thumb, at: nowISO()
    };
    S.db.photos.push(meta);
    const j = await api.saveJournal(t.id, { dayNumber: day.dayNumber, activityId: meta.activityId, note: undefined });
    const row = j || S.db.journalEntries.find(x => x.tripId === t.id && x.dayId === day.id && (x.activityId || null) === meta.activityId);
    if (row) { row.photoIds.push(id); row.updatedAt = nowISO(); }
    if (!save()) {   /* localStorage đầy → rút lại, đừng để siêu dữ liệu và byte lệch nhau */
      S.db.photos = S.db.photos.filter(x => x.id !== id);
      if (row) row.photoIds = row.photoIds.filter(x => x !== id);
      await idbDel(id);
      throw new ApiError(507, "STORAGE_FULL", "Hết chỗ lưu. Ảnh này chưa được giữ lại.");
    }
    return meta;
  },
  async deletePhoto(id) {
    requireAuth();
    const meta = S.db.photos.find(x => x.id === id);
    if (!meta) return { ok: true };
    await idbDel(id).catch(() => { });
    S.db.photos = S.db.photos.filter(x => x.id !== id);
    S.db.journalEntries.forEach(j => { j.photoIds = (j.photoIds || []).filter(x => x !== id); });
    save(); return { ok: true };
  },

  async participants(tripId) { await sleep(lat()); const t = ownTrip(tripId); return tripParts(t.id); },

  async removeParticipant(id) {
    await sleep(lat()); requireAuth();
    const pt = S.db.participants.find(x => x.id === Number(id));
    if (!pt) throw new ApiError(404, "PARTICIPANT_NOT_FOUND", "Không tìm thấy người này");
    if (pt.isMe) throw new ApiError(422, "CANNOT_REMOVE_SELF", "Không bỏ được chính bạn khỏi chuyến");
    const paid = S.db.expenses.filter(e => e.tripId === pt.tripId && e.paidBy === pt.id).length;
    if (paid) throw new ApiError(409, "PARTICIPANT_HAS_EXPENSES", "Người này đang đứng tên " + paid + " khoản chi. Sửa các khoản đó trước đã.");
    S.db.participants = S.db.participants.filter(x => x.id !== pt.id);
    S.db.expenses.filter(e => e.tripId === pt.tripId).forEach(e => { e.shareWith = (e.shareWith || []).filter(x => x !== pt.id); });
    save(); return { ok: true };

  async settlement(tripId) { await sleep(lat()); const t = ownTrip(tripId); return settleTrip(t.id); },

  async conversations(tripId) { await sleep(lat()); const t = ownTrip(tripId); return S.db.conversations.filter(c => c.tripId === t.id); },

  async proposal(id) { await sleep(lat()); requireAuth(); const p = S.db.proposals.find(x => x.id === Number(id)); if (!p) throw new ApiError(404, "PROPOSAL_NOT_FOUND", "Không tìm thấy đề xuất"); return p; },
  async rejectProposal(id) {
